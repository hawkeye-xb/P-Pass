name: system-codecs
description: >-
  装 libheif（含 HEVC 解码插件）、ffmpeg 等系统编解码库；.deb 走 actions/cache，命中时不再从 apt 镜像下载。
  ci-rust / e2e / artifacts 里凡是要这些库的 job 都引用这里。

# 为什么要缓存（2026-10-26）：Azure 的 Ubuntu apt 镜像间歇性慢到每个小包 10–60 秒，
# ffmpeg 连带 96 个包、约 67 MB，`test (nextest + windows cross-check)` 两次在这一步耗满 30 分钟
# job 超时被取消，测试一条没跑——同一天挡住了 PR 门禁和 v0.10.0-test.12 的发版。
#
# 缓存键 = 本次实际要下载的 .deb URI 清单的哈希：镜像上版本一变，清单就变，自动换新缓存，
# 不会把旧版本的包装进新镜像。命中时 apt 在 Dir::Cache::archives 里找到同名包，不再下载。
# 未命中时照常下载，并给下载加超时与重试；job 结束时 actions/cache 自动保存。
#
# 为什么要显式装 libde265-dev（#1230）：`--all-features` 会打开 `media-codec/vendored`，
# libheif-sys 从源码编 libheif，插件加载关掉、HEVC 解码器靠 cmake 找 libde265 头文件直接
# 编进去。24.04 的 libheif-dev（1.17）顺带依赖 libde265-dev，26.04 的（1.21）不再带，
# 找不到就静默编出一个不能解 HEIC 的 libheif（"Support for this compression format has
# not been built in"）。libheif-plugin-libde265 管系统库那条路，libde265-dev 管 vendored 这条路。
#
# ⚠️ composite action 的每个 run 步骤都必须写 shell:；actionlint 不扫本文件。

inputs:
  packages:
    description: 要装的 apt 包，空格分隔
    required: false
    default: libheif-dev libheif-plugin-libde265 libde265-dev ffmpeg libnuma-dev

runs:
  using: composite
  steps:
    - name: apt update + 算缓存键
      id: plan
      shell: bash
      env:
        PKGS: ${{ inputs.packages }}
      run: |
        set -euo pipefail
        sudo apt-get update -o Acquire::Retries=3
        dir="$RUNNER_TEMP/system-codecs-debs"
        mkdir -p "$dir/partial"
        # shellcheck disable=SC2086 # PKGS 是空格分隔的包名列表，需要分词
        sudo apt-get install -y --no-install-recommends --print-uris $PKGS \
          | { grep "^'" || true; } | awk '{print $2}' | sort > "$RUNNER_TEMP/system-codecs-uris.txt"
        # 每行形如 `'<uri>' <包名_版本_架构>.deb <大小> <校验和>`；取文件名（含版本）。
        # 不按 http 前缀匹配：GitHub 的 Ubuntu runner 用 mirror+file: 源，URI 不以 http 开头。
        n=$(wc -l < "$RUNNER_TEMP/system-codecs-uris.txt")
        echo "要下载的包：$n 个"
        # 清单为空说明解析失效（包已预装时除外），缓存键会退化成常量——直接判红，别悄悄失效。
        if [ "$n" -eq 0 ] && ! dpkg -s $PKGS >/dev/null 2>&1; then
          echo "::error::apt --print-uris 没解析出任何包，缓存键无效"; exit 1
        fi
        {
          echo "dir=$dir"
          echo "key=system-codecs-${{ runner.os }}-${{ runner.arch }}-${ImageOS:-unknown}-$(sha256sum "$RUNNER_TEMP/system-codecs-uris.txt" | cut -c1-16)"
        } >> "$GITHUB_OUTPUT"

    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.plan.outputs.dir }}/*.deb
        key: ${{ steps.plan.outputs.key }}

    - name: 安装
      shell: bash
      env:
        PKGS: ${{ inputs.packages }}
        DEBS: ${{ steps.plan.outputs.dir }}
      run: |
        set -euo pipefail
        echo "缓存里已有 $(find "$DEBS" -maxdepth 1 -name '*.deb' | wc -l) 个 .deb"
        # 下载限时 15 分钟（job 自身 30 分钟），超时直接失败，别把整个 job 耗死在下载上。
        # shellcheck disable=SC2086
        sudo timeout 900 apt-get install -y --no-install-recommends \
          -o Acquire::Retries=3 -o Acquire::http::Timeout=30 \
          -o Dir::Cache::archives="$DEBS" $PKGS
        # 包落在 $DEBS 里归 root；改回 runner 用户，actions/cache 保存时才读得到。
        sudo chown -R "$(id -u):$(id -g)" "$DEBS"
