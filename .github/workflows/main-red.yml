# main 红了自动开卡（#1469）：main 上 push 触发的 CI 流水线失败 → 开 / 更新「[MAIN-RED] <workflow>」卡，
# 列出上次全绿到这次红之间的 PR；同一流水线转绿 → 自动关卡。逻辑全在 tools/flow/main-red.sh。
# main 上的 push 触发由 #1468 加；在那之前这里不会被触发（workflow_run 只认已存在的 run）。
#
# 安全：workflow_run 在默认分支上下文里跑、带写权限，所以只检出 main（不检出触发 run 的提交），
# 事件里的字段一律经 env 传入，不拼进 shell 命令行。
name: Main Red

on:
  workflow_run:
    workflows: ["CI Rust", "CI Desktop", "CI Android", "CI iOS", "CI Docs"]
    types: [completed]

permissions:
  issues: write
  actions: read
  contents: read

concurrency:
  group: main-red-${{ github.event.workflow_run.name }}
  cancel-in-progress: false

jobs:
  main-red:
    name: main-red (main 红了开卡)
    if: github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - name: 开 / 更新 / 关卡
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          WORKFLOW: ${{ github.event.workflow_run.name }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          EVENT: ${{ github.event.workflow_run.event }}
        run: bash tools/flow/main-red.sh
