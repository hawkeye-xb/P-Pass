[package]
name = "daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
proto = { path = "../proto" }
# #1118：配对验证码（SPAKE2 + 密钥确认），与手机共用同一份内核。
pair-pake = { path = "../pair-pake" }
blake3 = "1"
# #1149：自报设备名清洗 Unicode 格式字符（Cf）——标准库没有通用类别查询；这个 crate 已在依赖树里。
unicode-properties = { version = "0.1", default-features = false, features = ["general-category"] }
transport = { path = "../transport" }
storage = { path = "../storage" }
core-index = { path = "../core-index" }
platform = { path = "../platform" }
media-codec = { path = "../media-codec" }
diag = { path = "../diag" }
# #1044 B13: 版本关系的唯一实现（与桌面壳共用）。
version-cmp = { path = "../version-cmp" }
# base64 for in-frame thumbnail bytes (already in tree via storage).
base64 = "0.22"
thiserror.workspace = true
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
futures-core = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util"] }
# SYNC-03: per-NodeId cancellation handle for the QUIC subscribe registry —
# same primitive tokio itself ships for "cancel this task from outside",
# not a hand-rolled channel.
tokio-util = "0.7"
# WATCH-01: cross-platform filesystem watching (FSEvents/inotify/ReadDirChangesW).
notify = "7"
# OS randomness for one-time pairing tokens (T-031). Already in the tree
# via iroh; declared directly because tokens are a security surface.
getrandom = "0.3"
hex = "0.4"
interprocess = { version = "2", features = ["tokio"] }
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# #1122：配对窗口内未配对对端共用一份请求额度（现成库，不自己写令牌桶）；#1269：已出示令牌的手机另有一份。
governor = "0.10"
# #1122：版本不符登记表等按设备增长的表有上限、按最近使用淘汰。
lru = "0.18"

[dev-dependencies]
tempfile = "3"
pair-pake = { path = "../pair-pake" }
# #763：让目录拒绝新建文件（平台分叉只许在 platform crate，测试脚手架同理）。
platform = { path = "../platform", features = ["test-support"] }
blake3 = "1"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
