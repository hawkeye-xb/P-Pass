<title>P-Pass · Sample images</title>
<style>
  :root { color-scheme: light dark; --fg:#111; --bg:#fff; --muted:#666; --line:#e5e5e5; }
  @media (prefers-color-scheme: dark) { :root { --fg:#eee; --bg:#111; --muted:#9a9a9a; --line:#2a2a2a; } }
  body { margin:0; padding:20px 16px 48px; font:16px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;
         color:var(--fg); background:var(--bg); max-width:520px; margin-inline:auto; }
  h1 { font-size:20px; margin:0 0 6px; }
  p { margin:0 0 16px; color:var(--muted); font-size:14px; }
  img { display:block; width:100%; height:auto; border-radius:12px; border:1px solid var(--line); margin:0 0 16px; }
  a { color:inherit; }
</style>
</head>
<body>
<!-- 审核员相册为空时用：长按保存到「照片」，再回 P-Pass 备份。图是程序生成的插画，无版权、无人像。 -->
<h1>Sample images</h1>
<p>On the iPhone, long-press an image and choose <b>Save to Photos</b> (or <b>Add to Photos</b>), then return to P-Pass and back it up.<br>
在 iPhone 上长按图片，选「存储到照片」，再回到 P-Pass 备份。</p>
