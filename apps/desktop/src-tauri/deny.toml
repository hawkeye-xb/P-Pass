# cargo-deny configuration for the P-Pass desktop shell (src-tauri).
# Run: cd apps/desktop/src-tauri && cargo deny check advisories licenses bans
#
# ── 为什么这里有第二份 deny.toml（SEC-09 #376）──────────────────────────
# `apps/desktop/src-tauri` 是**刻意独立的 workspace**（ADR-012：巨大的 Tauri
# 依赖树不进主 workspace 的 build/CI）。代价是：根 `deny.toml` 与 `ci-rust` 的
# `license + dependency audit` job 只审主 workspace，**这棵 538 个包的树在
# #376 之前从来没有被审过** —— 而它正是编进桌面端、发给用户的那一棵。
#
# 落地时实测过「复用根那份」这条路，**不可行**：根那份的 ignore 项是给主
# workspace 的依赖树写的（notify / iroh / iroh-blobs），拿到这里一条都不匹配，
# 立刻冒出 4 条 `advisory-not-detected` / `license-not-encountered` 噪音；更要紧
# 的是会把两棵毫无交集的依赖树的 ignore 清单焊在一起 —— 一边清掉一条，另一边
# 就报告有未命中项。所以两份分开，各自只写自己树里真实存在的东西。
#
# ⚠️ 与根那份的分工：根管 `crates/**`（主 workspace），本份管 src-tauri。
#    两份**不要互相抄** —— 抄来的未命中项会变成噪音，噪音会训练人忽略告警。

[graph]
# 与根那份同口径：不开 all-features。src-tauri 的 feature 由 Cargo.toml 钉死。
all-features = false
# #1022：只审桌面端**真正发出去**的平台（release.yml：macos-arm64 + Windows
# NSIS）。不设时 cargo-deny 把所有平台的 cfg 依赖都算进来——Linux 专属的
# zbus 一线（tauri-plugin-opener / single-instance 的 D-Bus 实现）因此报了
# RUSTSEC-2026-0370/0371/0372，而那些代码根本不在任何一个安装包里。
# 🔁 桌面端开始发新平台（Linux / Intel Mac）时，先把它的三元组加到这里。
targets = [
  "aarch64-apple-darwin",
  "x86_64-pc-windows-msvc",
]

[advisories]
yanked = "deny"
ignore = [
  # `unic-*` 全家（RUSTSEC-2025-0075/0080/0081/0098/0100）——**unmaintained，
  # 不是漏洞**（informational）。五条同一个根因，链路也是同一条：
  #   unic-ucd-* / unic-char-* / unic-common
  #     └── urlpattern 0.3.0
  #         └── tauri-utils 2.9.3
  #             └── tauri 2.11.5（以及 tauri-build / tauri-runtime-wry 等）
  # 公告原文写着 `Solution: No safe upgrade is available!` —— rust-unic 整个项目
  # 已停止维护，而 urlpattern 仍在用它，我们对这条链路没有可选项：既不能换
  # tauri，也不能让 tauri 换 urlpattern。
  # 🔁 重估触发条件：升级 `tauri` 时（届时看 tauri-utils 是否已换掉
  #    urlpattern，或 urlpattern 是否已换掉 unic-*），把这五条逐条重试一遍。
  "RUSTSEC-2025-0075", # unic-char-range
  "RUSTSEC-2025-0080", # unic-common
  "RUSTSEC-2025-0081", # unic-char-property
  "RUSTSEC-2025-0098", # unic-ucd-version
  "RUSTSEC-2025-0100", # unic-ucd-ident
  # （#1022：原先这里豁免过 `proc-macro-error` RUSTSEC-2024-0370，链路是
  # gtk3-macros ← gtk 0.18，Linux 专属。[graph] targets 收窄到发布平台后它
  # 不再出现，删掉。桌面端开始发 Linux 时它会回来，届时再议。）
  # #1022：`zip 4.6.1` 的三个解压漏洞（RUSTSEC-2026-0367/0368/0369，修复要
  # zip >= 9）。我们自己的直接依赖已是 9.0.3（SEC-15 #1003）；剩下这份是：
  #   zip 4.6.1
  #     └── tauri-plugin-updater 2.x（仅 Windows：解压更新包）
  # 插件最新版 2.14.0 / 3.0.0-alpha.3 仍要求 `zip ^4`，我们无从升级。
  # 不受影响的理由（三条都是「解压攻击者构造的压缩包」）：
  #   - updater 解压前先用 tauri.conf.json 里的 minisign `pubkey` 验签，
  #     压缩包只可能是我们自己签发的；伪造它要先拿到签名私钥。
  #   - 0367 是 Unix SUID/SGID 位，这条链只编进 Windows 包，不适用。
  # （想加 `expiry` 到期复查：cargo-deny 0.20.2 还不支持，主干已合未发版。）
  # 🔁 删除条件：升级 tauri-plugin-updater 后它不再依赖 zip 4（`cargo tree
  #    -i zip@4.6.1` 报找不到），删掉这三条——cargo-deny 届时也会报未命中。
  # （原先这里那条 `zip@4.6.1` yank 豁免已删：上游已撤销 yank，它成了未命中项。）
  { id = "RUSTSEC-2026-0367", reason = "updater 包先验签再解压，且仅 Windows；见 #1022" },
  { id = "RUSTSEC-2026-0368", reason = "updater 包先验签再解压，且仅 Windows；见 #1022" },
  { id = "RUSTSEC-2026-0369", reason = "updater 包先验签再解压，且仅 Windows；见 #1022" },
]

[licenses]
# ⚠️ 这份清单只列**本树里真实出现且被选中**的许可。多许可 crate（如 r-efi 的
# `MIT OR Apache-2.0 OR LGPL-2.1-or-later`）由 cargo-deny 挑第一个被允许的，
# 所以 LGPL 虽然出现在 `cargo deny list` 里，实际选中的是 MIT，不需要放行。
allow = [
  "MIT",
  "Apache-2.0",
  "BSD-3-Clause",
  "MPL-2.0",
  "ISC",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
  # （#1022：`CDLA-Permissive-2.0` 已删——只有 webpki-root-certs 用它，经
  # rustls-platform-verifier 只编进 Android，不在 [graph] targets 里。）
  "CC0-1.0",
  "0BSD",
  "Apache-2.0 WITH LLVM-exception",
  # SEC-15 (#1003)：原先这里放行过 `bzip2-1.0.6`（zip 5 默认特性带进来的
  # bzip2 链，SEC-09 #376 加）。zip 升到 9 并只开 deflate 后这条链没了，删掉。
]
confidence-threshold = 0.8
# 自家 crate（p-pass-desktop、platform，都是 AGPL-3.0）不参与许可检查。
private = { ignore = true }

[bans]
# 与根那份同口径：重复版本记 warn 不记 deny。
# 本树实测 26 条（#1022 收窄到发布平台后；全平台时是 31） `warning[duplicate]` —— Tauri 的依赖树横跨 gtk / objc2 /
# windows-sys 三套平台绑定，同一个 crate 出现多个大版本是常态（例如
# windows-sys 有 0.45/0.52/0.59/0.60/0.61 五个）。设 deny 会把这条门禁变成
# 一条永远红的检查，而我们对上游的版本收敛毫无影响力。
# ⚠️ 这是**刻意降级，不是默默放过**：26 条的数字记在这里，哪天它明显变大
#    （比如翻倍），说明有人引入了新的重复源，值得去看一眼。
multiple-versions = "warn"
deny = []
