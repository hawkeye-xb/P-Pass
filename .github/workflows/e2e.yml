# E2E-01: android live scenarios (android-hello/pair/backup) in CI.
# 防协议回归：Kotlin 侧走真实 iroh-ffi 栈（linux-x86-64 natives 在 Maven
# jar 内，无需模拟器），连一个临时 release daemon，断言
# HELLO OK / PAIR OK / BACKUP OK 三行（12/12 指标见剧本脚本输出）。
#
# CI-01（2026-08-12）并轨：T-070 failure scenarios（huge file / crash
# recovery / disk full）从每推（旧 pr.yml）挪到本 workflow——nightly +
# tag 前门禁（它抓真 bug 但不该每推都烧 release 构建）。e2e job 触发
# 条件不动（nightly/tag/labeled/dispatch），scenarios job 同门禁。
#
# 运行时机（2026-08-04 用户裁决：自动化测试不前置）：
#   - nightly 定时（schedule）
#   - release tag 时并行跑（不阻塞 release 构建——tag 触发与 release.yml
#     并行，产物照出，e2e 结果供发布前人工核对）
#   - 选择性：PR 打 e2e label，或手动 dispatch
#   - 每 commit 不跑（PR 常规 push 不触发本 workflow）

name: E2E live scenarios

on:
  schedule:
    - cron: "30 3 * * *"
  push:
    tags: ["v*"]
  pull_request:
    branches: [main]
    types: [labeled, unlabeled]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: android live (hello/pair/backup)
    runs-on: ubuntu-latest
    timeout-minutes: 50
    # PR 只有打了 e2e label 才跑（labeled 事件但 label 不在 = 移除，跳过）
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'e2e')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set Rust toolchain from rust-toolchain.toml
        shell: bash
        run: tools/setup-rust-toolchain.sh

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: e2e-${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      # 抄 scenarios job：daemon release 构建需要 libheif-dev（vendored
      # 编译）+ HEVC 解码插件；ffmpeg 供视频首帧测试。ubuntu-latest runner
      # 自带 Android SDK，JVM 测试无需额外安装。
      - name: System codecs (libheif + HEVC plugin, ffmpeg)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libheif-dev libheif-plugin-libde265 ffmpeg libnuma-dev

      # iroh 1.1.0 的 uniffi 绑定 class 是 JDK 21 编译（major 65，实测），
      # JDK 17 加载报 UnsupportedClassVersionError（pr.yml android job 用 17
      # 是因为 DaemonHelloTest 无 QR 被跳过、不触 iroh ffi 类；e2e 真跑必 21）
      - name: Setup Java (21)
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4

      - name: Build release daemon
        run: cargo build --release -p daemon

      # 三剧本 = T-051/T-052/T-054 live 验收脚本：起临时 daemon（127.0.0.1
      # 随机端口，无 relay），JVM 测试经真实 iroh-ffi 栈连它。
      - name: Run android live scenarios
        run: |
          bash tools/android-hello.sh
          bash tools/android-pair.sh
          bash tools/android-backup.sh

  # CI-01: T-070 failure scenarios 从每推挪到 nightly + tag 前门禁——
  # 它抓真 bug 但不该每推都烧 release 构建（旧 pr.yml 每 push 全跑
  # 四 job 是验收人点名的病灶①）。触发门禁与 e2e job 相同：
  # nightly/tag/labeled/dispatch，纯 docs/卡片提交零触发。
  scenarios:
    name: T-070 failure scenarios (process-level)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'e2e')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set Rust toolchain from rust-toolchain.toml
        shell: bash
        run: tools/setup-rust-toolchain.sh
      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: System codecs
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libheif-dev libheif-plugin-libde265 ffmpeg libnuma-dev
      - name: Build release binaries
        run: cargo build --release -p daemon -p testclient
      - name: Run scenarios (huge file / crash recovery / disk full)
        run: |
          bash tools/scenarios/huge_file.sh
          bash tools/scenarios/crash_recovery.sh
          bash tools/scenarios/disk_full.sh
