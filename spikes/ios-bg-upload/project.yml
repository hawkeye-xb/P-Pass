# IOS-03（#332）spike：最小 App + com.apple.photos.background-upload 扩展。一次性工程，不进主 App。
# 生成：xcodegen generate --spec project.yml（.xcodeproj 不入库）。只做模拟器 ad-hoc 签名，不需要开发者证书。
name: BgUploadSpike
options:
  deploymentTarget:
    iOS: "26.4"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    SPIKE_PORT: "8765"
    # 缺这两项时 simctl install 报 IXErrorDomain 2「Invalid placeholder attributes / Failed to create app extension placeholder」（实测）。
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
targets:
  BgUploadSpike:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - target: UploadExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hawkeyexb.ppass.bgspike
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Spike: background upload of photos."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_FILE: App/Info.plist
  UploadExtension:
    type: extensionkit-extension
    platform: iOS
    sources:
      - UploadExtension
      - App/SpikeJobs.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hawkeyexb.ppass.bgspike.upload
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: UploadExtension/Info.plist
