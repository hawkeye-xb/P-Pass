[package]
name = "platform"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
# QA-09 迁移（#211 / #287）：只给测试用的平台能力（造「指向目录的链接」）。
# 默认关闭 —— 关着时 src/test_support.rs 整个不参与编译，产品二进制里不会
# 多出任何东西。消费方在 [dev-dependencies] 里开它。
test-support = []

[dependencies]
thiserror.workspace = true

# QA-09 迁移（#211）：statvfs（卷容量水位 / DAE-05）。原先这个调用长在
# crates/daemon 里，libc 也声明在那边；迁进来之后 daemon 不再需要它。
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# HKCU Run key (user-level autostart, §4).
winreg = "0.55"
# SetThreadExecutionState + DPAPI.
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Power",
  "Win32_Security_Cryptography",
  # DAE-05: GetDiskFreeSpaceExW（卷容量水位）。
  "Win32_Storage_FileSystem",
  # DESK-22 (#171): ShellExecuteExW + runas 动词拉 UAC（提权改电源设置）。
  "Win32_UI_Shell",
  # SHELLEXECUTEINFOW 里有个 HKEY 字段，windows-sys 因此把整个结构体连同
  # ShellExecuteExW 一起挂在这个 feature 下——不开的话报"no ShellExecuteExW"，
  # 看着像名字写错，其实是被 cfg 掉了。
  "Win32_System_Registry",
  # 同上：SW_HIDE —— 被提权拉起的是 console 程序，不隐藏就会闪黑窗
  # （DESK-19 #168 那一类）。
  "Win32_UI_WindowsAndMessaging",
  # 同上：等提权进程结束并取退出码。
  "Win32_System_Threading",
] }

# DESK-16 (#165)：Windows 的系统缩略图走 COM（IShellItemImageFactory），
# 而 windows-sys 是裸 FFI —— 没有 IUnknown/Interface 那套，做 COM 要手搓
# vtable，写对的成本远高于收益。所以这里用高层 `windows` crate。
# ⚠️ 它**不是新引入的 crate**：`cargo tree -i windows@0.62.2 --target
#    x86_64-pc-windows-msvc` 显示它早已在主 workspace 的 Windows 依赖树里
#    （netwatch ← iroh ← iroh-blobs ← transport ← daemon），这里只是提为
#    直接依赖并多开几个 feature。
windows = { version = "0.62", features = [
  "Win32_Foundation",
  # CoInitializeEx / CoUninitialize —— COM 必须先初始化线程套间。
  "Win32_System_Com",
  # SHCreateItemFromParsingName + IShellItemImageFactory。
  "Win32_UI_Shell",
  # GetDIBits / BITMAP / DeleteObject —— 把 HBITMAP 变成像素要走 GDI。
  "Win32_Graphics_Gdi",
] }

[dev-dependencies]
# fsevents_shapes 集成测试（macOS 目录监听平台行为实测）：直接驱动 notify。
notify = "7"
tempfile = "3"
