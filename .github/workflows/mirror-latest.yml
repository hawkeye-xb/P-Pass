# 国内下载镜像：把已发布 release 的 dmg / apk 覆盖到 R2 固定地址
#   https://p-pass-dl.hawkeye-xb.com/P-Pass-latest.dmg
#   https://p-pass-dl.hawkeye-xb.com/P-Pass-latest.apk
#   https://p-pass-dl.hawkeye-xb.com/P-Pass-latest.json   （版本号 + sha256，核对用）
# 中文官网下载按钮指向这里（site/src/consts.ts MIRROR_*）。
#
# 和 release.yml **完全解耦**：2026-08-25 撤掉旧镜像，原因是镜像步骤写在
# release job 里、manifest 先写了镜像地址再镜像，镜像 403 时坏 manifest 已
# 签名出门（见 release.yml UPD-01 注释）。这里只读已发布的 release 资产，
# 失败只让本 workflow 红，不碰 release、不碰自动更新 manifest。
#
# 触发：
# **R2 只承载 stable**（UPD-18 #706）：`-test.` tag 任何触发方式都不镜像。
# test 通道读 GitHub 上的 test-channel 滚动指针，R2 上本就没有它的东西；而
# 这里覆盖的固定 key（P-Pass-latest.*、分端清单、冻结的 manifest.json）全是
# stable 设备与官网下载在读——test 覆盖上来 = stable 设备被推 test 包。
#
# - workflow_run：Release **结束**后（不论成败）。workflow_run 要等整条 Release 跑完
#   （含最慢的 Windows lane，约 30 分钟）才触发——发布后到镜像更新之间
#   这段空窗是预期的，不是没触发。
#   不看 conclusion：镜像只要 dmg + apk，Windows / 正文补齐这类与镜像无关
#   的 job 红了不该连带镜像不更新（v0.5.0-test.1/2/3 就是 Windows 红、
#   dmg/apk 都在）。真缺资产由下面的「两个都要有」检查报红。
#   仍是 draft 的（如 -beta.N / 正式版）跳过。
#   正式版 tag 在 Release 跑完时 release 还没建（人工发布在那之后），
#   同样跳过、等 release published 兜底——不跳过就是 #21~#29 那种必红。
# - release published：非 test tag 人工点发布那一刻（prerelease 或 latest
#   都算 published）。人工发布时资产还没传齐 → 这次红；Release 跑完后
#   workflow_run 那条会再镜像一次，谁晚到谁兜底。
#   ⚠️ release 事件用的是 **tag 所指 commit** 上的本文件，不是 main 上的。
# - workflow_dispatch：补跑，或指定旧 tag 回滚（不做「最新」检查）。
#
# 只镜像「最新发布」：自动触发时，若已有更晚发布的非 test v* release，跳过。
# 两个 tag 的 Release 并行跑时，先发布的那个可能后跑完，不拦会用旧包
# 覆盖新包（v0.6.2-test.2 / test.3 就是 12 分钟内先后打的）。
name: Mirror latest to R2

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "要镜像的 release tag（如 v0.6.2-test.1）"
        required: true

permissions:
  contents: read

concurrency:
  group: mirror-latest
  cancel-in-progress: false

env:
  BUCKET: p-pass-releases
  PUBLIC_BASE: https://p-pass-dl.hawkeye-xb.com

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # UPD-18（#706）：判定逻辑在 tools/mirror-resolve-tag.sh（有测试：
      # tools/test-mirror-resolve-tag.sh）。只取这一个文件，版本与本 workflow 文件
      # 同一 commit（workflow_sha）——不取 tag 上的旧版，免得旧 tag 带着旧判定。
      - name: Checkout resolver
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 1
          path: ci
          sparse-checkout: tools/mirror-resolve-tag.sh
          sparse-checkout-cone-mode: false

      - name: Resolve tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RUN_REF: ${{ github.event.workflow_run.head_branch }}
        run: bash ci/tools/mirror-resolve-tag.sh

      # 2026-10-04 事故：本 job 从不 checkout 仓库 ⇒ 下面那条 node 调用必然
      # MODULE_NOT_FOUND，dmg/apk 传完就整条挂、manifest 一个都没镜像
      #（v0.9.0 首次暴露：#650 加的 rebase 步骤过去只在「tag 指向的旧 workflow」
      # 里存在，从来没真执行过）。checkout 到 repo/ 子目录，避开下载目录 dl/。
      - name: Checkout repo (给 manifest 脚本用)
        if: steps.tag.outputs.skip != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.tag.outputs.tag != '' && steps.tag.outputs.tag || 'main' }}
          fetch-depth: 1
          path: repo

      - name: Download release assets
        if: steps.tag.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p dl && cd dl
          # UPD-15（#685）：产物名带该端版本号 ⇒ 用 glob 下载、再定位实际文件名。
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" \
            -p 'P-Pass_*_macos-arm64.dmg' -p 'P-Pass_*_android*.apk' -p 'manifest.json' \
            -p 'P-Pass_*_macos-arm64.app.tar.gz' -p 'manifest-android.json' -p 'manifest-macos.json'
          DMG=$(find . -maxdepth 1 -name 'P-Pass_*_macos-arm64.dmg' | head -1)
          APK=$(find . -maxdepth 1 -name 'P-Pass_*_android*.apk' | head -1)
          UPD=$(find . -maxdepth 1 -name 'P-Pass_*_macos-arm64.app.tar.gz' | head -1)
          # 三个都要有才镜像：只覆盖一个会让 dmg 和 apk 版本错开；#650 起 manifest 也要镜像。
          for f in "$DMG" "$APK" manifest.json; do
            [ -s "$f" ] || { echo "::error::$TAG 缺少 $f"; exit 1; }
          done
          # UPD-13（#660）：分端清单 + macOS 更新产物存在才镜像。缺了不报红——
          # 客户端对每一项都有 GitHub 兜底；这里只如实提示，免得旧 tag 补跑时误红。
          # UPD-14（#672）：**稳定版不许缺件**——缺分端清单 / macOS 更新产物就红。
          # 2026-10-05 v2026.10.1 事故：这两类缺件原先只打 notice ⇒ R2 上保留上一版的
          # 分端清单 ⇒ 客户端读到「陈旧但明确」的答案就不再问下一个源 ⇒ 被钉在旧版。
          # test 通道仍只提示（test 指针不依赖分端清单）。
          for f in "$UPD" manifest-android.json manifest-macos.json; do
            if [ -s "$f" ]; then continue; fi
            if [[ "$TAG" == *-test.* ]]; then
              echo "::notice::$(basename "$f") 不在本次 release 里，跳过镜像（test 通道）"
            else
              echo "::error::$TAG 缺 $(basename "$f")——稳定版不许缺分端清单/更新产物，拒绝半份镜像"
              exit 1
            fi
          done
          ls -l

      - name: Upload to R2
        if: steps.tag.outputs.skip != 'true'
        env:
          # 走 S3 接口 + 只授权 p-pass-releases 一个桶的 R2 访问密钥。不用
          # wrangler：它走 REST 接口，只认账号级「Workers R2 Storage: Edit」，
          # 桶级授权的 token 一律 403（2026-08-12、2026-09-30 两次实测）。
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          # 新版 aws cli 默认附带 CRC 校验头，R2 不一定全认；只在必须时算。
          AWS_REQUEST_CHECKSUM_CALCULATION: WHEN_REQUIRED
          AWS_RESPONSE_CHECKSUM_VALIDATION: WHEN_REQUIRED
          ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          VERSION: ${{ steps.tag.outputs.version }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          : "${AWS_ACCESS_KEY_ID:?R2_ACCESS_KEY_ID secret missing}"
          cd dl
          DMG=$(find . -maxdepth 1 -name 'P-Pass_*_macos-arm64.dmg' | head -1)
          APK=$(find . -maxdepth 1 -name 'P-Pass_*_android*.apk' | head -1)
          UPD=$(find . -maxdepth 1 -name 'P-Pass_*_macos-arm64.app.tar.gz' | head -1)
          # 该端版本号 = 分端清单里的顶层 version（就是这次发布给该端的号）；
          # 清单不在（老 tag 补跑）时回退 release/versions.json。
          if [ -s manifest-macos.json ]; then
            D_VER=$(jq -r .version manifest-macos.json)
          else
            D_VER=$(jq -r .desktop ../repo/release/versions.json)
          fi
          if [ -s manifest-android.json ]; then
            A_VER=$(jq -r .version manifest-android.json)
          else
            A_VER=$(jq -r .android ../repo/release/versions.json)
          fi
          echo "desktop=$D_VER android=$A_VER"
          put() { # key file content-type cache-control [download-name]
            args=(--endpoint-url "$ENDPOINT" --no-progress --content-type "$3" --cache-control "$4")
            [ -n "${5:-}" ] && args+=(--content-disposition "attachment; filename=\"$5\"")
            aws s3 cp "$2" "s3://$BUCKET/$1" "${args[@]}"
          }
          # 固定文件名每次覆盖；边缘缓存 5 分钟，覆盖后最多 5 分钟生效。
          # 下载文件名 = 产物名本身（UPD-15：P-Pass_<该端版本>_…），用户下完与 App 里的号一致。
          put P-Pass-latest.dmg "$DMG" application/x-apple-diskimage "public, max-age=300" "$(basename "$DMG")"
          put P-Pass-latest.apk "$APK" application/vnd.android.package-archive "public, max-age=300" "$(basename "$APK")"
          # UPD-15：批次号（tag）与两端版本号各自成字段，不再拿批次号冒充版本号。
          jq -n --arg tag "$TAG" --arg desktop "$D_VER" --arg android "$A_VER" \
            --arg dmg "$(sha256sum "$DMG" | cut -d' ' -f1)" \
            --arg apk "$(sha256sum "$APK" | cut -d' ' -f1)" \
            '{tag:$tag, desktop:$desktop, android:$android, sha256:{dmg:$dmg, apk:$apk}}' > latest.json
          cat latest.json
          put P-Pass-latest.json latest.json application/json "public, max-age=60"

          # UPD-13（#660）：**版本化不可变副本**。老格式兼容清单
          # （release/legacy-manifest.json，冻结在 0.9.0）指向的就是这些 key ——
          # 固定 key 会被下一版覆盖、签名就对不上字节，所以旧客户端必须有一个
          # 永不改写的地址。immutable 长缓存，代价可忽略。
          # ⚠️ 冻结件（release/legacy-manifest.json）指向的是 v0.9.0 那批**旧名字**的
          # 副本 —— 那些对象不删不覆盖，永远有效；新发布的副本用新名字，两者并存。
          put "releases/$TAG/$(basename "$DMG")" "$DMG" \
            application/x-apple-diskimage "public, max-age=31536000, immutable"
          put "releases/$TAG/$(basename "$APK")" "$APK" \
            application/vnd.android.package-archive "public, max-age=31536000, immutable"
          if [ -s "$UPD" ]; then
            put "releases/$TAG/$(basename "$UPD")" "$UPD" \
              application/gzip "public, max-age=31536000, immutable"
          fi

          # #650：**更新 manifest 也镜像到 R2**（android 条目 URL 改写成 R2 直链）。
          # 客户端更新源的候选列表是 [R2, GitHub]，第一项就是这份文件——R2 上没有它，
          # 链式兜底就永远只能靠 GitHub（= 国内慢的根因没解决）。
          # 只动 url：signature / sha256 都是对资产字节的，换下载域名不影响校验。
          #
          # UPD-13（#660）起按**内容**分两种情况（比看 tag 更稳，v0.9.0 这种
          # 过渡期的正式版仍是动态清单）：
          #   - URL 已经指向本域（冻结的老格式兼容件，见 release/legacy-manifest.json）
          #     ⇒ **原样搬运**。绝不能 rebase 到 P-Pass-latest.*：那些固定 key 会被
          #     下一版覆盖 ⇒ 签名与字节对不上 ⇒ 旧客户端升不上去。
          #   - 其它（test tag 指针、过渡期正式版）⇒ 照旧 rebase 到镜像固定直链。
          if jq -e --arg base "$PUBLIC_BASE"               '(.platforms["android-arm64"].url // "") | startswith($base)' manifest.json >/dev/null; then
            put manifest.json manifest.json application/json "public, max-age=60"
          else
            node "$GITHUB_WORKSPACE/repo/tools/make-update-manifest.mjs" --rebase manifest.json \
              --asset-base "$PUBLIC_BASE" --mirror android-arm64=P-Pass-latest.apk --out manifest-r2.json
            put manifest.json manifest-r2.json application/json "public, max-age=60"
          fi

          # UPD-13（#660）：**分端清单**也镜像。各自只含本端条目，顶层 version 是
          # 本端版本号；URL 改写成 R2 固定直链（macOS 更新产物先用下面的固定 key
          # 落盘，再改 URL——顺序反了会指向还不存在的对象）。
          if [ -s "$UPD" ]; then
            put P-Pass-latest.app.tar.gz "$UPD" application/gzip "public, max-age=300" "$(basename "$UPD")"
          fi
          if [ -s manifest-android.json ]; then
            node "$GITHUB_WORKSPACE/repo/tools/make-update-manifest.mjs" --rebase manifest-android.json \
              --asset-base "$PUBLIC_BASE" --mirror android-arm64=P-Pass-latest.apk --out manifest-android-r2.json
            put manifest-android.json manifest-android-r2.json application/json "public, max-age=60"
          fi
          if [ -s manifest-macos.json ]; then
            node "$GITHUB_WORKSPACE/repo/tools/make-update-manifest.mjs" --rebase manifest-macos.json \
              --asset-base "$PUBLIC_BASE" --mirror darwin-aarch64=P-Pass-latest.app.tar.gz --out manifest-macos-r2.json
            put manifest-macos.json manifest-macos-r2.json application/json "public, max-age=60"
          fi

      - name: Verify via public domain
        if: steps.tag.outputs.skip != 'true'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          # 带 tag 查询串绕过边缘缓存，确认公网拿到的就是刚传的字节。
          cd dl
          DMG=$(find . -maxdepth 1 -name 'P-Pass_*_macos-arm64.dmg' | head -1)
          APK=$(find . -maxdepth 1 -name 'P-Pass_*_android*.apk' | head -1)
          for pair in "P-Pass-latest.dmg:$(basename "$DMG")" "P-Pass-latest.apk:$(basename "$APK")"; do
            key=${pair%%:*}; src=${pair#*:}
            got=$(curl -fsSL --retry 3 "$PUBLIC_BASE/$key?v=$TAG" | sha256sum | cut -d' ' -f1)
            want=$(sha256sum "$src" | cut -d' ' -f1)
            [ "$got" = "$want" ] || { echo "::error::$key sha256 不符：公网 $got / 本地 $want"; exit 1; }
            echo "$key OK $got"
          done
          # #650：R2 上的 manifest 必须版本一致、且 android 条目指向镜像直链
          #（客户端候选列表第一项就是它——错了会让链式兜底白跑一趟 R2）。
          curl -fsSL --retry 3 "$PUBLIC_BASE/manifest.json?v=$TAG" > manifest-r2.json
          want_ver=$(jq -r .version manifest.json); got_ver=$(jq -r .version manifest-r2.json)
          [ "$got_ver" = "$want_ver" ] || { echo "::error::R2 manifest 版本不符：公网 $got_ver / 本地 $want_ver"; exit 1; }
          got_url=$(jq -r '.platforms["android-arm64"].url' manifest-r2.json)
          case "$got_url" in
            "$PUBLIC_BASE/releases/"*) ;;   # 冻结件：指向版本化不可变副本
            "$PUBLIC_BASE/P-Pass-latest.apk") ;;  # 动态清单：已 rebase 到镜像直链
            *) echo "::error::R2 manifest 的 android url 不对：$got_url"; exit 1 ;;
          esac
          echo "R2 manifest OK version=$got_ver url=$got_url"
          # UPD-13：分端清单——**只动过 url**，所以公网版本必须与本地 release 文件逐字相同。
          if [ -s manifest-android.json ]; then
            curl -fsSL --retry 3 "$PUBLIC_BASE/manifest-android.json?v=$TAG" > m-android-r2.json
            want=$(jq -r .version manifest-android.json); got=$(jq -r .version m-android-r2.json)
            [ "$got" = "$want" ] || { echo "::error::R2 manifest-android 版本不符：公网 $got / 本地 $want"; exit 1; }
            u=$(jq -r '.platforms["android-arm64"].url' m-android-r2.json)
            [ "$u" = "$PUBLIC_BASE/P-Pass-latest.apk" ] || { echo "::error::R2 manifest-android url 不对：$u"; exit 1; }
            echo "R2 manifest-android OK version=$got url=$u"
          fi
          if [ -s manifest-macos.json ]; then
            curl -fsSL --retry 3 "$PUBLIC_BASE/manifest-macos.json?v=$TAG" > m-macos-r2.json
            want=$(jq -r .version manifest-macos.json); got=$(jq -r .version m-macos-r2.json)
            [ "$got" = "$want" ] || { echo "::error::R2 manifest-macos 版本不符：公网 $got / 本地 $want"; exit 1; }
            u=$(jq -r '.platforms["darwin-aarch64"].url' m-macos-r2.json)
            [ "$u" = "$PUBLIC_BASE/P-Pass-latest.app.tar.gz" ] || { echo "::error::R2 manifest-macos url 不对：$u"; exit 1; }
            echo "R2 manifest-macos OK version=$got url=$u"
          fi
          {
            echo "### 国内镜像已更新：$TAG"
            echo "- $PUBLIC_BASE/P-Pass-latest.dmg"
            echo "- $PUBLIC_BASE/P-Pass-latest.apk"
            echo "- $PUBLIC_BASE/manifest.json（老格式兼容件；旧客户端升级用）"
            echo "- $PUBLIC_BASE/manifest-android.json / manifest-macos.json（分端更新源，UPD-13）"
            echo "- $PUBLIC_BASE/P-Pass-latest.app.tar.gz（macOS 自动更新产物）"
            echo "- 边缘缓存最多 5 分钟后生效"
          } >> "$GITHUB_STEP_SUMMARY"
