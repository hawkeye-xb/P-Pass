[package]
name = "media-codec"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
# Compile libheif from source into the binary (self-contained
# distribution: dogfood boxes and release installers need zero brew/apt).
# Default stays on the system library for fast dev/CI builds.
vendored = ["decode-worker/vendored"]

[dependencies]
core-media = { path = "../core-media" }
# 解码在独立子进程里做：线协议与子进程逻辑在 decode-worker。
decode-worker = { path = "../decode-worker" }
# #1044 B3: 「是不是视频」只问 core-index 的唯一口径 `media_kind`，不在
# 本 crate 另留扩展名表。代价：codec 层会经 core-index 连带编进 storage。
core-index = { path = "../core-index" }
# 拉起被隔离的解码子进程；平台 cfg 只许待在 crates/platform（红线 B.2）。
platform = { path = "../platform" }
# JPEG/PNG/WebP/GIF/BMP/ICO decode + resize + JPEG encode (详细设计 §4.3).
# ico（内部依赖 bmp + png，不引入新的 crate）：图标也要出缩略图，否则照片墙是灰块。
# default features off: drops the AVIF encoder (rav1e) — unused, heavy,
# and its libfuzzer-sys dep carries an NCSA license we'd rather not allow.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "ico", "rayon"] }
# Thumbnail workers run below normal priority (契约: 索引期间不抢机器).
# Cross-platform crate so no platform #[cfg] leaks into this crate (B.2).
thread-priority = "3"
# Atomic thumb writes (temp file + rename) and ffmpeg frame staging.
tempfile = "3"
thiserror.workspace = true
