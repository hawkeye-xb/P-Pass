[package]
name = "platform"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
# QA-09 迁移（#211 / #287）：只给测试用的平台能力（造「指向目录的链接」）。
# 默认关闭 —— 关着时 src/test_support.rs 整个不参与编译，产品二进制里不会
# 多出任何东西。消费方在 [dev-dependencies] 里开它。
test-support = []

[dependencies]
# #1116 P2-2 防降级：更新包版本按 semver 比当前版本（`newer_than_current`，各平台共用）。
semver = "1"
# #1150：IPC 对端版本下限按项目统一的版本语义比（预发布 < 正式版；2026.10.10 > 2026.10.9）。
version-cmp = { path = "../version-cmp" }
thiserror.workspace = true
# #1260：Windows 推出前审批的几条日志写进 daemon.log（与 daemon 同一个 tracing）。
tracing.workspace = true
# #1047：停止信号（SIGTERM / Windows 控制台事件）。只开 signal + 运行时，
# 不拉 net/io。#1151 起加 time：更新下载的总时长上限（update_limits）。
tokio = { version = "1", features = ["signal", "rt", "time"] }
# #1115：IPC 对端身份——接 daemon / 桌面壳手里的 interprocess 连接（同一版本）。
interprocess = { version = "2", features = ["tokio"] }

# QA-09 迁移（#211）：statvfs（卷容量水位 / DAE-05）。原先这个调用长在
# crates/daemon 里，libc 也声明在那边；迁进来之后 daemon 不再需要它。
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# #1109：身份私钥存进 data protection 钥匙串（kSecUseDataProtectionKeychain
# 要 OSX_10_15）。已在依赖树里（iroh 的 TLS 链），这里提为直接依赖。
[target.'cfg(target_os = "macos")'.dependencies]
# 更新包校验的解包目录（code_signature.rs）：随机名 + 0700 + 自动清理。
tempfile = "3"
security-framework = { version = "3.7", features = ["OSX_10_15"] }
# #1121：代码签名静态校验要 CFURL（security-framework 的 code_signing 接口收它）。已在依赖树里。
core-foundation = "0.10"
# #1116 P2-2 防降级：读已验签包里的 Info.plist 版本号（签名封装覆盖它）。
plist = "1"
# #1260：推出照片库所在的卷之前先问我们（DiskArbitration 卸载审批，Time Machine / Spotlight 同款）。
# objc2 系列的官方绑定；objc2-core-foundation 已在依赖树里。
objc2-disk-arbitration = { version = "0.3.2", default-features = false, features = [
  "std",
  "DADisk",
  "DADissenter",
  "DASession",
] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = [
  "std",
  "CFRunLoop",
  "CFURL",
  "CFDictionary",
  "CFString",
] }

[target.'cfg(windows)'.dependencies]
# HKCU Run key: the shell's login item (DESK-72) and cleanup of the legacy
# daemon Run value (daemon autostart is a scheduled task since #957).
winreg = "0.55"
# SetThreadExecutionState.
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Power",
  # SEC-07 (#289): OpenProcessToken/GetTokenInformation 取当前用户 SID，
  # SetEntriesInAclW + SetNamedSecurityInfoW 重写身份密钥的 DACL。
  "Win32_Security",
  "Win32_Security_Authorization",
  # W-3：CryptProtectData / CryptUnprotectData（身份私钥与配对白名单落盘加密）。
  "Win32_Security_Cryptography",
  # DAE-05: GetDiskFreeSpaceExW（卷容量水位）。
  "Win32_Storage_FileSystem",
  # DAE-11 (#804) 电源来源订阅的回调常量（DEVICE_NOTIFY_CALLBACK 等）。
  "Win32_UI_WindowsAndMessaging",
  # OpenProcessToken / GetCurrentProcess 等。
  "Win32_System_Threading",
  # DESK-52 (#787): 结束 daemon 改走系统 API，不再拉起 taskkill.exe——
  # CreateToolhelp32Snapshot 列进程，ProcessIdToSessionId 只认本会话的。
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_RemoteDesktop",
  # DESK-58 (#875): GetStdHandle/SetStdHandle/GetConsoleMode——没人接的
  # stderr 改接到 logs\daemon.err。
  "Win32_System_Console",
  # #1043 (B6): GetUserDefaultLocaleName——托盘与安装位置对话框的初始语言。
  "Win32_Globalization",
  # #1118: GetComputerNameExW——配对时给手机看的电脑名。
  "Win32_System_SystemInformation",
  # #1167: ImpersonateNamedPipeClient——管道服务端按连接取客户端 SID。
  "Win32_System_Pipes",
  # #1260: RegisterClassW / WNDCLASSW——只收消息的窗口接收卷的设备通知（推出前审批、拔盘）。
  "Win32_Graphics_Gdi",
  # 解码子进程隔离：AppContainer profile / Job 对象。
  "Win32_Security_Isolation",
  "Win32_System_JobObjects",
] }
# #1167：管道安全描述符 SDDL 要宽字符串（interprocess 的 SecurityDescriptor::deserialize
# 收 `&U16CStr`）。已在依赖树里（interprocess 的 Windows 依赖），这里提为直接依赖。
widestring = "1"

# DESK-16 (#165)：Windows 的系统缩略图走 COM（IShellItemImageFactory），
# 而 windows-sys 是裸 FFI —— 没有 IUnknown/Interface 那套，做 COM 要手搓
# vtable，写对的成本远高于收益。所以这里用高层 `windows` crate。
# ⚠️ 它**不是新引入的 crate**：`cargo tree -i windows@0.62.2 --target
#    x86_64-pc-windows-msvc` 显示它早已在主 workspace 的 Windows 依赖树里
#    （netwatch ← iroh ← iroh-blobs ← transport ← daemon），这里只是提为
#    直接依赖并多开几个 feature。
windows = { version = "0.62", features = [
  "Win32_Foundation",
  # #1155：GetFileVersionInfoW / VerQueryValueW（单测对照真实 PE）。
  "Win32_Storage",
  # #1161：SCM 的 SDDL 解析与服务对象安全描述符。
  "Win32_Security",
  "Win32_Security_Authorization",
  # #1161：DELETE 访问位（删服务用）。
  "Win32_Storage_FileSystem",
  # CoInitializeEx / CoUninitialize —— COM 必须先初始化线程套间。
  "Win32_System_Com",
  # SHCreateItemFromParsingName + IShellItemImageFactory。
  "Win32_UI_Shell",
  # W-4：IPropertyStore / SHGetPropertyStoreFromParsingName（读卷的 BitLocker 状态）。
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_System_Com_StructuredStorage",
  # GetDIBits / BITMAP / DeleteObject —— 把 HBITMAP 变成像素要走 GDI。
  "Win32_Graphics_Gdi",
  # DESK-17 (#166)：WinRT toast —— ToastNotificationManager / XmlDocument，
  # 以及工作线程上的 RoInitialize。
  "UI_Notifications",
  "Data_Xml_Dom",
  "Win32_System_WinRT",
  # DESK-65 (#957)：常驻服务交给任务计划程序——ITaskService / IRegisteredTask，
  # 参数里的 VARIANT / BSTR 在后两个 feature 下。
  "Win32_System_Services",
  "Win32_System_TaskScheduler",
  "Win32_System_Ole",
  "Win32_System_Variant",
] }

[dev-dependencies]
# udp_recv_truncated：iroh 底层收包（noq-udp，经根 Cargo.toml 的 [patch] 用 third_party 那份）。
noq-udp = "1.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "io-util"] }
# fsevents_shapes 集成测试（macOS 目录监听平台行为实测）：直接驱动 notify。
notify = "7"
tempfile = "3"

# 隔离子进程的对抗实测：子进程就是这个测试二进制自己，要在 main 里分流，
# 所以不用 libtest 的 harness。
[[test]]
name = "isolated_adversarial"
path = "tests/isolated_adversarial.rs"
harness = false
