name: PR Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  pr:
    name: lint + test + arch-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: System codecs (libheif + HEVC plugin for HEIC, ffmpeg for video thumbs)
        # libheif-plugin-libde265 is the HEVC decode plugin — without it
        # libheif opens HEIC containers but cannot decode the pixels
        # ("Unsupported codec"), verified in a clean noble container.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libheif-dev libheif-plugin-libde265 ffmpeg libnuma-dev

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test (nextest)
        run: cargo nextest run --all-features

      - name: Windows cross-check (platform crate compiles for msvc)
        run: rustup target add x86_64-pc-windows-msvc && cargo check -p platform --target x86_64-pc-windows-msvc

      - name: Architecture enforcement
        run: bash tools/arch-check.sh

      - name: License and dependency audit
        run: cargo deny check advisories licenses bans

  android:
    name: android (proto drift + assemble)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests (golden drift vs crates/proto snapshots)
        working-directory: apps/android
        run: ./gradlew :app:testDebugUnitTest
      - name: Assemble debug APK
        working-directory: apps/android
        run: ./gradlew :app:assembleDebug

  scenarios:
    name: T-070 failure scenarios (process-level)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: System codecs
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libheif-dev libheif-plugin-libde265 ffmpeg libnuma-dev
      - name: Build release binaries
        run: cargo build --release -p daemon -p testclient
      - name: Run scenarios (huge file / crash recovery / disk full)
        run: |
          bash tools/scenarios/huge_file.sh
          bash tools/scenarios/crash_recovery.sh
          bash tools/scenarios/disk_full.sh

  # T-042b: src-tauri tests get their own job — the desktop workspace's
  # dependency tree is deliberately kept out of the main rust job
  # (T-041 decision), and compiling tauri v2 on Linux needs webkit/gtk
  # system packages the lean job doesn't install.
  desktop:
    name: desktop (src-tauri tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo (desktop workspace)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            apps/desktop/src-tauri/target/
          key: ${{ runner.os }}-cargo-desktop-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}
      - name: System deps (tauri v2 on Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
      # tauri-build wants the sidecar file to exist; the lib tests never
      # spawn it, so an empty stub is enough.
      - name: Stub sidecar
        working-directory: apps/desktop/src-tauri
        run: |
          mkdir -p binaries
          touch binaries/ppf-daemon-x86_64-unknown-linux-gnu
          chmod +x binaries/ppf-daemon-x86_64-unknown-linux-gnu
      - name: src-tauri lib tests
        working-directory: apps/desktop/src-tauri
        run: cargo test --lib
