# CI-01: 流水线分块——Android 域（proto drift + assemble + 打包完整性）。
#
# 触发路径（依赖表，2026-08-12）：
#   apps/android/**  —— Android 工程本体（Kotlin/资源/gradle）
#   assets/i18n/**   —— i18n 字典（Android 捆绑副本与仓库源零漂移测试消费）
# 反向依赖检查：GoldenDriftTest 比对 crates/proto 金样本 snapshots.rs——
# proto 侧改动由 ci-rust.yml（crates/**）触发，本 workflow 只在 Android
# 侧改动时重跑比对，两侧合起来全覆盖。
# 2026-08-23（CI 重构⑤）：删 pull_request 触发——直推 main 阶段 PR 事件
# 用不上，同一 commit 双触发白烧额度；只留 push。
# 2026-08-23 修正（K3 评审抓到的自相矛盾）：删 PR 触发 + dependabot =
# 升级 PR 零检查。加回 pull_request，paths 只含流水线文件 + gradle 依赖
# 清单——dependabot 改什么就触发什么，业务代码 PR 依旧不跑。
name: CI Android

on:
  # #1187：路径判定从触发层挪到 job 层（.github/actions/changes），本 lane 进必过项。
  # 被 workflow 级 paths 过滤掉的 workflow 不汇报状态，设成必过就永久 Pending；job 级跳过
  # 汇报 skipped，对必过项算通过。没改到安卓相关路径的 PR 只跑十几秒的 changes 与 gate。
  # #1468：合入 main 后批量跑全量（含 Windows）。PR 上只跑快检，Windows 留到这里。
  # 同组同一时间只跑一次：正在跑的不取消（cancel-in-progress 对 push 为 false），
  # 排队只留最新（GitHub concurrency 原生行为：新来的替掉还在排队的）。
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # #1187：发版前由 release.yml 以全量模式调用（changes 对 workflow_call 恒定判要跑）。
  workflow_call:

permissions:
  contents: read

# #1468：group 带上事件名，push 到 main 的全量单独成组，不被 Release（workflow_call，
# 事件是 workflow_dispatch）或 PR 抢占；只有 push 不取消正在跑的，其余事件行为不变。
concurrency:
  group: ci-android-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  changes:
    name: changes (要不要跑 Android)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      # #1468：push 到 main 一律全跑。排队只留最新，中间的 push 会被替掉，按单次 push 的
      # diff 判会漏掉被替掉那几次的改动；PR 上照旧按路径判。
      run: ${{ github.event_name == 'push' && 'true' || steps.c.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: c
        uses: ./.github/actions/changes
        with:
          # 原 workflow 级 paths 原样搬来（PR 与 push 两份合并取并集）。
          paths: |
            .github/workflows/**
            .github/actions/changes/**
            apps/android/**
            assets/i18n/**
            # #1124：Kotlin 直接编译 libtransport.so 的 uniffi 绑定（控制面与 iOS 共用），Rust 侧改了导出要在这里编一遍。
            crates/transport/**
            crates/proto/**
            crates/pair-pake/**
            tools/build-android-iroh-blobs-bridge.sh
            tools/ci-paths.sh

  android:
    name: android (proto drift + assemble)
    needs: changes
    # `!= 'false'` 而非 `== 'true'`：changes 挂了输出为空时照跑（fail-closed）。
    if: ${{ !cancelled() && needs.changes.outputs.run != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          # BUILD-01: 版本唯一真相 = 仓根 .java-version（与本地 tools/java-home.sh 同源）
          java-version-file: .java-version
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      # #1589：Gradle 发行版单独缓存（还原在这里，保存见 job 末尾），否则每次从
      # services.gradle.org 现拉、GitHub 抖动时读超时直接把 job 卡红。
      - uses: ./.github/actions/gradle-wrapper-cache
        id: gradle-dist
      - name: Build Android-native iroh-blobs provider
        run: |
          rustup target add aarch64-linux-android
          echo "ANDROID_NDK_HOME=${ANDROID_NDK_LATEST_HOME}" >> "$GITHUB_ENV"
      - name: Unit tests (golden drift vs crates/proto snapshots)
        working-directory: apps/android
        run: ./gradlew :app:testDebugUnitTest
      - name: Lint (LINT-01 门禁；baseline 冻结存量，新增违规必红)
        working-directory: apps/android
        run: ./gradlew :app:lintDebug
      - name: Assemble debug APK
        working-directory: apps/android
        run: ./gradlew :app:assembleDebug

      # QA-19（#420）：androidTest 是独立编译单元，引用了 src/test 独有的
      # addrOf 红了很久没人发现——CI 从不编译它。加编译步（只 compile，
      # 不上真机跑），坏在 PR 上就红。
      - name: Compile instrumentation tests (QA-19)
        working-directory: apps/android
        run: ./gradlew :app:compileDebugAndroidTestKotlin

      # Packaging-completeness guard: gradle silently packages "whatever is
      # there" — a missing jniLibs .so builds green and crashes on-device
      # (UnsatisfiedLinkError, happened twice). Assert the native lib is IN
      # the APK, not merely that the build succeeded.
      - name: Assert APK contains iroh native libraries
        working-directory: apps/android
        run: |
          # UPD-15（#685）：产物名由构建系统派生（P-Pass_<版本>_android-debug.apk）
          APK=$(find app/build/outputs/apk/debug -name 'P-Pass_*.apk' | head -1)
          [ -n "$APK" ] || { echo "::error::debug APK 不在——产物名或构建异常"; exit 1; }
          # #1124：控制面改走 libtransport.so 的 uniffi 导出，iroh-ffi 的库不该再进包。
          if unzip -l "$APK" | grep -q "libiroh_ffi.so"; then echo "::error::APK 里还有 libiroh_ffi.so（#1124 已移除）"; exit 1; fi
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libtransport.so"

      # #1589：只在整条 job 成功时存，下载失败留下的半截发行版不进缓存。
      # 同 ref 并发跑两次时后到的那次存不进去，属缓存记账、不该判红。
      - name: 保存 Gradle 发行版缓存
        if: success() && steps.gradle-dist.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        with:
          path: ~/.gradle/wrapper/dists
          key: ${{ steps.gradle-dist.outputs.key }}

  # #1187：分支保护只要求这一条。`if: always()` 必不可少——没有它，上游一红本 job 就被跳过，
  # 而 skipped 对必过项算通过，等于没设门。判定见 tools/ci-gate.sh。
  gate:
    name: CI Android gate
    if: always()
    needs: [changes, android]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: tools/ci-gate.sh
          sparse-checkout-cone-mode: false
      - name: 汇总上游结论
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: tools/ci-gate.sh
