[package]
name = "core-index"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
storage = { path = "../storage" }
# EXIF metadata (T-013: ingest 换用 core-media, as planned at T-011).
core-media = { path = "../core-media" }
# BLAKE3 content hash — same domain as iroh-blobs (架构 §4.2).
blake3 = "1"
# Cheap header-only dimension probe for the timeline (T-055: 0x0 fix).
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
# Calendar math: taken_at → <yyyy>/<mm> dirs.
time = "0.3"
thiserror.workspace = true
# `block_in_place` only — ingest() is already unconditionally async (every
# `Db` call is sqlx async), so this crate already requires a tokio runtime
# at every call site; this just lets it say so honestly instead of quietly
# blocking a worker thread during a large file's hash/copy (2026-09-07:
# real-device symptom traced to exactly this — a multi-hundred-MB Flow
# transfer's ingest froze unrelated async work, including local IPC to the
# desktop shell, for the duration of the hash+copy).
tokio = { version = "1", features = ["rt-multi-thread"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
proptest = "1"
tempfile = "3"
