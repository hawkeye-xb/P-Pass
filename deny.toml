# cargo-deny configuration for P-Pass
# Run: cargo deny check

[graph]
all-features = false

[advisories]
yanked = "deny"
ignore = []

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "MPL-2.0",
  "ISC",
  "Unicode-3.0",
]
confidence-threshold = 0.8
private = { ignore = true }

[bans]
multiple-versions = "warn"
deny = []
