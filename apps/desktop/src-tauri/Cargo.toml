# Standalone workspace on purpose: the desktop shell = UI + hosting
# (ADR-012, #1046). Business rules live in the daemon (reached over its
# local IPC and its one-shot `config` / `diag` subcommands); hosting —
# starting the daemon, autostart registration, update hand-over — is the
# distribution layer's job and lives here (src/distribution.rs). The huge
# Tauri tree stays out of the main workspace's build/CI.
#
# DOC-05: the old "depends on no internal crate" line was retired when
# QA-09 moved platform forking into crates/platform — src-tauri DOES
# consume it below. #1044 B13 added the second path dependency,
# crates/version-cmp: a zero-dependency pure function shared with the
# daemon so the version relation has exactly one implementation.
# Neither carries business logic (platform is a system adapter,
# version-cmp a pure comparison). A path dependency
# does not require same-workspace membership, so the standalone
# decision stands on the Tauri-tree argument alone.
#
# Dependency direction: src-tauri → crates/platform, one-way. CI-17
# (#373) leans on exactly this direction — apps/**-only changes may
# skip the main workspace's heavy lanes because editing src-tauri
# cannot affect crates/**; the reverse direction (editing crates/**)
# affects src-tauri but is judged "run everything" anyway by
# tools/ci-needs-full-lane.sh.
[workspace]

[package]
name = "p-pass-desktop"
version = "0.10.0"
edition = "2021"
license = "AGPL-3.0"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# #1120：不开 `devtools` feature——正式包没有开发者工具；debug 构建 Tauri 默认自带。
tauri = { version = "2", features = ["tray-icon", "image-png", "protocol-asset"] }
tauri-plugin-dialog = "2"
# UPD-01: desktop self-update via the official updater plugin (manifest
# served as release asset; pubkey in tauri.conf.json, minisign format)
tauri-plugin-updater = "2"
tauri-plugin-opener = "2"
# DESK-68 (#996)：Tauri 起来之前弹「请正式安装」的系统对话框。不是新依赖：
# tauri-plugin-dialog 已带进来，版本与特性照抄它（gtk3 等后端由它统一开）。
rfd = { version = "0.16", default-features = false, features = ["common-controls-v6"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
interprocess = "2"
# #1045：壳里唯一的 config.toml 读者（`ipc::read_config_data_dir`）要真 TOML 解析，
# 不手写逐行读。写 config 的是 daemon，壳只读。toml 已在依赖树里（tauri 拖进来的）。
toml = "0.8"
# System adapter (power hint, data dir) — not business logic.
platform = { path = "../../../crates/platform" }
# #1044 B13: 版本关系的唯一实现（与 daemon 共用）。
version-cmp = { path = "../../../crates/version-cmp" }
tauri-plugin-single-instance = "2"

[lib]
name = "p_pass_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dev-dependencies]
tempfile = "3"
# #287：测试里要造「指向目录的链接」来验 MOB-47 契约，各系统机制不同。
# 这个能力在 platform crate 的 test-support feature 里（架构红线 B.2：
# 平台分叉只许待在那儿）。**只在这里开**——上面那条普通依赖不开，所以
# 产品构建里它不参与编译。
platform = { path = "../../../crates/platform", features = ["test-support"] }
