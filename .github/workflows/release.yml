# Release pipeline (T-071 + T-071b supply-chain hardening) — tag v* →
# 双平台构建 → SHA256 → 签名门控 → SLSA attestation → Release 草稿。
#
# T-071b 加固点（2026-08-03）：
#   - Apple 签名 secret 只出现在 codesign / notarize 两个 step 的 env，
#     job 级 env 不再暴露给任何第三方 action 的进程环境。
#   - 所有第三方 action pin 到 commit SHA（供应链攻击面归零；升级时
#     用 git ls-remote 查新 tag 的 SHA 替换）。
#   - 每 job 最小 permissions：build job 不拿 contents:write，release
#     job 不拿 id-token/attestations。
#   - 草稿 release 先 create 再 upload（xargs 拆分 = 二次 create 必败），
#     SHA256SUMS 作为资产上传而非仅 notes。
#   - signed=yes 必须同时反映公证状态（只签名未公证仍会被 Gatekeeper 拦）。
#   - VirusTotal 步 gate 提到 job env（step env 在 if 求值时不可见，
#     原条件恒假）；notes 追加写工作区根（原 ../NOTES.md 落到工作区外）。
#
# 凭据策略（无凭据路径 = 卡面验收）：
#   - macOS 签名/公证：APPLE_CERT_P12 / APPLE_CERT_PASSWORD /
#     APPLE_NOTARY_KEY(_ID/_ISSUER) 任一缺失 → 跳过该步，notes 标注"未签名"。
#     secret 槽位由 gh secret set 预建，值来自 H-02（Apple 开发者证书 $99/年）。
#   - Windows：当前不签名（Authenticode 证书 H-02 范畴），notes 标注。
#   - 环境批准门：macos job 挂 environment: release-signing —— 在
#     Settings → Environments 把 owner 加为 required reviewer 后生效；
#     未配置保护规则时自动通过，不阻塞无凭据路径。
#
# 测试验收：打一个测试 tag（如 v0.2.0-test.1）→ workflow 走通到"签名前"全链
# → 生成带 SHA256SUMS 资产的 Release 草稿（无凭据时签名步跳过）。

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "手工触发的 tag 名（草稿发布用）"
        required: false

permissions:
  contents: read

jobs:
  macos-arm64:
    name: "macOS arm64 (签名门控)"
    runs-on: macos-14
    environment: release-signing
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      # 非 secret 门控布尔（job env 可引用 secrets，但值本身不落 job env；
      # signing secret 只在 codesign / notarize 两个 step env 出现）
      HAS_APPLE_CERT: ${{ secrets.APPLE_CERT_P12 != '' }}
      HAS_NOTARY: ${{ secrets.APPLE_NOTARY_KEY != '' || secrets.APPLE_ID != '' }}
    outputs:
      signed: ${{ steps.signtag.outputs.signed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: macos-arm64-release-${{ hashFiles('**/Cargo.lock') }}

      - name: System codecs (libheif via brew)
        run: brew install libheif

      - name: Build release binaries
        run: cargo build --release -p daemon -p testclient

      - name: Bundle self-contained (dylibs + rpath rewrite)
        run: |
          set -euo pipefail
          rm -rf /tmp/rel && mkdir -p /tmp/rel
          tools/bundle-macos.sh /tmp/rel target/release/daemon target/release/testclient
          cp tools/dogfood-smoke.sh /tmp/rel/ || true
          echo "built from ${GITHUB_SHA} on $(date -u +%FT%TZ)" > /tmp/rel/BUILD_INFO

      # ── 签名门控：无凭据 → 跳过（卡面验收路径）。secret 只在此 step env ──
      - name: Codesign (gated)
        id: codesign
        if: env.HAS_APPLE_CERT == 'true'
        env:
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          CERT_P12: ${{ runner.temp }}/cert.p12
        run: |
          set -euo pipefail
          echo "$APPLE_CERT_P12" | base64 --decode > "$CERT_P12"
          KEYCHAIN=$RUNNER_TEMP/ppsign.keychain-db
          security create-keychain -p pp "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p pp "$KEYCHAIN"
          security import "$CERT_P12" -P "$APPLE_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -s -k pp "$KEYCHAIN" >/dev/null
          /usr/bin/codesign --force --options runtime --timestamp \
            --sign "$(security find-identity -v -p codesigning "$KEYCHAIN" | awk 'NR==2{print $2}')" \
            /tmp/rel/daemon /tmp/rel/testclient
          echo "signed=yes" >> "$GITHUB_OUTPUT"

      - name: Notarize + staple (gated)
        id: notarize
        if: env.HAS_APPLE_CERT == 'true' && env.HAS_NOTARY == 'true'
        env:
          # 公证凭据二选一：API key（--key/--key-id/--issuer）或
          # Apple ID + App-Specific Password + Team ID（Xisper 先例，.env.build 变量同名）
          APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086 # NOTARY_ARGS 是 flag 组，需刻意拆分
          NOTARY_ARGS=""
          if [ -n "${APPLE_NOTARY_KEY:-}" ]; then
            NOTARY_ARGS="--key $APPLE_NOTARY_KEY --key-id $APPLE_NOTARY_KEY_ID --issuer $APPLE_NOTARY_ISSUER"
          else
            NOTARY_ARGS="--apple-id $APPLE_ID --password $APPLE_APP_SPECIFIC_PASSWORD --team-id $APPLE_TEAM_ID"
          fi
          for bin in /tmp/rel/daemon /tmp/rel/testclient; do
            ditto -c -k --keepParent "$bin" "$bin.zip"
            # shellcheck disable=SC2086 # NOTARY_ARGS 是 flag 组，需刻意拆分
            xcrun notarytool submit "$bin.zip" $NOTARY_ARGS --wait --timeout 15m
            xcrun stapler staple "$bin"
            rm -f "$bin.zip"
          done
          echo "notarized=yes" >> "$GITHUB_OUTPUT"

      - name: Signing status tag
        id: signtag
        run: |
          SIG="no"
          if [ "${{ steps.codesign.outputs.signed }}" = "yes" ] && [ "${{ steps.notarize.outputs.notarized }}" = "yes" ]; then
            SIG="yes"
          fi
          echo "signed=$SIG" >> "$GITHUB_OUTPUT"

      - name: SHA256 + notes
        run: |
          cd /tmp/rel
          shasum -a 256 daemon testclient > SHA256SUMS
          cat SHA256SUMS

      - name: SLSA attestation
        uses: actions/attest-build-provenance@92c65d2898f1f53cfdc910b962cecff86e7f8fcc # v1
        with:
          subject-path: /tmp/rel/daemon, /tmp/rel/testclient

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-arm64
          path: /tmp/rel

  windows-x64:
    name: "Windows x64 (未签名)"
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: win-x64-release-${{ hashFiles('**/Cargo.lock') }}

      # libheif via vcpkg（Windows 规范路径；windows-latest 预装 C:\vcpkg）。
      # triplet x64-windows-static-md 与 vcpkg crate 默认一致（实测 x64-windows
      # 动态版不匹配：报 "not installed for triplet x64-windows-static-md"）。
      # 静态链接 → 自包含 exe，发布无需带 DLL。首次从源码编 libheif+依赖
      # （libde265 等），10-20 分钟，故 timeout 45。
      - name: Install libheif (vcpkg)
        shell: bash
        run: |
          /c/vcpkg/vcpkg.exe install "libheif:x64-windows-static-md" --clean-after-build

      - name: Build release binaries
        shell: bash
        env:
          VCPKG_ROOT: "C:\\vcpkg"
        run: cargo build --release -p daemon -p testclient

      - name: SHA256 + notes
        shell: bash
        run: |
          cd target/release
          sha256sum daemon.exe testclient.exe > SHA256SUMS
          cat SHA256SUMS
          echo "built from ${GITHUB_SHA} on $(date -u +%FT%TZ)" > BUILD_INFO

      - name: SLSA attestation
        uses: actions/attest-build-provenance@92c65d2898f1f53cfdc910b962cecff86e7f8fcc # v1
        with:
          subject-path: target/release/daemon.exe, target/release/testclient.exe

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-x64
          path: |
            target/release/daemon.exe
            target/release/testclient.exe
            target/release/SHA256SUMS
            target/release/BUILD_INFO

  release:
    name: "Release 草稿"
    needs: [macos-arm64, windows-x64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VT_API_KEY: ${{ secrets.VT_API_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts

      - name: Compose notes
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          [ -n "$TAG" ] || { echo "TAG 缺失（dispatch 需 tag 输入）"; exit 1; }
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          cat > NOTES.md <<EOF
          ## P-Pass ${TAG#v}

          构建自 \`${GITHUB_SHA::7}\` · $(date -u +%FT%TZ)

          **签名状态**：macOS=${{ needs.macos-arm64.outputs.signed }}（无凭据路径跳过）/ Windows=no（Authenticode 证书 H-02 范畴）

          ### 验证（被拦截/不信任时先做这三步）
          - 下载每平台附带的 SHA256SUMS 资产（certutil/shasum 对照）
          - Release 页的 Provenance 面板（SLSA attestation）
          - 源码可查：构建流程 .github/workflows/release.yml

          被杀软拦截了？见 docs/troubleshooting/blocked-by-av.md
          EOF

      - name: VirusTotal 提交（gated，卡面 VT 步——支持 blocked-by-av 信誉建设）
        if: env.VT_API_KEY != ''
        run: |
          EXE="artifacts/windows-x64/daemon.exe"
          [ -f "$EXE" ] || exit 0
          ID=$(curl -sf -X POST -H "x-apikey: $VT_API_KEY" \
            -F "file=@$EXE" https://www.virustotal.com/api/v3/files \
            | jq -r .data.id)
          echo "VirusTotal 分析 ID: $ID（草稿发布后见扫描结果链接）" >> NOTES.md

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd artifacts
          gh release create "$TAG" --draft --title "P-Pass ${TAG#v}" --notes-file ../NOTES.md
          echo "草稿: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd artifacts
          gh release upload "$TAG" \
            macos-arm64/daemon macos-arm64/testclient macos-arm64/SHA256SUMS macos-arm64/BUILD_INFO \
            windows-x64/daemon.exe windows-x64/testclient.exe windows-x64/SHA256SUMS windows-x64/BUILD_INFO
          echo "assets: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
