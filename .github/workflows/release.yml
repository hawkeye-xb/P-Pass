# Release pipeline (T-071 + T-071b supply-chain hardening) — tag v* →
# 三平台构建 → SHA256 → 签名门控 → SLSA attestation → Release 草稿
# → 分平台上传（CI-04②，各 lane 独立，Android 最快到手）。
#
# T-071b 加固点（2026-08-03）：
#   - Apple 签名 secret 只出现在 codesign / notarize 两个 step 的 env，
#     job 级 env 不再暴露给任何第三方 action 的进程环境。
#   - 所有第三方 action pin 到 commit SHA（供应链攻击面归零；升级时
#     用 git ls-remote 查新 tag 的 SHA 替换）。
#   - 每 job 最小 permissions：build job 不拿 contents:write，release
#     job 不拿 id-token/attestations。
#   - 草稿 release 先 create 再 upload（xargs 拆分 = 二次 create 必败），
#     SHA256SUMS 作为资产上传而非仅 notes。
#   - signed=yes 必须同时反映公证状态（只签名未公证仍会被 Gatekeeper 拦）。
#   - VirusTotal 步 gate 提到 job env（step env 在 if 求值时不可见，
#     原条件恒假）；notes 追加写工作区根（原 ../NOTES.md 落到工作区外）。
#
# 凭据策略（无凭据路径 = 卡面验收）：
#   - macOS 签名/公证：APPLE_CERT_P12 / APPLE_CERT_PASSWORD /
#     APPLE_NOTARY_KEY(_ID/_ISSUER) 任一缺失 → 跳过该步，notes 标注"未签名"。
#     secret 槽位由 gh secret set 预建，值来自 H-02（Apple 开发者证书 $99/年）。
#   - Windows：当前不签名（Authenticode 证书 H-02 范畴），notes 标注。
#   - 环境批准门：macos job 挂 environment: release-signing —— 在
#     Settings → Environments 把 owner 加为 required reviewer 后生效；
#     未配置保护规则时自动通过，不阻塞无凭据路径。
#     ⚠️ 2026-08-26：实际从未配置 reviewer，这个门**从来没拦过任何东西**。
#     它一度被当成「发布前的人工审批」向验收人描述，是错的——它卡在构建
#     **之前**（签名 secret 使用前），而真正的人工把关点是末端的 draft
#     等人工 publish。验收人拍板删除（待确认 APPLE_* secrets 挂在 repo 级
#     而非本 environment 下，否则删掉会让 codesign 静默走无凭据路径）。
#
# 测试验收：打一个测试 tag（如 v0.2.0-test.1）→ workflow 走通到"签名前"全链
# → 生成带 SHA256SUMS 资产的 Release 草稿（无凭据时签名步跳过）。

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "手工触发的 tag 名（草稿发布用）"
        required: false
      # CI-01②: 平台选择（只对 workflow_dispatch 生效；tag push 恒全量构建）。
      # ⚠️ 原注释这里写的是「发布完整性不许分块」——CI-04② 已经把**上传**
      # 分块了（三条 lane 各传各的，Android 先到手）。「不许分块」那条原则
      # 现在只管**正式版的 publish 时机**：draft 等人工点发布，那一刻资产
      # 必然已经齐了。构建仍恒全量，分块的是上传，不是发布。
      platforms:
        description: "构建平台（逗号组合：android / macos / windows；留空 = all）"
        required: false
        default: "all"

permissions:
  contents: read

env:
  # CI-01②: dispatch 指定平台集合；tag push（发布）恒全量。
  # ⚠️ 表达式在 job 级 if 里用 ${{ }} 求值，env 里不能引用 github ——
  # 平台门控在每 job 的 if 里直接写表达式（见下）。
  PLATFORMS: ${{ inputs.platforms || 'all' }}
  # REL-11（#708）：本次发布的 tag。dispatch 补跑时 GITHUB_REF_NAME=main，
  # tools/release-version.sh 优先读它来判 test / 正式线。
  # REL-13（#716）：同理，每个 checkout 都显式 `ref: ${{ inputs.tag || github.ref }}`——
  # dispatch 时默认检出的是 main，构建出的代码与 versions.json 都不是被补跑的那个 tag。
  # 「构建自哪个提交」也一律取实际检出的 HEAD，不用 GITHUB_SHA（dispatch 时它是 main）。
  # 有测试看守：tools/test-release-version-source.sh ④。
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  macos-arm64:
    name: "macOS arm64 (签名门控)"
    runs-on: macos-14
    # CI-04②（2026-08-26）：删掉了 `environment: release-signing`。
    #
    # 它一直被当成「发布前的人工审批门」向验收人描述，验收人被反复要求
    # 「去 Actions 批那道门」——**而 Settings 里从来没配 required
    # reviewer，它从来没拦过任何东西**（三条证据：本文件头注释自己写着
    # 「未配置保护规则时自动通过」；验收人问「我在哪里审批」；他看到的
    # job 全是绿的，真配了 reviewer 的 job 会卡在 waiting 不会绿）。
    #
    # 就算配上 reviewer 它也是错位的：它卡在**构建之前**（签名 secret
    # 使用前），而真正的人工把关点在末端——正式 tag 留 draft 等人工
    # publish。私有仓库、只有 owner 能打 tag，门后面站的人就是打 tag 的人。
    #
    # ⚠️ 唯一的残余风险与回退：environment 除审批外还能挂 environment-scoped
    # secrets。若 APPLE_CERT_P12 等原本挂在该 environment 下（而非 repo 级），
    # 删掉这行后 secrets 读空 → codesign 走无凭据路径**跳过**。
    # 观测点是 release notes 的「签名状态」那行——出现 `macOS=no` 就是踩到
    # 了这一条，把 `environment: release-signing` 加回来即恢复（一行）。
    # 不用任何人去翻 Settings：这个后果在每次 release 正文里自报。
    # CI-01②: 平台门控——tag push 恒跑；dispatch 按 platforms 输入。
    # 留空/all/含 macos 都跑。
    if: github.event_name != 'workflow_dispatch' || contains(format('{0},', inputs.platforms || 'all'), 'macos') || (inputs.platforms == '' || inputs.platforms == 'all')
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      # 非 secret 门控布尔（job env 可引用 secrets，但值本身不落 job env；
      # signing secret 只在 codesign / notarize 两个 step env 出现）
      HAS_APPLE_CERT: ${{ secrets.APPLE_CERT_P12 != '' }}
      HAS_NOTARY: ${{ secrets.APPLE_NOTARY_KEY != '' || secrets.APPLE_ID != '' }}
    outputs:
      signed: ${{ steps.signtag.outputs.signed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set Rust toolchain from rust-toolchain.toml
        shell: bash
        run: tools/setup-rust-toolchain.sh

      # UPD-16（#695）：缓存 key 只跟**依赖集合**走 —— 版本 bump 会改 lock 里我们自己
      # 的 version 行，直接 hash 整个 lock 会让每次发版必然冷编译（实测 276s → 90min+）。
      - name: Compute dep cache keys (UPD-16)
        id: depkeys
        run: |
          {
            echo "root=$(tools/dep-cache-key.sh Cargo.lock)"
            echo "desktop=$(tools/dep-cache-key.sh apps/desktop/src-tauri/Cargo.lock)"
          } >> "$GITHUB_OUTPUT"

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          # CI-18 (#382)：本 job 只 `cargo build -p daemon -p testclient`（主
          # workspace），不跑 `pnpm tauri build`，所以 key 只跟根 lock 走。
          # UPD-16：key 来自 dep-cache-key.sh（归一化掉我们自己的 version 行）。
          key: macos-arm64-release-${{ steps.depkeys.outputs.root }}

      # H-10c: desktop shell is a standalone workspace — cache its target too
      # (Tauri dep tree ~5min cold compile; key on the desktop Cargo.lock).
      - name: Cache desktop target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/desktop/src-tauri/target/
          # ⚠️ CI-18 (#382) 修一个**静默失效**：原先写的是
          # `hashFiles('apps/desktop/Cargo.lock')`，而那个文件**根本不存在**
          # （真实路径是 apps/desktop/src-tauri/Cargo.lock）。hashFiles 对匹配不到
          # 任何文件的模式返回**空串**，于是 key 退化成常量
          # `macos-arm64-desktop-release-` —— 这条缓存**永不失效**。
          # 上面那句注释说「key on the desktop Cargo.lock」，实现没做到；
          # 与 ci-rust.yml 里 vcpkg 那段自己批评过的「静默解析成空串、key 退化成
          # 常量、而注释还在说会失效 —— 属于自己骗自己」是同一个失败形态。
          # 具体后果：src-tauri 改依赖（含 SEC-09 #376 那个 rustls 安全更新）
          # 不会让这条缓存失效。
          key: macos-arm64-desktop-release-${{ steps.depkeys.outputs.desktop }}

      - name: System codecs (libheif via brew)
        run: brew install libheif

      # UPD-13（#660）：daemon 版本戳不再等于 tag —— 正式 tag 用**桌面线自己的
      # 版本号**（release/versions.json），test tag 仍用 tag 名（test.8 必须能
      # 接管 test.7）。
      - name: Resolve desktop version (UPD-13)
        id: ppf_ver
        run: echo "name=$(tools/release-version.sh desktop)" >> "$GITHUB_OUTPUT"

      - name: Build release binaries
        env:
          # DAE-01b blocker②: bake the resolved version into the daemon
          # (CARGO_PKG_VERSION has no -test.N suffix; test.8 must be able
          # to take over from test.7 during dogfood week). 非 tag 运行取
          # release/versions.json 里的平台版本。
          PPF_BUILD_VERSION: ${{ steps.ppf_ver.outputs.name }}
        run: cargo build --release -p daemon -p testclient

      - name: Bundle self-contained (dylibs + rpath rewrite)
        run: |
          set -euo pipefail
          rm -rf /tmp/rel && mkdir -p /tmp/rel
          tools/bundle-macos.sh /tmp/rel target/release/daemon target/release/testclient
          # REL-08 (#510)：随资产的 .sh（smoke + 它 source 的 ipc-lib.sh）只从
          # 暂存脚本的单一清单出，缺文件直接红（原先 `cp … || true` 静默）。
          tools/stage-dogfood-scripts.sh /tmp/rel
          echo "built from $(git rev-parse HEAD) on $(date -u +%FT%TZ)" > /tmp/rel/BUILD_INFO

      # ── 签名门控：无凭据 → 跳过（卡面验收路径）。secret 只在此 step env ──
      - name: Codesign (gated)
        id: codesign
        if: env.HAS_APPLE_CERT == 'true'
        env:
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          CERT_P12: ${{ runner.temp }}/cert.p12
        run: |
          set -euo pipefail
          echo "$APPLE_CERT_P12" | base64 --decode > "$CERT_P12"
          KEYCHAIN=$RUNNER_TEMP/ppsign.keychain-db
          security create-keychain -p pp "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p pp "$KEYCHAIN"
          security import "$CERT_P12" -P "$APPLE_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -s -k pp "$KEYCHAIN" >/dev/null
          # find-identity -v 第 1 行是身份（"1) <hash> \"...\""），第 2 行是
          # "N valid identities found" 汇总——取 NR==1 才是证书哈希。
          /usr/bin/codesign --force --options runtime --timestamp \
            --sign "$(security find-identity -v -p codesigning "$KEYCHAIN" | awk 'NR==1{print $2}')" \
            /tmp/rel/daemon /tmp/rel/testclient
          echo "signed=yes" >> "$GITHUB_OUTPUT"

      # ── 公证/装订（H-02 凭据路径，对象 = dmg）──
      # v0.3.0-test.3 实锤：对裸 Mach-O（daemon/testclient）notarytool
      # submit 可 Accepted，但 stapler staple 必 Error 73——Apple 的
      # staple 只支持 UDIF dmg / code-signed .app bundle / 扁平 pkg。
      # 公证对象改为 bundle 步骤产出的 dmg（含 Developer ID 签名的
      # .app），staple 装订进 dmg。步骤移到 Bundle desktop 之后。

      - name: SHA256 + notes
        run: |
          cd /tmp/rel
          shasum -a 256 daemon testclient > SHA256SUMS-macos-arm64
          cat SHA256SUMS-macos-arm64

      - name: SLSA attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: /tmp/rel/daemon, /tmp/rel/testclient

      # 整包 zip：daemon 的 rpath 已被 bundle-macos.sh 改写到
      # @executable_path/lib——裸二进制离开 lib/ 跑不起来，release 资产
      # 必须是带 lib/ 的自包含包（review 抓到的功能回退）。zip 同时解决
      # 双平台 SHA256SUMS/BUILD_INFO 资产 basename 冲突（gh 上传 422）。
      - name: Pack self-contained zip
        run: |
          set -euo pipefail
          cd /tmp && rm -rf P-Pass && cp -R rel P-Pass
          # UPD-15：名字单源派生；本步前面已 `cd /tmp`，必须用绝对路径调脚本
          ZIP="$("$GITHUB_WORKSPACE/tools/artifact-names.sh" macos-zip)"
          ditto -c -k --keepParent P-Pass "$ZIP"
          # zip 挪进 rel/：让 upload-artifact 的两个 path 共享同一根目录，
          # 下载解包后是平铺的 macos-arm64/<file>（否则公共祖先是 /tmp，
          # SHA256SUMS 会带上 rel/ 前缀，release 上传步路径对不上）。
          mv "$ZIP" rel/

      # ── H-10c: 面向人类的 .app + dmg（复用 /tmp/rel 的自包含 daemon）──
      # sidecar = bundle 后 daemon（rpath @executable_path/lib），lib/ 必须
      # 一起进 .app/Contents/MacOS/lib。无凭据路径 ad-hoc 重签（与 zip 资产
      # 一致）；凭据到位后此步的 codesign identity 由门控环境提供。
      - name: Install Node + pnpm (desktop build)
        run: |
          set -euo pipefail
          # macos-14 runner 自带 node；pnpm 11（allowBuilds 机制所在版本，
          # 见 apps/desktop/pnpm-workspace.yaml）。corepack 无 packageManager
          # 字段不可用，直接 npm 全局装。
          npm install -g pnpm@11
          pnpm --version

      - name: Bundle desktop .app + dmg (H-10c)
        # UPD-01: createUpdaterArtifacts 强制签名——tauri bundle 需要
        # TAURI_SIGNING_PRIVATE_KEY（UPDATE_SIGNING_KEY，rsign 格式，空密码）。
        # secret 只进本 step env（T-071b 模式）。
        # H-02: 凭据到位后，把 p12 导进临时钥匙串取 Developer ID identity
        # 传 bundle 脚本（.app 用真证书签名，供后续 dmg 公证/staple）；
        # 无凭据路径保持 ad-hoc（-），与 zip 资产一致。
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          IDENTITY="-"
          if [ -n "${APPLE_CERT_P12:-}" ]; then
            echo "$APPLE_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
            KEYCHAIN=$RUNNER_TEMP/ppsign.keychain-db
            security create-keychain -p pp "$KEYCHAIN" 2>/dev/null || true
            security default-keychain -s "$KEYCHAIN"
            security unlock-keychain -p pp "$KEYCHAIN"
            security import "$RUNNER_TEMP/cert.p12" -P "$APPLE_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
            security set-key-partition-list -S apple-tool:,apple: -s -k pp "$KEYCHAIN" >/dev/null
            IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | awk 'NR==1{print $2}')"
            echo "identity: $IDENTITY"
          fi
          # ⚠️ dmg 输出到 /tmp/rel/：upload-artifact@v4 按多个 path 的公共
          # 祖先目录存储，若 dmg 放 /tmp/dmg/ 会让 artifact 内出现 rel/、
          # dmg/ 前缀（T-071 只传 /tmp/rel 时是根级平铺），release job 的
          # artifacts/macos-arm64/<file> 引用会全挂。zip 打包步骤在此之前
          # 已完成，dmg 落入 /tmp/rel 不会被收进 zip。
          tools/bundle-desktop-macos.sh /tmp/rel /tmp/rel "$IDENTITY"
          # ⚠️ 不追加 dmg 到 SHA256SUMS-macos-arm64：zip 内 SUMS 与 release
          # 资产 SUMS 必须逐字节一致（T-071 三重核对①）。dmg 的 sha256
          # 由 release job 下载后计算写进 notes。

      - name: Notarize + staple dmg (gated, H-02)
        id: notarize
        if: env.HAS_APPLE_CERT == 'true' && env.HAS_NOTARY == 'true'
        env:
          # 公证凭据二选一：API key（--key/--key-id/--issuer）或
          # Apple ID + App-Specific Password + Team ID（Xisper 先例，.env.build 变量同名）
          APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086 # NOTARY_ARGS 是 flag 组，需刻意拆分
          NOTARY_ARGS=""
          if [ -n "${APPLE_NOTARY_KEY:-}" ]; then
            NOTARY_ARGS="--key $APPLE_NOTARY_KEY --key-id $APPLE_NOTARY_KEY_ID --issuer $APPLE_NOTARY_ISSUER"
          else
            NOTARY_ARGS="--apple-id $APPLE_ID --password $APPLE_APP_SPECIFIC_PASSWORD --team-id $APPLE_TEAM_ID"
          fi
          DMG="/tmp/rel/$(tools/artifact-names.sh macos-dmg)"   # UPD-15
          [ -f "$DMG" ] || { echo "FATAL: $DMG missing (bundle step must run first)" >&2; exit 1; }
          # shellcheck disable=SC2086 # NOTARY_ARGS 是 flag 组，需刻意拆分
          xcrun notarytool submit "$DMG" $NOTARY_ARGS --wait --timeout 15m
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"
          echo "notarized=yes" >> "$GITHUB_OUTPUT"

      # UPD-03: 桌面 updater 包——必须从「嵌 lib/ + 重签」之后的最终 .app
      # 现打。不能用 `pnpm tauri bundle` 自己产的那份 tar.gz：它在塞 lib/
      # 之前就生成，内容缺 lib/，打出去就是 BUILD-09 的复发（用户一更新
      # 就 dyld 起不来）。签名不在本 job 做——统一收在 finalize-manifest，
      # 三平台同一处、同一把钥匙，口径不漂移。
      - name: Pack updater artifact (.app.tar.gz)
        run: |
          set -euo pipefail
          APP=apps/desktop/src-tauri/target/release/bundle/macos/P-Pass.app
          [ -d "$APP" ] || { echo "FATAL: $APP 不存在——bundle 步骤必先行"; exit 1; }
          UPD="$(tools/artifact-names.sh macos-updater)"   # UPD-15
          tar czf "/tmp/rel/$UPD" -C "$(dirname "$APP")" P-Pass.app
          ls -la "/tmp/rel/$UPD"

      - name: Signing status tag
        id: signtag
        run: |
          SIG="no"
          if [ "${{ steps.codesign.outputs.signed }}" = "yes" ] && [ "${{ steps.notarize.outputs.notarized }}" = "yes" ]; then
            SIG="yes"
          fi
          echo "signed=$SIG" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-arm64
          path: |
            /tmp/rel/P-Pass_*_macos-arm64.zip
            /tmp/rel/SHA256SUMS-macos-arm64
            /tmp/rel/P-Pass_*_macos-arm64.dmg
            /tmp/rel/P-Pass_*_macos-arm64.app.tar.gz

  windows-x64:
    name: "Windows x64 (未签名)"
    runs-on: windows-latest
    timeout-minutes: 60
    # UPD-04（2026-10-01 验收人拍板）：**Windows 不再进 tag 触发的默认构建**。
    # 理由：验收人不发布 Windows 资产，但每次发版都要陪它等 ~30 分钟的
    # vcpkg/system 长杆（实测 v0.7.2：macOS 13 分钟 vs Windows 30 分钟），
    # 而桌面端 manifest 的收口此前挂在三 lane 齐后，于是「不发布的平台」
    # 反过来卡住了「要发布的平台」。现在 tag push 恒跳过本 job；要 Windows
    # 产物的场合走 Actions → Release → Run workflow，platforms 留空或含
    # windows（dispatch 语义一字未变）。
    if: github.event_name == 'workflow_dispatch' && (inputs.platforms == '' || inputs.platforms == 'all' || contains(format('{0},', inputs.platforms || 'all'), 'windows'))
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set Rust toolchain from rust-toolchain.toml
        shell: bash
        run: tools/setup-rust-toolchain.sh

      # UPD-16（#695）：同上 —— key 只跟依赖集合走。
      - name: Compute dep cache keys (UPD-16)
        id: depkeys
        run: |
          {
            echo "root=$(tools/dep-cache-key.sh Cargo.lock)"
            echo "desktop=$(tools/dep-cache-key.sh apps/desktop/src-tauri/Cargo.lock)"
          } >> "$GITHUB_OUTPUT"

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          # CI-18 (#382)：本 job **两棵树都编**（`cargo build -p daemon -p testclient`
          # 加 `pnpm tauri build`），而缓存的 ~/.cargo/registry 是两棵树共用的，
          # 所以这里**刻意列两个 lock**——不是漏了收窄。
          # 与上面 macos 那条的差别正来自这个：那条不跑 pnpm tauri build。
          # 仍然不用 `**/Cargo.lock`：那个 glob 会把 spikes/ 两个 lock 也算进来，
          # 而本 job 不编译它们。
          key: win-x64-release-${{ steps.depkeys.outputs.root }}-${{ steps.depkeys.outputs.desktop }}

      # CI-04: 缓存 vcpkg 的 installed 树。libheif + 依赖（libde265 等）从源码
      # 编要 10-20 分钟，是整条 release 管线的**长杆**——三平台并行时其余两个
      # 早就跑完了，草稿却要等它（验收人 2026-08-26：「那为啥有一个没跑完，
      # 我就下载不了？」）。
      #
      # 只缓存 `C:/vcpkg/installed`：`--clean-after-build` 已经把 buildtrees /
      # packages 清掉了，installed 是唯一需要留的产物（含 vcpkg/status 数据库）。
      #
      # **刻意不加 `if: cache-hit != 'true'` 去跳过下面那步**：命中一个不完整的
      # 缓存树时，跳过 install 会让编译在找不到头文件时才炸，错误现场离根因很远。
      # 让 vcpkg 无条件跑一次——已装好时它几秒内识别并早退，缓存坏了它会自己修。
      # 缓存只负责让它快，不负责让它可以不跑。
      #
      # **不设 restore-keys**：半个 vcpkg 树比没有更糟，只接受精确命中。
      # key 里的 v1 是手动失效位——triplet 或包列表变了就 +1。
      - name: Cache vcpkg (libheif)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: C:/vcpkg/installed
          key: vcpkg-installed-x64-windows-static-md-libheif-v1

      # libheif via vcpkg（Windows 规范路径；windows-latest 预装 C:\vcpkg）。
      # triplet x64-windows-static-md 与 vcpkg crate 默认一致（实测 x64-windows
      # 动态版不匹配：报 "not installed for triplet x64-windows-static-md"）。
      # 静态链接 → 自包含 exe，发布无需带 DLL。首次从源码编 libheif+依赖
      # （libde265 等），10-20 分钟，故 timeout 45；命中缓存后是秒级。
      - name: Install libheif (vcpkg)
        shell: bash
        run: |
          /c/vcpkg/vcpkg.exe install "libheif:x64-windows-static-md" --clean-after-build

      - name: Resolve desktop version (UPD-13)
        id: ppf_ver
        run: echo "name=$(tools/release-version.sh desktop)" >> "$GITHUB_OUTPUT"

      - name: Build release binaries
        shell: bash
        env:
          VCPKG_ROOT: "C:\\vcpkg"
          # DAE-01b blocker②: same version injection as the macOS job（UPD-13）.
          PPF_BUILD_VERSION: ${{ steps.ppf_ver.outputs.name }}
        run: cargo build --release -p daemon -p testclient

      # T7 (H-09): Windows 图形界面——桌面壳 NSIS 安装包（未签名，
      # Authenticode 证书 H-02 挂账；SmartScreen 会警告，如实告知用户）。
      # daemon 以 sidecar（externalBin）打进安装包；createUpdaterArtifacts
      # 要求 TAURI_SIGNING_PRIVATE_KEY（UPDATE_SIGNING_KEY，同 macos job）。
      - name: Build desktop shell installer (NSIS, T7)
        shell: bash
        env:
          VCPKG_ROOT: "C:\\vcpkg"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          set -euo pipefail
          npm install -g pnpm@11
          mkdir -p apps/desktop/src-tauri/binaries
          # Tauri externalBin 按 target-triple 后缀查找
          #（ppf-daemon-x86_64-pc-windows-msvc.exe）——裸名找不到，
          # test.8 实锤 "resource path doesn't exist"。
          cp target/release/daemon.exe \
            apps/desktop/src-tauri/binaries/ppf-daemon-x86_64-pc-windows-msvc.exe
          cd apps/desktop
          pnpm install --frozen-lockfile
          pnpm tauri build --bundles nsis
          cd ../..
          ls -la apps/desktop/src-tauri/target/release/bundle/nsis/

      - name: SHA256 + notes
        shell: bash
        run: |
          cd target/release
          sha256sum daemon.exe testclient.exe > SHA256SUMS-windows-x64
          cat SHA256SUMS-windows-x64
          echo "built from $(git rev-parse HEAD) on $(date -u +%FT%TZ)" > BUILD_INFO-windows-x64
          # T7: 安装包也进校验和
          cd ../..
          sha256sum apps/desktop/src-tauri/target/release/bundle/nsis/*.exe >> target/release/SHA256SUMS-windows-x64

      - name: SLSA attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: target/release/daemon.exe, target/release/testclient.exe

      - name: Upload artifact (binaries)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-x64
          path: |
            target/release/daemon.exe
            target/release/testclient.exe
            target/release/SHA256SUMS-windows-x64
            target/release/BUILD_INFO-windows-x64

      # T7: 安装包单独 artifact（upload-artifact v4 多顶层路径不再扁平化，
      # 混在一起会让 release job 的 windows-x64/daemon.exe glob 失效）。
      - name: Upload artifact (NSIS installer)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-x64-installer
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe

  # H-10c: Android release APK（人类可装）。keystore secrets 注入 → 已签名
  # P-Pass_<android 端版本>_android.apk；无凭据路径 → …_android-unsigned.apk（UPD-15）。
  # lintVital 用 JDK 17 跑（AGP 8.7.3 内置 Kotlin 编译器不认识 JDK 26——
  # 本机实测 IllegalArgumentException）。
  android:
    name: "Android (signed APK)"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # CI-01②: 平台门控（同 macos job 语义）。
    if: github.event_name != 'workflow_dispatch' || contains(format('{0},', inputs.platforms || 'all'), 'android') || (inputs.platforms == '' || inputs.platforms == 'all')
    permissions:
      contents: read
    env:
      # 只放布尔（secret 值不进 job env——T-071b 模式）
      HAS_ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    outputs:
      signed: ${{ steps.signdetect.outputs.signed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          # BUILD-01: 版本唯一真相 = 仓根 .java-version（本地/CI 同源，21 起）
          java-version-file: .java-version

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Build Android-native iroh-blobs provider
        run: |
          rustup target add aarch64-linux-android
          echo "ANDROID_NDK_HOME=${ANDROID_NDK_LATEST_HOME}" >> "$GITHUB_ENV"

      - name: Decode release keystore (gated)
        if: env.HAS_ANDROID_KEYSTORE == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          # 不打印 keystore 内容；只确认解码后是有效 PKCS12（非空 + 头部魔数）
          head -c 4 "$RUNNER_TEMP/release.keystore" | od -c | head -1

      # UPD-13（#660）：versionName 不再等于 tag —— 正式 tag 用**安卓线自己的
      # 版本号**（release/versions.json），test tag 仍用 tag 名（`-test.` 是
      # test 通道判据 + 连续 test tag 必须能互相升级）。
      - name: Resolve android versionName (UPD-13)
        id: ppf_ver
        run: echo "name=$(tools/release-version.sh android)" >> "$GITHUB_OUTPUT"

      - name: Assemble release APK
        working-directory: apps/android
        env:
          # 有凭据时注入签名参数；无凭据时留空 → gradle 走 unsigned
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
          # DESK-02① 语义不变：注入的串由它推导更新通道；非 tag 运行回退文件版本。
          PPF_BUILD_VERSION: ${{ steps.ppf_ver.outputs.name }}
        run: ./gradlew :app:assembleRelease

      # Packaging-completeness guard (same as pr.yml): a release APK without
      # the native lib installs fine and crashes at first pairing — assert
      # the .so is IN whichever APK was produced.
      - name: Assert APK contains iroh native libraries
        working-directory: apps/android
        run: |
          set -euo pipefail
          # UPD-15：产物名 = P-Pass_<android 端版本>_android[-unsigned].apk
          APK=$(find app/build/outputs/apk/release -name 'P-Pass_*_android*.apk' | head -1)
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libiroh_ffi.so"
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libtransport.so"

      - name: Detect signing
        id: signdetect
        working-directory: apps/android
        # REL-09 (#631)：判据**不看文件名、真跑 apksigner**。
        # 旧实现只要「签过名的那份」文件存在就报 signed=yes —— 文件名叫 signed
        # 不等于它真的签好了（未签 / 签名方案不满足 minSdk / 用错 key 都算），
        # 而 manifest 的 `Android=yes` 与用户侧的「该安装包未包含任何证书」（#599）
        # 都建立在这条判据上。**不许加 `|| true` 或 `continue-on-error`。**
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/release -name 'P-Pass_*_android.apk' | head -1)
          if [ -z "$APK" ]; then
            echo "只有 unsigned 产物（keystore secrets 未设置）→ signed=no"
            echo "signed=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          APKSIGNER="$(find "$SDK/build-tools" -maxdepth 2 -name apksigner 2>/dev/null | sort -V | tail -1)"
          if [ -z "$APKSIGNER" ]; then
            echo "::error::找不到 apksigner（SDK=$SDK）——判据无法成立，按红处理"
            exit 1
          fi
          echo "apksigner: $APKSIGNER"
          # minSdk 26 ⇒ v2 方案必需（v1 可缺，AGP 默认就不启 v1）。verify 失败 = 用户装不上。
          "$APKSIGNER" verify --min-sdk-version 26 --print-certs "$APK"
          # 用错 key 签 = 用户无法原地升级，和没签一样严重。DN 已记录在 docs/NEXT.md / ROADMAP.md。
          CERTS="$("$APKSIGNER" verify --min-sdk-version 26 --print-certs "$APK" 2>/dev/null)"
          if ! printf '%s\n' "$CERTS" | grep -q "CN=HawkeyeXbOrg"; then
            echo "::error::APK 签名者不是 CN=HawkeyeXbOrg（用错 key 会让老用户装不上）"
            printf '%s\n' "$CERTS"
            exit 1
          fi
          echo "signed=yes" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android
          # UPD-15：名字为 P-Pass_<版本>_android[-unsigned].apk；缺失文件忽略。
          if-no-files-found: ignore
          path: apps/android/app/build/outputs/apk/release/P-Pass_*.apk

  # ══════════════════════════════════════════════════════════════════
  # CI-04②（2026-08-26 验收人拍板「全拆」）：发布解耦
  #
  # ## 拆之前的形状与它的代价
  #
  # 原本是**一个** release job `needs: [macos, windows, android]`：收全部
  # 产物 → 建草稿 → 传资产。`needs` 不看下游 `if` 写成什么，都要等三个
  # job **跑完**。Android 的 APK 5 分钟就躺在 artifact 里了，却要陪
  # Windows 等到最后（vcpkg 从源码编 libheif 首次 10-20 分钟）。验收人
  # 原话：「怎么全量还是需要等待 win 的构建才能在 release 地址下载到新的
  # 包啊。」
  #
  # 旧设计的理由写在文件头：「tag push 永远全量——发布完整性不许分块」。
  # 那个考虑对**正式版**成立（不让人装到只有手机端的半成品），对狗粮 test
  # 版是纯拖累——test 版的唯一用途就是尽快到验收人手上。
  #
  # ## 拆成什么
  #
  #   create-draft ──┬─→ upload-android  (+ manifest 签名 + test 自动发布)
  #      (秒级)      ├─→ upload-macos
  #                  └─→ upload-windows  (+ VT 提交)
  #                              ↓
  #                        finalize-notes
  #
  # ## 三个承重决定
  #
  # ① **`create-draft` 不 needs 任何构建 job。** 三条 lane 各自建草稿会撞
  #    车（`gh release create` 第二次必败，这是 T-071b 注释里「先 create 再
  #    upload」踩过的坑）。用 `create || true` 掩盖是 TOCTOU：两个 job 同时
  #    发现「不存在」，一个成功一个失败被吞掉，之后 upload 打到哪个 release
  #    上取决于时序。所以让一个秒级 job 先把草稿建出来，其余全是 upload。
  #
  # ② **构建 job 的 `contents: read` 一字不动。** 让 build job 自己
  #    `gh release upload` 是最短的改法，但那要破 T-071b 立的「build job 不拿
  #    contents:write」红线——第三方 action（rust 工具链、pnpm、vcpkg）跑在
  #    同一个 job 里，给它们一个能改 release 的 token 是白送的攻击面。上传
  #    因此下沉到独立的 upload job：它只做 download-artifact + gh upload，
  #    没有任何第三方构建 action。
  #
  # ③ **android 先行 manifest + test 自动发布跟着 android 走。** 它本来就
  #    不需要等桌面端，直接效果是手机端约 6 分钟拿到包、自动更新立刻可验。
  #    这份先行 manifest 只含 android；darwin 条目由 finalize-manifest 在
  #    android + macos 两 lane 齐后重写进同一资产（UPD-03），windows 条目
  #    再由 finalize-manifest-windows 追加（UPD-04——Windows 不参与桌面端
  #    的收口，见该 job 注释与 windows-x64 的 if）。
  #
  # ## notes 的写者只有两个（并发写竞争的处置）
  #
  # `create-draft` 写骨架，`finalize-notes` 覆盖终版。三条 upload lane
  # **一律不碰 notes**。骨架里因此**不能**引用 `needs.*.outputs.signed`
  # ——那时候构建还没跑完。签名状态、H-10c 资产 sha256、VT 分析 ID 全部
  # 由 finalize 收口。
  #
  # **manifest 的 notes 与 release 正文无关**（UPD-03 #580）：正文是给开发者
  # 看的构建台账，客户端更新弹窗却直接展示 notes。#741 起 notes 改为**手写的
  # 用户更新说明**：所有 compose 一律 `--notes-dir release/notes`——按端与清单
  # 版本号读 `release/notes/<platform>/<version>.<zh|en>.txt`，产出 notes（中文，
  # 给旧客户端）与 notes_i18n（规则见 docs/release-notes-rules.md）。没有文件
  # （test tag 的版本号是 tag 名，天然没有；或本版无用户可见变更）就是空串，
  # 客户端显示默认文案。资产因此也不必等 notes。端：分端清单由 `--only` 推出；
  # 无 `--only` 的三处只产出 test 通道的 manifest.json——它只有 Android 展示
  # notes（桌面 test 通道只读 version/platforms），所以显式 `--notes-platform
  # android`。正式 tag 的 manifest.json 是冻结件（cp，不经 compose），不受影响。
  # 正式 tag 某端版本号涨了却没有说明文件 ⇒ create-draft 里告警、不阻断。
  #
  # finalize 晚到不拖任何资产——它只 `gh release edit --notes-file`，对已
  # publish 的 release 同样合法。
  # ══════════════════════════════════════════════════════════════════

  create-draft:
    name: "建 Release 草稿（骨架）"
    # 不 needs 任何构建 job（见上 ①）——秒级跑完，三条 lane 之后只管上传。
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      # REL-13（#716）：本次构建的真实提交（dispatch 补跑时 GITHUB_SHA 是 main，不是 tag）。
      # 没有 checkout 的 job（finalize-notes）从这里取。
      sha: ${{ steps.tag.outputs.sha }}
    steps:
      # `gh release` resolves the repository from the checked-out remote; this
      # job intentionally has no build dependency, but it still needs that
      # context before creating the skeleton release.
      # UPD-13（#660）：fetch-depth 0 —— 下面的版本门禁要能解析上一个 v* tag。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Resolve tag
        id: tag
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          [ -n "$TAG" ] || { echo "TAG 缺失（dispatch 需 tag 输入）"; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # UPD-13（#660）漏判门禁：改了某端的构建输入却没涨该端的版本号 → 直接红。
      # 只在正式 tag 上判定（test tag 的版本号就是 tag 名，不适用两条线模型）。
      - name: Version bump gate (UPD-13)
        if: ${{ !contains(steps.tag.outputs.tag, '-test.') }}
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          git fetch --tags --force --quiet
          PREV=$(git tag -l 'v*' --sort=-v:refname | grep -vx "$TAG" | head -1 || true)
          if [ -z "$PREV" ]; then
            echo "::notice::没有上一个 v* tag，跳出版本门禁"
            exit 0
          fi
          tools/check-version-bump.sh "$PREV" "$TAG"

      # #741：正式 tag 某端版本号涨了、却没有该版本的手写更新说明 ⇒ 告警，**不阻断**
      # （允许「无用户可见变更」——弹窗显示默认文案）。比较口径与上面的版本门禁相同
      # （上一个 v* tag 的 release/versions.json）。脚本本身恒退出 0，
      # continue-on-error 再兜一层：这一步无论如何不许拦发布。
      # REL-12（#711）：逻辑在 tools/release/notes-presence.sh，`just release-dry-run` 跑同一份。
      - name: Release notes presence (#741, warn only)
        if: ${{ !contains(steps.tag.outputs.tag, '-test.') }}
        continue-on-error: true
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: tools/release/notes-presence.sh

      - name: Compose skeleton notes
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          # ⚠️ 骨架里不许出现 needs.*.outputs.signed——本 job 不 needs 构建
          # job，那时候签名结果还不存在（见上「notes 的写者只有两个」）。
          # 签名状态由 finalize-notes 补。
          cat > NOTES.md <<EOF
          ## P-Pass ${TAG#v}

          构建自 \`$(git rev-parse --short=7 HEAD)\` · $(date -u +%FT%TZ)

          > 各平台产物正在陆续上传（Android 最快，Windows 最慢——vcpkg 首次
          > 从源码编 libheif）。签名状态与资产 SHA-256 在全部平台就绪后补齐。

          ### 面向人类的资产（H-10c · UPD-15：文件名带该端版本号）
          - **P-Pass_\<macOS 版本\>_macos-arm64.dmg** — macOS 桌面 App（.app，内含自包含 daemon sidecar + lib/）
          - **P-Pass_\<Android 版本\>_android.apk** — Android APK（keystore 签名，可直接安装；允许"未知来源"即可）
          - **P-Pass_\<桌面版本\>_x64-setup.exe** — Windows 安装包（NSIS）
          - daemon 层自包含 zip（**P-Pass_\<macOS 版本\>_macos-arm64.zip**）继续提供

          ### 验证（被拦截/不信任时先做这三步）
          - 下载每平台的 SHA256SUMS-\<platform\> 资产（certutil/shasum 对照）
          - \`gh attestation verify <下载的文件> -R ${GITHUB_REPOSITORY}\`
            （SLSA provenance，macOS 对 zip 解出的 daemon/testclient 执行）
          - 源码可查：构建流程 .github/workflows/release.yml

          macOS 包为自包含 zip（含 lib/ 依赖库）——解压后整个 P-Pass
          目录一起用，勿单独拷出二进制。

          被杀软拦截了？见 docs/troubleshooting/blocked-by-av.md
          EOF

      - name: Create draft release (幂等)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          # 幂等：重跑 workflow 时 release 已存在，裸 create 会失败。已存在
          # 就只更新骨架 notes，不动 draft/prerelease 标志——那两个标志可能
          # 已经被 upload-android 的自动发布步清掉了，这里重设会把已发布的
          # test 版打回草稿，手机端立刻 404。
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release 已存在 → 只刷新骨架 notes"
            gh release edit "$TAG" --notes-file NOTES.md
          else
            gh release create "$TAG" --draft --title "P-Pass ${TAG#v}" --notes-file NOTES.md
          fi
          echo "草稿: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"

  # ── lane 1: Android（最快，且带着自动更新链路） ──
  upload-android:
    name: "上传 Android + 更新 manifest"
    needs: [create-draft, android]
    if: ${{ !cancelled() && needs.android.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.create-draft.outputs.tag }}
      HAS_UPDATE_KEY: ${{ secrets.UPDATE_SIGNING_KEY != '' }}
    steps:
      # checkout 是为了 tools/make-update-manifest.mjs——三条 lane 里只有
      # 这条需要仓库文件。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Download android artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: android
          path: artifacts/android

      # ── UPD-01: tauri-style update manifest (compose → optional sign) ──
      # 客户端（desktop updater / android 自研流）读 release 资产直链
      # manifest.json；UPDATE_SIGNING_KEY 到位后签名（tauri signer,
      # minisign hashed 格式），无凭据路径 signature 留空 + notes 标注。
      # 只出 android-arm64 条目——darwin 需 .app.tar.gz（H-10c 衔接：
      # createUpdaterArtifacts 的 tar.gz 须在塞 lib/ 后产出，挂账）；windows
      # 桌面壳待建。**正是这个「只吃 android」的事实让 manifest 能搬进本
      # lane**（CI-04② 决定③）。签名密钥由用户生成（已 2026-08-04 完成）。
      # REL-12（#711）：逻辑在 tools/release/compose-android.sh（输入 TAG / RELEASE_TAG，
      # 产出 artifacts/manifest-android.json，test tag 另出 artifacts/manifest.json）。
      - name: Compose update manifest (UPD-01)
        run: tools/release/compose-android.sh

      - name: Sign update manifest (UPD-01, gated)
        # UPD-15 修正：正式 tag 下 upload-android **不再**产出 artifacts/manifest.json
        # （动态清单只给 test 通道），旧条件会让本步被跳过 ⇒ 分端清单带着空签名上传。
        if: env.HAS_UPDATE_KEY == 'true' && (hashFiles('artifacts/manifest.json') != '' || hashFiles('artifacts/manifest-android.json') != '')
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        # REL-12（#711）：逻辑在 tools/release/sign-android.sh（密钥与 .sig 落在 $RUNNER_TEMP）。
        run: tools/release/sign-android.sh

      - name: Upload android assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # UPD-15 门禁：UPDATE_SIGNING_KEY 在位时，清单的签名必须非空（REL-12 #711：
          # 逻辑在 tools/release/check-manifests-signed.sh，上传前先过这道门）。
          tools/release/check-manifests-signed.sh artifacts/manifest.json artifacts/manifest-android.json
          cd artifacts
          ASSETS=""
          # UPD-15：产物名带该端版本号（signed / unsigned 两个名字都由构建派生）
          for f in android/P-Pass_*_android*.apk; do
            [ -f "$f" ] && ASSETS="$ASSETS $f"
          done
          [ -f manifest.json ] && ASSETS="$ASSETS manifest.json"
          [ -f manifest-android.json ] && ASSETS="$ASSETS manifest-android.json"
          # --clobber：重跑 workflow 时资产已存在，裸 upload 会失败。
          # shellcheck disable=SC2086 # ASSETS 是刻意拆分
          gh release upload "$TAG" $ASSETS --clobber
          echo "android assets: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"

      # REL-02: test tag → 自动 publish 为 prerelease（GitHub latest 天然
      # 忽略 prerelease，绝不会漏进 stable 通道）——开发/狗粮设备 test
      # 通道自动更新，无需手动传包；正式 tag 保持 draft 等人工 publish
      #（人工 publish 就是验收后的发布动作，零新基建）。
      #
      # CI-04②：这一步搬进 android lane 是本卡的主要收益——手机端约 6 分钟
      # 就能收到自动更新，不再等 Windows。后到的桌面端资产继续 upload 进这个
      # **已 publish** 的 release，GitHub 允许（发布不是终态封印）。
      - name: Auto-publish test tags as prerelease
        if: contains(env.TAG, '-test.')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # REL-02 补丁（2026-08-11）：gh release edit --prerelease 只设
          # prerelease 标志、不清 draft——release 仍是 draft，下一步的
          # test-channel 指针也不该指向它 → test 通道收不到。必须显式清 draft。
          gh release edit "$TAG" --draft=false --prerelease
          echo "test 通道已发布（prerelease，stable 不受影响）: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"

      # REL-07: test 通道指针——把本次**已组装/签名**的 manifest.json 原样
      # 覆盖进固定的滚动 prerelease `test-channel`（同 neovim 的 nightly tag）。
      # 客户端与 update Worker 只读 releases/download/test-channel/manifest.json
      # 这一个静态文件：不调 GitHub API → 没有匿名限流、不需要 GH_TOKEN。
      # manifest 里的下载链接仍指向版本化 release（${TAG}）的资产。
      # 只在 test tag 且 manifest 存在时执行；stable 流程不经过这里。
      # 放在 auto-publish 之后：没 publish 的 test tag（留 draft）不移动指针。
      - name: Point test-channel at this manifest (REL-07)
        if: contains(env.TAG, '-test.') && hashFiles('artifacts/manifest.json') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CH=test-channel
          if ! gh release view "$CH" >/dev/null 2>&1; then
            printf '%s\n' \
              "固定通道指针，勿删。test 通道客户端与 update Worker 只读本 release 的 manifest.json；" \
              "内容随每次 test 发布覆盖（release.yml · REL-07），下载链接指向对应版本的 release。" \
              "Fixed channel pointer - do not delete. Overwritten by every test release." > /tmp/ch-notes.md
            gh release create "$CH" --prerelease --latest=false --target "$(git rev-parse HEAD)" \
              --title "test channel (rolling pointer)" --notes-file /tmp/ch-notes.md
          fi
          # 重跑旧 tag 的 workflow 不许把指针往回拨：指针上已是更新版本就跳过。
          NEW=$(node -p 'require("./artifacts/manifest.json").version')
          CUR=""
          if gh release download "$CH" -p manifest.json -O /tmp/ch-current.json 2>/dev/null; then
            CUR=$(node -p 'require("/tmp/ch-current.json").version')
          fi
          if [ -n "$CUR" ] && [ "$CUR" != "$NEW" ] && \
             [ "$(printf '%s\n%s\n' "$CUR" "$NEW" | sort -V | tail -n1)" = "$CUR" ]; then
            echo "test-channel 已指向更新的 $CUR（本次 $NEW）——不回拨"
            exit 0
          fi
          gh release upload "$CH" artifacts/manifest.json --clobber
          echo "test-channel → $NEW: https://github.com/${GITHUB_REPOSITORY}/releases/download/${CH}/manifest.json"

  # ── lane 2: macOS ──
  upload-macos:
    name: "上传 macOS"
    needs: [create-draft, macos-arm64]
    if: ${{ !cancelled() && needs.macos-arm64.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.create-draft.outputs.tag }}
    steps:
      - name: Download macos artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: macos-arm64
          path: artifacts/macos-arm64

      - name: Upload macos assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cd artifacts
          ASSETS=""
          # UPD-15：产物名 = P-Pass_<该端版本>_macos-arm64.<ext>
          for f in macos-arm64/P-Pass_*.zip macos-arm64/SHA256SUMS-macos-arm64 \
                   macos-arm64/P-Pass_*.app.tar.gz macos-arm64/P-Pass_*.dmg; do
            if [[ -e $f ]]; then ASSETS="$ASSETS $f"; fi
          done
          # shellcheck disable=SC2086 # ASSETS 是刻意拆分
          gh release upload "$TAG" $ASSETS --clobber
          echo "macos assets: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"

  # ── lane 3: Windows（最慢的一条，现在只拖自己） ──
  upload-windows:
    name: "上传 Windows"
    needs: [create-draft, windows-x64]
    if: ${{ !cancelled() && needs.windows-x64.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.create-draft.outputs.tag }}
      # 只放布尔（不含 secret 值）：job 级 env 会暴露给本 job 每个第三方
      # action 的进程环境——secret 本体下沉到 VT step。
      HAS_VT: ${{ secrets.VT_API_KEY != '' }}
    outputs:
      vt_id: ${{ steps.vt.outputs.vt_id }}
    steps:
      # 刻意用两个具名下载，不用 `pattern:`——那是 download-artifact v4.1+
      # 才有的输入，而本仓把 action pin 到 SHA（T-071b 供应链要求），注释
      # 只写了 v4。不确定的输入不赌，具名下载 v4 全系都支持。
      - name: Download windows binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-x64
          path: artifacts/windows-x64

      - name: Download windows installer
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-x64-installer
          path: artifacts/windows-x64-installer

      - name: Upload windows assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cd artifacts
          # shellcheck disable=SC2086 # ASSETS/glob 是刻意拆分
          ASSETS=""
          for f in \
            windows-x64/daemon.exe windows-x64/testclient.exe \
            windows-x64/SHA256SUMS-windows-x64 windows-x64/BUILD_INFO-windows-x64 \
            windows-x64-installer/P-Pass_*-setup.exe; do
            if [[ -e $f ]]; then ASSETS="$ASSETS $f"; fi
          done
          # shellcheck disable=SC2086 # ASSETS 是刻意拆分
          gh release upload "$TAG" $ASSETS --clobber
          echo "windows assets: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"

      # VT 提交跟着 windows lane（提交的就是 daemon.exe）。分析 ID 经 job
      # output 交给 finalize-notes 写进正文——本 lane 不碰 notes。
      - name: VirusTotal 提交（gated，卡面 VT 步——支持 blocked-by-av 信誉建设）
        id: vt
        if: env.HAS_VT == 'true'
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        run: |
          set -euo pipefail
          EXE="artifacts/windows-x64/daemon.exe"
          [ -f "$EXE" ] || exit 0
          ID=$(curl -sf -X POST -H "x-apikey: $VT_API_KEY" \
            -F "file=@$EXE" https://www.virustotal.com/api/v3/files \
            | jq -r .data.id)
          echo "vt_id=$ID" >> "$GITHUB_OUTPUT"

  # ── 收口①: 桌面更新 manifest（android + darwin，UPD-03/UPD-04）──────
  # upload-android lane 早就传过一份**只有 android** 的 manifest（CI-04②③，
  # 手机端不等桌面）。本 job 在 android + macos 两条 lane 齐后把它**重写**
  # 成 android + darwin 版（gh --clobber 覆盖同名资产）。
  #
  # UPD-04（2026-10-01 验收人拍板）：**`needs` 里不再挂 upload-windows**。
  # 此前是三 lane 齐才收口，于是 Windows（v0.7.2 实测 30 分钟，是 macOS 的
  # 两倍多）拖着桌面端拿不到 darwin 条目——「不发布的平台」卡住了「要发布
  # 的平台」。现在桌面收口只等自己那两条 lane：macOS 一完（~13 分钟）桌面
  # 客户端就能查到新版本。Windows 条目（若有该 lane 产物）由后面的
  # finalize-manifest-windows 追加，晚到只影响 Windows 客户端自己。
  # 签名统一在这里做（三平台同一处、同一把 UPDATE_SIGNING_KEY）——
  # android lane 那份先行 manifest 的签名口径与此完全一致（同一个
  # signer、同一个 key、同一个 --sig-dir 约定），重写不引入新口径。
  finalize-manifest:
    name: "组装桌面更新 manifest（android + darwin）"
    needs: [create-draft, upload-android, upload-macos]
    # DESK-05 同款容错：dispatch 单平台时其余 lane skipped，`needs` 里有
    # skipped 且无 !cancelled() → 本 job 连带跳过（与 finalize-notes 同
    # 一模式）。每步按 needs.*.result 门控，缺哪个平台就少哪个条目。
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.create-draft.outputs.tag }}
      HAS_UPDATE_KEY: ${{ secrets.UPDATE_SIGNING_KEY != '' }}
    steps:
      # checkout 是为了 tools/make-update-manifest.mjs。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Download android artifact
        if: needs.upload-android.result == 'success'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: android
          path: artifacts/android

      - name: Download macos artifact
        if: needs.upload-macos.result == 'success'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: macos-arm64
          path: artifacts/macos-arm64

      # REL-12（#711）：逻辑在 tools/release/compose-desktop.sh（正式 tag：manifest.json =
      # 冻结件原样拷贝；test tag：动态清单；两份分端清单；本该有 mac 产物却没有 ⇒ 红）。
      - name: Compose desktop manifest (android + darwin)
        run: tools/release/compose-desktop.sh

      - name: Sign manifest entries (gated)
        if: env.HAS_UPDATE_KEY == 'true' && hashFiles('artifacts/manifest.json') != ''
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        # REL-12（#711）：逻辑在 tools/release/sign-desktop.sh（REL-10：要签的文件在本步内定位）。
        run: tools/release/sign-desktop.sh

      - name: Upload manifest (覆盖 android-only 先行版)
        if: hashFiles('artifacts/manifest.json') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd artifacts
          gh release upload "$TAG" manifest.json --clobber
          echo "桌面 manifest: https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/manifest.json"
          # UPD-13：分端清单（darwin 只有这一份）——无 mac 产物时不报红。
          if [ -f manifest-macos.json ]; then
            gh release upload "$TAG" manifest-macos.json --clobber
            echo "macOS manifest: https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/manifest-macos.json"
          fi
          # UPD-13：android 分端清单在这里被**覆盖**成收口版（正文已定稿）。
          if [ -f manifest-android.json ]; then
            gh release upload "$TAG" manifest-android.json --clobber
            echo "android manifest: https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/manifest-android.json"
          fi

  # ── 收口①b: 追加 Windows 条目（UPD-04，2026-10-01）──────────────────
  # 桌面收口（finalize-manifest）只等 android + macos；Windows 条目在这里
  # **追加**：本 job 只在 Windows lane 真跑出来时才生效，把三平台产物重新
  # 汇总、统一签名，再 --clobber 覆盖同一份 manifest.json。
  # 于是 Windows 晚到只推迟「Windows 客户端自己」看到更新，不再拖桌面端。
  # 口径与 finalize-manifest 逐字同源（同一个 make-update-manifest.mjs、
  # 同一把 UPDATE_SIGNING_KEY、同一个 pin 住的 signer），不是第二套标准。
  #
  # 不变量（防「静默降级」）：某个 lane 明明成功、产物却不在，则本 job 报红，
  # 绝不用一份缺条目的清单覆盖桌面版已经写好的清单。
  finalize-manifest-windows:
    name: "追加 Windows 更新条目（UPD-04）"
    needs: [create-draft, finalize-manifest, upload-android, upload-macos, upload-windows]
    # Windows lane 没跑（tag push 恒跳过，见 windows-x64 的 if）或没成功 →
    # 本条无意义，直接跳过；桌面端已经拿到自己要的那份清单。
    if: ${{ !cancelled() && needs.upload-windows.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.create-draft.outputs.tag }}
      HAS_UPDATE_KEY: ${{ secrets.UPDATE_SIGNING_KEY != '' }}
      ANDROID_OK: ${{ needs.upload-android.result == 'success' }}
      MACOS_OK: ${{ needs.upload-macos.result == 'success' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Download android artifact
        if: needs.upload-android.result == 'success'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: android
          path: artifacts/android

      - name: Download macos artifact
        if: needs.upload-macos.result == 'success'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: macos-arm64
          path: artifacts/macos-arm64

      - name: Download windows installer
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-x64-installer
          path: artifacts/windows-x64-installer

      - name: Compose full manifest (android + darwin + windows)
        run: |
          set -euo pipefail
          # UPD-13（#660）：正式 tag 的 manifest.json 是**冻结件**，本 job 不再覆盖它。
          # 2026-10-05 事故：v2026.10.1 的 Windows 收口把冻结件冲成了 tag 版本的动态
          # 清单（version=2026.10.1、含 windows 条目、没有 darwin）⇒ 老客户端会看到
          # 一个高于自身包内版本的版本号，正是冻结件要防的死循环。Windows 未发布，
          # 冻结件本来也不含 windows 条目，这里直接跳过。
          if [[ "$TAG" != *-test.* ]]; then
            echo "::notice::正式 tag：manifest.json 是冻结件（UPD-13），跳过 Windows 收口覆盖"
            exit 0
          fi
          ARGS=()
          if [ "$ANDROID_OK" = "true" ]; then
            APK_PATH=$(find artifacts/android -maxdepth 1 -name 'P-Pass_*_android*.apk' | head -1)
            if [ -n "$APK_PATH" ]; then
              ARGS+=(--asset android-arm64="$APK_PATH")
            else
              echo "::error::Android lane 成功但 APK 不在——拒绝用缺条目的清单覆盖桌面版"; exit 1
            fi
          fi
          if [ "$MACOS_OK" = "true" ]; then
            MAC_UPD=$(find artifacts/macos-arm64 -maxdepth 1 -name 'P-Pass_*_macos-arm64.app.tar.gz' | head -1)
            [ -n "$MAC_UPD" ] \
              || { echo "::error::macOS lane 成功但 .app.tar.gz 不在——拒绝用缺条目的清单覆盖桌面版"; exit 1; }
            ARGS+=(--asset darwin-aarch64="$MAC_UPD")
          fi
          # shellcheck disable=SC2012 # glob 只匹配 ASCII 固定名，ls 足够
          EXE=$(ls artifacts/windows-x64-installer/*-setup.exe 2>/dev/null | head -1 || true)
          [ -n "$EXE" ] || { echo "::error::Windows lane 成功但 setup.exe 不在——拒绝写半份清单"; exit 1; }
          ARGS+=(--asset "windows-x86_64=$EXE")
          # manifest 恒指 GitHub 直链（2026-08-25 撤 R2 镜像的拍板）。
          ASSET_BASE="https://github.com/hawkeye-xb/P-Pass/releases/download/${TAG}"
          node tools/make-update-manifest.mjs \
            --tag "$TAG" --notes-dir release/notes --notes-platform android \
            --asset-base "$ASSET_BASE" \
            "${ARGS[@]}"
          mv manifest.json artifacts/manifest.json

      - name: Sign manifest entries (gated)
        if: env.HAS_UPDATE_KEY == 'true' && hashFiles('artifacts/manifest.json') != ''
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          printf '%s' "$UPDATE_SIGNING_KEY" > /tmp/ppass-update.key
          chmod 600 /tmp/ppass-update.key
          mkdir -p /tmp/sigs
          for f in \
            artifacts/android/P-Pass_*_android*.apk \
            artifacts/macos-arm64/P-Pass_*_macos-arm64.app.tar.gz \
            artifacts/windows-x64-installer/*-setup.exe; do
            [ -f "$f" ] || continue
            # pin 版本，与 desktop pnpm-lock 的 @tauri-apps/cli@2.11.4 一致
            npx -y @tauri-apps/cli@2.11.4 signer sign -f /tmp/ppass-update.key -p "" "$f"
            cp "$f.sig" /tmp/sigs/
          done
          node tools/make-update-manifest.mjs \
            --sign artifacts/manifest.json --sig-dir /tmp/sigs

      - name: Upload manifest (覆盖桌面版，补上 windows 条目)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd artifacts
          # UPD-13：正式 tag 走冻结件、本 job 不覆盖（见 compose 步骤的说明）。
          [ -f manifest.json ] || { echo "::notice::正式 tag 不覆盖冻结件（UPD-13），跳过"; exit 0; }
          gh release upload "$TAG" manifest.json --clobber
          echo "全平台 manifest: https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/manifest.json"

  # ── 收口：补签名状态 + 资产 sha256（晚到不拖任何资产） ──
  finalize-notes:
    name: "补齐 Release 正文"
    needs: [create-draft, macos-arm64, windows-x64, android, upload-windows]
    # DESK-05 同款容错：dispatch 单平台时其余 job skipped，`needs` 里有
    # skipped 且无 !cancelled() → 本 job 连带跳过，正文永远补不齐。
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.create-draft.outputs.tag }}
      BUILD_SHA: ${{ needs.create-draft.outputs.sha }}
    steps:
      # CI-09: 逐 lane 具名下载，不再用「无 name 全量下载」——v5+ 在该模式下
      # 只有 1 个 artifact 时会平铺到 path、不建 <name>/ 子目录（README 未记载，
      # 源码 src/download-artifact.ts 比对确认），下游按 artifacts/<name>/ 的
      # 硬路径会整体落空。具名下载 + 显式 path 在 v4/v5+ 下布局恒定；与
      # upload-windows job 的先例一致。lane 被跳过时其 artifact 可能不存在，
      # 故每步用 needs.*.result 门控。
      - name: Download macos artifact
        if: needs.macos-arm64.result == 'success'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: macos-arm64
          path: artifacts/macos-arm64
      - name: Download windows binaries
        if: needs.windows-x64.result == 'success'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-x64
          path: artifacts/windows-x64
      - name: Download windows installer
        if: needs.windows-x64.result == 'success'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-x64-installer
          path: artifacts/windows-x64-installer
      - name: Download android artifact
        if: needs.android.result == 'success'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: android
          path: artifacts/android

      - name: Compose final notes
        run: |
          set -euo pipefail
          cat > NOTES.md <<EOF
          ## P-Pass ${TAG#v}

          构建自 \`${BUILD_SHA::7}\` · $(date -u +%FT%TZ)

          **签名状态**：macOS=${{ needs.macos-arm64.outputs.signed || 'n/a' }}（${{ needs.macos-arm64.outputs.signed == 'yes' && 'Developer ID 签名 + 公证 + staple' || '无凭据路径跳过' }})/ Windows=no（Authenticode 证书 H-02 范畴）/ Android=${{ needs.android.outputs.signed || 'n/a' }}（keystore 签名）
          **更新 manifest**：${{ secrets.UPDATE_SIGNING_KEY != '' && 'UPDATE_SIGNING_KEY 在位 → manifest.json 已签名（tauri signer）' || 'UPDATE_SIGNING_KEY 未设置 → manifest.json 未签名（signature 空，客户端系统签名校验兜底——Android PackageInstaller 强制同签名）' }}

          ### 面向人类的资产（H-10c · UPD-15：文件名带该端版本号）
          - **P-Pass_\<macOS 版本\>_macos-arm64.dmg** — macOS 桌面 App（.app，内含自包含 daemon sidecar + lib/）
          - **P-Pass_\<Android 版本\>_android.apk** — Android APK（keystore 签名，可直接安装；允许"未知来源"即可）
          - **P-Pass_\<桌面版本\>_x64-setup.exe** — Windows 安装包（NSIS）
          - daemon 层自包含 zip（**P-Pass_\<macOS 版本\>_macos-arm64.zip**）继续提供

          ### 验证（被拦截/不信任时先做这三步）
          - 下载每平台的 SHA256SUMS-\<platform\> 资产（certutil/shasum 对照）
          - \`gh attestation verify <下载的文件> -R ${GITHUB_REPOSITORY}\`
            （SLSA provenance，macOS 对 zip 解出的 daemon/testclient 执行）
          - 源码可查：构建流程 .github/workflows/release.yml

          macOS 包为自包含 zip（含 lib/ 依赖库）——解压后整个 P-Pass
          目录一起用，勿单独拷出二进制。

          被杀软拦截了？见 docs/troubleshooting/blocked-by-av.md
          EOF

      # H-10c: dmg/apk 的 sha256（不进平台 SUMS——保持 zip 内 SUMS 与 release
      # 资产逐字节一致，T-071 三重核对①；人类资产哈希单独列在 notes）
      # DESK-05: 单平台 dispatch 容错——lane 未跑（skipped）则其文件本就不存在。
      # CI-09: 但 lane 成功而文件落空 = 下载布局或产物有问题，必须红——
      # 静默跳过会让正文缺 SHA-256 段且无人发现（#236 的失效方向）。
      - name: H-10c assets sha256 → notes
        env:
          MACOS_OK: ${{ needs.macos-arm64.result == 'success' }}
          ANDROID_OK: ${{ needs.android.result == 'success' }}
        run: |
          set -euo pipefail
          {
            echo ""
            echo "### H-10c 资产 SHA-256"
            if [ "$MACOS_OK" = "true" ]; then
              DMG=$(find artifacts/macos-arm64 -maxdepth 1 -name 'P-Pass_*_macos-arm64.dmg' | head -1)
              [ -n "$DMG" ] \
                || { echo "::error::macOS lane 成功但 dmg 不存在——下载布局或产物异常，拒绝静默"; exit 1; }
              sha256sum "$DMG"
            fi
            if [ "$ANDROID_OK" = "true" ]; then
              APK=$(find artifacts/android -maxdepth 1 -name 'P-Pass_*_android*.apk' | head -1)
              [ -n "$APK" ] \
                || { echo "::error::Android lane 成功但 APK 不存在——下载布局或产物异常，拒绝静默"; exit 1; }
              sha256sum "$APK"
            fi
          } >> NOTES.md

      - name: VT 分析 ID → notes
        if: needs.upload-windows.outputs.vt_id != ''
        run: |
          echo "VirusTotal 分析 ID: ${{ needs.upload-windows.outputs.vt_id }}（草稿发布后见扫描结果链接）" >> NOTES.md

      - name: Rewrite release notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # 只改正文，不动 draft/prerelease——test tag 可能已被 upload-android
          # 发布出去了，这里重设标志会把它打回草稿，手机端立刻 404。
          gh release edit "$TAG" --notes-file NOTES.md
          echo "正文已补齐: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
