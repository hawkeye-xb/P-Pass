# IOS-21（#345）/ #2089：iOS 域——静态门禁、App 测试、SwiftPM 包与 TransportFFI 并行化。
#
# 四路并行（全过汇入 CI iOS gate）：
#   1. ios-static（ubuntu-latest）：design token / i18n / version stamp / lane 契约 / TestFlight 签名 /
#      UI strings / 无色值字面量 / Swift 隐私清单。
#   2. ios（xcode-27）：XcodeGen 生成工程 + 模拟器 xcodebuild test（tools/ios/test.sh），按指纹缓存 Generated/。
#   3. ios-packages（xcode-27）：本地 SwiftPM 包 apps/ios/Packages/*/Package.swift（tools/ios/test-packages.sh）。
#   4. ios-ffi（xcode-27）：TransportFFI XCFramework + llvm-nm 静态库隐私清单检查 + 本地隔离 daemon 联调
#      （tools/ios/test-transport-ffi.sh）；PR 上按 run_ffi 仅在 FFI 依赖受影响时运行。
#
# 不缓存 target/（#2089：彻底取消 1.77 GiB target/ 缓存，改为按 --print-fingerprint 缓存 XCFramework 产物
# apps/ios/TransportFFITests/Generated/，miss 时仅缓存轻量 ~/.cargo/registry/cache 与 ~/.cargo/git/db）。
# 手动 dispatch 填 testflight_version 或勾 list_certificates 时仍只走对应手动 job，不受变更影响。
name: CI iOS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
  workflow_dispatch:
    inputs:
      testflight_version:
        description: "留空 = 跑测试；填 X.Y.Z-test.N / X.Y.Z-beta.N（如 v0.9.13-test.1）= 只归档并上传 TestFlight（#348）"
        required: false
        default: ""
      list_certificates:
        description: "勾上 = 只读列出团队全部签名证书（App Store Connect API，不吊销），测试与上传都不跑"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-ios-${{ github.event_name }}-${{ github.ref }}
  # 上传 TestFlight 的手动 run 不许被后来的 run 取消（取消在上传中途会留下半成品）。
  cancel-in-progress: ${{ github.event_name != 'push' && inputs.testflight_version == '' }}

env:
  # XcodeGen 钉版本 + 校验摘要（runner 镜像不带 xcodegen；brew 装的是「当天最新」，
  # 版本会悄悄漂）。摘要取自 GitHub release 资产的 digest 字段。升级时两行一起改。
  XCODEGEN_VERSION: "2.45.3"
  XCODEGEN_SHA256: "0c90f4d28ca57335f9fa78cf5bf6dabfe20a232036dabe36de2eef79cb7c0878"

jobs:
  changes:
    name: changes (要不要跑 iOS)
    if: ${{ inputs.testflight_version == '' && !inputs.list_certificates }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      # #1468：push 到 main 一律全跑。PR 上交由统一依赖图引擎判定 ios 与 ios-ffi。
      run: ${{ github.event_name == 'push' && 'true' || steps.c.outputs.run }}
      run_ffi: ${{ github.event_name == 'push' && 'true' || steps.ffi.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: c
        uses: ./.github/actions/changes
        with:
          lane: ios
      - id: ffi
        uses: ./.github/actions/changes
        with:
          lane: ios-ffi

  ios-static:
    name: ios-static (lint & contract checks)
    needs: changes
    if: ${{ !cancelled() && inputs.testflight_version == '' && !inputs.list_certificates && needs.changes.outputs.run != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Design tokens in sync with assets/design/tokens.json
        run: python3 tools/ios/gen-tokens.py --check

      - name: i18n bundled copy in sync with assets/i18n
        run: tools/ios/sync-i18n.sh --check

      - name: Version stamp rule
        run: tools/ios/test-stamp-version.sh

      - name: TestFlight signing shape (archive unsigned, cloud signing on export)
        run: |
          tools/ios/check-testflight-signing.sh --self-test
          tools/ios/check-testflight-signing.sh

      - name: UI strings in sync with Android strings.xml
        run: python3 tools/ios/gen-strings.py --check

      - name: No colour literals in app sources
        run: |
          tools/ios/check-no-color-literals.sh --self-test
          tools/ios/check-no-color-literals.sh

      - name: Privacy manifest self-test and Swift API scan
        run: |
          python3 tools/ios/check-privacy-manifest.py --self-test
          python3 tools/ios/check-privacy-manifest.py

  ios:
    # ⚠️ 名字写死，不用 matrix 现算（CI-06：名字现算 + 被跳过 = 永久 Pending）。
    name: ios (xcodegen + xcodebuild test)
    needs: changes
    if: ${{ !cancelled() && inputs.testflight_version == '' && !inputs.list_certificates && needs.changes.outputs.run != 'false' }}
    runs-on: xcode-27 # 统一 xcode-27，见 docs/decisions/2026-11-25-macos-runner-xcode-27.md
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Toolchain versions
        run: |
          xcodebuild -version
          xcrun simctl list runtimes available
          jq --version

      - name: Compute TransportFFI fingerprint
        id: fp
        run: echo "fingerprint=$(tools/build-ios-transport-xcframework.sh --print-fingerprint)" >> "$GITHUB_OUTPUT"

      - name: Cache TransportFFI XCFramework
        id: xcframework-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/ios/TransportFFITests/Generated/
          key: ios-xcframework-${{ runner.os }}-${{ steps.fp.outputs.fingerprint }}

      - name: Set Rust toolchain from rust-toolchain.toml
        if: steps.xcframework-cache.outputs.cache-hit != 'true'
        run: tools/setup-rust-toolchain.sh

      - name: Rust iOS targets
        if: steps.xcframework-cache.outputs.cache-hit != 'true'
        run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim

      - name: Cache cargo crate sources (XCFramework miss only)
        if: steps.xcframework-cache.outputs.cache-hit != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ios-cargo-crates-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Build TransportFFI XCFramework (cache miss)
        if: steps.xcframework-cache.outputs.cache-hit != 'true'
        run: tools/build-ios-transport-xcframework.sh apps/ios/TransportFFITests/Generated

      - name: Install XcodeGen ${{ env.XCODEGEN_VERSION }} (pinned + sha256)
        run: |
          set -euo pipefail
          zip="$RUNNER_TEMP/xcodegen.zip"
          curl --retry 5 --retry-delay 2 --retry-all-errors -fsSL -o "$zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          echo "${XCODEGEN_SHA256}  ${zip}" | shasum -a 256 -c -
          unzip -q "$zip" -d "$RUNNER_TEMP/xcodegen-dist"
          bin=$(find "$RUNNER_TEMP/xcodegen-dist" -type f -name xcodegen -perm -u+x | head -1)
          [ -n "$bin" ] || { echo "::error::xcodegen.zip 里找不到可执行文件"; exit 1; }
          dirname "$bin" >> "$GITHUB_PATH"
          "$bin" --version

      - name: iOS test lane contract
        run: tools/test-ios-lanes.sh

      - name: App unit tests (iOS simulator)
        run: tools/ios/test.sh

      - name: Summary
        if: always()
        run: |
          {
            echo "### CI iOS (App XCTest)"
            echo "- Xcode: $(xcodebuild -version | head -1)"
            echo "- XCFramework cache-hit: ${{ steps.xcframework-cache.outputs.cache-hit }}"
            echo "- 签名：本 lane 不签名、无凭据路径（模拟器 ad-hoc）"
          } >> "$GITHUB_STEP_SUMMARY"

  ios-packages:
    name: ios-packages (SwiftPM)
    needs: changes
    if: ${{ !cancelled() && inputs.testflight_version == '' && !inputs.list_certificates && needs.changes.outputs.run != 'false' }}
    runs-on: xcode-27
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Local SwiftPM packages (iOS simulator)
        run: tools/ios/test-packages.sh

  ios-ffi:
    name: ios-ffi (TransportFFI + local daemon)
    needs: changes
    if: ${{ !cancelled() && inputs.testflight_version == '' && !inputs.list_certificates && (github.event_name != 'pull_request' || needs.changes.outputs.run_ffi != 'false') }}
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compute TransportFFI fingerprint
        id: fp
        run: echo "fingerprint=$(tools/build-ios-transport-xcframework.sh --print-fingerprint)" >> "$GITHUB_OUTPUT"

      - name: Cache TransportFFI XCFramework
        id: xcframework-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/ios/TransportFFITests/Generated/
          key: ios-xcframework-${{ runner.os }}-${{ steps.fp.outputs.fingerprint }}

      - name: Set Rust toolchain from rust-toolchain.toml
        run: tools/setup-rust-toolchain.sh

      - name: Cache cargo crate sources
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ios-cargo-crates-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Rust iOS targets (XCFramework miss only)
        if: steps.xcframework-cache.outputs.cache-hit != 'true'
        run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim

      - name: Build TransportFFI XCFramework (cache miss)
        if: steps.xcframework-cache.outputs.cache-hit != 'true'
        run: tools/build-ios-transport-xcframework.sh apps/ios/TransportFFITests/Generated

      - name: Privacy manifest covers required-reason APIs (static lib)
        run: |
          python3 tools/ios/check-privacy-manifest.py --self-test
          rustup component add llvm-tools
          NM="$(rustc --print sysroot)/lib/rustlib/$(rustc -vV | sed -n 's/^host: //p')/bin/llvm-nm"
          python3 tools/ios/check-privacy-manifest.py --nm "$NM" \
            --lib apps/ios/TransportFFITests/Generated/TransportFFI.xcframework/ios-arm64/libtransport.a

      - name: System codecs (libheif via brew, for the local daemon)
        run: brew install libheif

      - name: Transport XCFramework + Swift FFI tests (iOS simulator + local daemon)
        env:
          PPASS_DAEMON_PROFILE: dev
        run: tools/ios/test-transport-ffi.sh

  # #348：手动上传 TestFlight（只在 dispatch 且填了 testflight_version 时跑）。
  # 版本必须是 test / beta 形式：App Store Connect 不接受重复的构建号，手动入口不许占正式版的号。
  testflight:
    name: ios testflight upload (manual)
    if: ${{ inputs.testflight_version != '' && !inputs.list_certificates }}
    runs-on: xcode-27 # 统一 xcode-27，见 docs/decisions/2026-11-25-macos-runner-xcode-27.md
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Upload
        id: up
        uses: ./.github/actions/ios-testflight
        with:
          version: ${{ inputs.testflight_version }}
          require-prerelease: "true"
          key-id: ${{ secrets.ASC_KEY_ID }}
          issuer-id: ${{ secrets.ASC_ISSUER_ID }}
          key-p8: ${{ secrets.ASC_KEY_P8 }}

      - name: Summary
        if: always()
        run: |
          {
            echo "### iOS TestFlight (manual)"
            echo "- 版本：${{ inputs.testflight_version }}"
            echo "- build：${{ steps.up.outputs.build }}（short ${{ steps.up.outputs.short }}）"
          } >> "$GITHUB_STEP_SUMMARY"

  # 只读列出团队签名证书（GET /v1/certificates），给人挑着吊销 CI 以前新建的开发证书；本 job 绝不吊销。
  # 只在 dispatch 勾了 list_certificates 时跑；p8 只经步骤 env 进进程内存，不落盘、不回显。
  certificates:
    name: ios list signing certificates (manual, read-only)
    if: ${{ inputs.list_certificates }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            tools/ios/asc-builds.py
            tools/ios/asc-certificates.py
          sparse-checkout-cone-mode: false
      - name: List certificates
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/asc-venv"
          "$RUNNER_TEMP/asc-venv/bin/pip" install --quiet cryptography
          "$RUNNER_TEMP/asc-venv/bin/python" tools/ios/asc-certificates.py | tee "$RUNNER_TEMP/certs.md"
          cat "$RUNNER_TEMP/certs.md" >> "$GITHUB_STEP_SUMMARY"

  # #1187：分支保护只要求这一条。`if: always()` 必不可少，见 ci-android.yml 同名 job。
  # 手动上传 TestFlight 那条路径不在这里汇总（它不是合入门）。
  gate:
    name: CI iOS gate
    if: always()
    needs: [changes, ios-static, ios, ios-packages, ios-ffi]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: tools/ci-gate.sh
          sparse-checkout-cone-mode: false
      - name: 汇总上游结论
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: tools/ci-gate.sh
