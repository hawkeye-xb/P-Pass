# IOS-21（#345）：iOS 域——XcodeGen 生成工程 + 模拟器上 xcodebuild test。
#
# 跑什么（都在 GitHub macOS runner 的 iOS 模拟器上）：
#   1. App 工程（apps/ios/project.yml → PPass.xcodeproj）的 XCTest：tools/ios/test.sh
#      —— i18n 逐字节副本、设计 token 漂移、版本号注入等契约测试都挂在这里（#316 #344 #346）。
#   2. 本地 SwiftPM 包 apps/ios/Packages/*/Package.swift：tools/ios/test-packages.sh
#      逐个发现、逐个测（扩展点：新包合入后自动被测，不用改本文件）。
#   3. 传输 XCFramework（#313）：tools/ios/test-transport-ffi.sh——构建 XCFramework（两个 iOS
#      切片 + UniFFI Swift 绑定），起一个隔离的本机 daemon（fake HOME、临时数据目录、
#      127.0.0.1:0 系统分配端口、--ephemeral），在模拟器上跑 apps/ios/TransportFFITests：
#      BLAKE3 共享向量、proto 编解码、provider 导入、控制面 hello / 未配对被拒。
#      daemon 用 debug 构建（只要它能答 hello），需要 brew libheif（media-codec 的系统库）。
#
# 不签名、不碰真机：模拟器只做 ad-hoc 签名，本 lane 的测试 job 没有任何凭据路径。
# 例外：手动 dispatch 并填 testflight_version 时，只跑下面的 testflight job（归档 → 上传 TestFlight，
# #348，用 ASC_* secrets），测试 job 不跑。正式发版走 release.yml 的 ios job，两者共用
# .github/actions/ios-testflight。放在本文件而不是独立 workflow：GitHub 只允许 dispatch 默认分支上已存在
# 的 workflow 文件，本文件在 main 上，所以 feat/ios 上也能手动验证。
#
# 触发路径（依赖表，2026-10-12）：
#   apps/ios/**                     —— iOS 工程本体与本地包
#   tools/ios/**                    —— 本 lane 调用的脚本
#   tools/build-ios-*               —— XCFramework 构建脚本（#313）
#   crates/transport/**             —— XCFramework 的 Rust 源（#313 接上后才真正被构建）
#   assets/i18n/**                  —— iOS bundle 逐字节捆绑副本的漂移测试消费（#316；对位 ci-android）
#   assets/design/tokens.json       —— iOS 设计 token 的生成源：gen-tokens.py --check 与
#                                      DesignTokensTests 两道漂移门禁都消费它（#344）
#   apps/android/.../values{,-zh}/strings.xml —— iOS 界面文案由它生成（tools/ios/gen-strings.py，#315）：
#                                      Android 改文案没重新生成 ⇒ 本 lane 红
#   Cargo.toml / Cargo.lock / rust-toolchain.toml —— 传输 crate 的依赖与工具链
# **刻意不含本文件自身**（#345 验收 2）：本 lane 不进必需检查，被 paths 跳过无害；
# 改本文件的 PR 由 ci-rust 的 actionlint 兜语法，下一次碰到上面任一路径时真跑。
name: CI iOS

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/ios/**"
      - "tools/ios/**"
      - "tools/build-ios-*"
      - "crates/transport/**"
      # #1124 / #1118：XCFramework 经 mobile-ffi 还编进 crates/proto 与 crates/pair-pake。
      - "crates/proto/**"
      - "crates/pair-pake/**"
      - "assets/i18n/**"
      - "assets/design/tokens.json"
      - "apps/android/app/src/main/res/values/strings.xml"
      - "apps/android/app/src/main/res/values-zh/strings.xml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
  push:
    branches: [main]
    paths:
      - "apps/ios/**"
      - "tools/ios/**"
      - "tools/build-ios-*"
      - "crates/transport/**"
      - "crates/proto/**"
      - "crates/pair-pake/**"
      - "assets/i18n/**"
      - "assets/design/tokens.json"
      - "apps/android/app/src/main/res/values/strings.xml"
      - "apps/android/app/src/main/res/values-zh/strings.xml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
  workflow_dispatch:
    inputs:
      testflight_version:
        description: "留空 = 跑测试；填 X.Y.Z-test.N / X.Y.Z-beta.N（如 v0.9.13-test.1）= 只归档并上传 TestFlight（#348）"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ci-ios-${{ github.ref }}
  # 上传 TestFlight 的手动 run 不许被后来的 run 取消（取消在上传中途会留下半成品）。
  cancel-in-progress: ${{ inputs.testflight_version == '' }}

env:
  # XcodeGen 钉版本 + 校验摘要（runner 镜像不带 xcodegen；brew 装的是「当天最新」，
  # 版本会悄悄漂）。摘要取自 GitHub release 资产的 digest 字段。升级时两行一起改。
  XCODEGEN_VERSION: "2.45.3"
  XCODEGEN_SHA256: "0c90f4d28ca57335f9fa78cf5bf6dabfe20a232036dabe36de2eef79cb7c0878"

jobs:
  ios:
    # ⚠️ 名字写死，不用 matrix 现算（CI-06：名字现算 + 被跳过 = 永久 Pending）。
    name: ios (xcodegen + xcodebuild test)
    if: ${{ inputs.testflight_version == '' }}
    runs-on: macos-26
    # #313 的传输 FFI 步骤冷缓存要编两个 iOS 切片（release）+ 一个 debug daemon，放宽到 70。
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Toolchain versions
        run: |
          xcodebuild -version
          xcrun simctl list runtimes available
          jq --version

      - name: Install XcodeGen ${{ env.XCODEGEN_VERSION }} (pinned + sha256)
        run: |
          set -euo pipefail
          zip="$RUNNER_TEMP/xcodegen.zip"
          curl -fsSL --retry 3 -o "$zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          echo "${XCODEGEN_SHA256}  ${zip}" | shasum -a 256 -c -
          unzip -q "$zip" -d "$RUNNER_TEMP/xcodegen-dist"
          bin=$(find "$RUNNER_TEMP/xcodegen-dist" -type f -name xcodegen -perm -u+x | head -1)
          [ -n "$bin" ] || { echo "::error::xcodegen.zip 里找不到可执行文件"; exit 1; }
          dirname "$bin" >> "$GITHUB_PATH"
          "$bin" --version

      # #344：设计 token 是生成物——逐字节比对生成器输出，改了 tokens.json 没重新生成就红。
      # 另有 DesignTokensTests（下一步的 XCTest）逐键对照源文件，两道门互相独立。
      - name: Design tokens in sync with assets/design/tokens.json
        run: python3 tools/ios/gen-tokens.py --check

      # #316：i18n 第四个消费者——iOS 逐字节副本。这里是不需要模拟器的快速比对；
      # I18nDriftTests（App 测试里）比的是构建出来的 bundle，两道门互相独立。
      - name: i18n bundled copy in sync with assets/i18n
        run: tools/ios/sync-i18n.sh --check

      # #346：版本号换算规则（不需要模拟器）。产物里的值由 App 测试里的 VersionStampTests 核对。
      - name: Version stamp rule
        run: tools/ios/test-stamp-version.sh

      # #315：iOS 界面文案由 Android strings.xml 生成（同 key、同一句话），逐字节比对。
      - name: UI strings in sync with Android strings.xml
        run: python3 tools/ios/gen-strings.py --check

      # #943：iOS 视觉遵循系统规范，颜色只能来自系统语义色 / PPColor token；源码里不得写色值字面量。
      - name: No colour literals in app sources
        run: |
          tools/ios/check-no-color-literals.sh --self-test
          tools/ios/check-no-color-literals.sh

      # App 工程依赖传输 XCFramework（tools/ios/test.sh 缺就先生成），所以 Rust 工具链、iOS target、
      # 缓存、libheif 必须排在「App unit tests」之前。
      # ── #313 传输 XCFramework + Swift FFI 测试 ─────────────────────────
      - name: Set Rust toolchain from rust-toolchain.toml
        run: tools/setup-rust-toolchain.sh

      - name: Rust iOS targets
        run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          # 只跟主 workspace 的 Cargo.lock 走（CI-18 #382 同理）。
          key: ios-transport-ffi-${{ hashFiles('Cargo.lock') }}

      - name: System codecs (libheif via brew, for the local daemon)
        run: brew install libheif

      - name: App unit tests (iOS simulator)
        run: tools/ios/test.sh

      - name: Local SwiftPM packages (iOS simulator)
        run: tools/ios/test-packages.sh

      - name: Transport XCFramework + Swift FFI tests (iOS simulator + local daemon)
        env:
          PPASS_DAEMON_PROFILE: dev
        run: tools/ios/test-transport-ffi.sh

      - name: Summary
        if: always()
        run: |
          {
            echo "### CI iOS"
            echo "- Xcode: $(xcodebuild -version | head -1)"
            echo "- 签名：本 lane 不签名、无凭据路径（模拟器 ad-hoc），分发签名见 IOS-24"
            echo "- 传输 XCFramework（#313）：tools/ios/test-transport-ffi.sh（模拟器 + 本机隔离 daemon）"
          } >> "$GITHUB_STEP_SUMMARY"

  # #348：手动上传 TestFlight（只在 dispatch 且填了 testflight_version 时跑）。
  # 版本必须是 test / beta 形式：App Store Connect 不接受重复的构建号，手动入口不许占正式版的号。
  testflight:
    name: ios testflight upload (manual)
    if: ${{ inputs.testflight_version != '' }}
    runs-on: macos-26
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Upload
        id: up
        uses: ./.github/actions/ios-testflight
        with:
          version: ${{ inputs.testflight_version }}
          require-prerelease: "true"
          key-id: ${{ secrets.ASC_KEY_ID }}
          issuer-id: ${{ secrets.ASC_ISSUER_ID }}
          key-p8: ${{ secrets.ASC_KEY_P8 }}

      - name: Summary
        if: always()
        run: |
          {
            echo "### iOS TestFlight (manual)"
            echo "- 版本：${{ inputs.testflight_version }}"
            echo "- build：${{ steps.up.outputs.build }}（short ${{ steps.up.outputs.short }}）"
          } >> "$GITHUB_STEP_SUMMARY"
