name: Linux Artifacts

# Push-to-main builds the Linux x86_64 daemon + testclient and force-pushes
# them to the orphan branch `bin-linux-x64` — pure-git distribution for
# cloud/dogfood machines (they `git fetch` instead of compiling for 40min
# on a 2-core box). The branch is overwritten every time: no history on
# the branch itself.
#
# macOS arm64 → bin-macos-arm64 (push-to-main); Windows x64 → bin-win-x64
# (workflow_dispatch only — vcpkg static libheif is ~20min, not worth every
# push; H-09 Windows smoke machine fetches it the same pure-git way).
#
# ⚠️ Repo-bloat lessons (2026-08-10, dev machine .git hit 3.3GB):
# 1. Force-pushed generations pile up as unreachable objects in every
#    clone that fetches bin-*. Dev machines that never run these binaries
#    MUST exclude them:  git config --add remote.origin.fetch '^refs/heads/bin-*'
#    Consumer machines should fetch shallowly into a dedicated checkout.
# 2. paths-filter below: docs/card-only pushes must not rebuild + repush
#    ~100MB of identical binaries. Keep the filter in sync with what
#    actually feeds the build.

on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "config/**"
      - "assets/i18n/**"
      - "tools/bundle-macos.sh"
      - "tools/dogfood-smoke.sh"
      - "tools/win-smoke.ps1"
      - ".github/workflows/artifacts.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: artifacts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-arm64-bin:
    runs-on: macos-14 # Apple Silicon
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: macos-arm64-artifacts-${{ hashFiles('**/Cargo.lock') }}

      - name: System codecs (libheif via brew)
        run: brew install libheif

      - name: Build release binaries
        run: cargo build --release -p daemon -p testclient

      - name: Bundle self-contained (dylibs + rpath rewrite)
        run: tools/bundle-macos.sh /tmp/bin target/release/daemon target/release/testclient

      - name: Push to bin-macos-arm64 orphan branch
        run: |
          set -euo pipefail
          cp tools/dogfood-smoke.sh /tmp/bin/ || true
          cd /tmp/bin
          shasum -a 256 daemon testclient lib/*.dylib > SHA256SUMS
          echo "built from ${GITHUB_SHA} on $(date -u +%FT%TZ)" > BUILD_INFO
          git init -q -b bin-macos-arm64
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -q -m "macos arm64 binaries @ ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" bin-macos-arm64

  linux-bin:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: ${{ runner.os }}-artifacts-${{ hashFiles('**/Cargo.lock') }}

      - name: System codecs (libheif + HEVC plugin, ffmpeg)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libheif-dev libheif-plugin-libde265 ffmpeg

      - name: Build release binaries
        run: cargo build --release -p daemon -p testclient

      - name: Push to bin-linux-x64 orphan branch
        run: |
          set -euo pipefail
          mkdir -p /tmp/bin
          cp target/release/daemon target/release/testclient /tmp/bin/
          cp tools/dogfood-smoke.sh /tmp/bin/ || true
          cd /tmp/bin
          sha256sum daemon testclient > SHA256SUMS
          echo "built from ${GITHUB_SHA} on $(date -u +%FT%TZ)" > BUILD_INFO
          git init -q -b bin-linux-x64
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -q -m "linux x86_64 binaries @ ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" bin-linux-x64

  # H-09: Windows 真机冒烟分发通道。仅 workflow_dispatch 触发（vcpkg 静态
  # libheif 构建 ~20 分钟，不值得每次 push 都跑）；产物推 bin-win-x64 孤儿
  # 分支，Win 测试机器 git fetch 即得（公开仓免认证）。
  windows-x64-bin:
    runs-on: windows-latest
    timeout-minutes: 45
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: win-x64-artifacts-${{ hashFiles('**/Cargo.lock') }}

      - name: Install libheif (vcpkg, static)
        shell: bash
        run: |
          /c/vcpkg/vcpkg.exe install "libheif:x64-windows-static-md" --clean-after-build

      - name: Build release binaries
        shell: bash
        env:
          VCPKG_ROOT: "C:\\vcpkg"
        run: cargo build --release -p daemon -p testclient

      - name: Push to bin-win-x64 orphan branch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/bin
          cp target/release/daemon.exe target/release/testclient.exe /tmp/bin/
          # 冒烟脚本是 Win 真机验证的必需件——复制失败必须响（H-09b：不许 || true 吞掉）
          cp tools/win-smoke.ps1 /tmp/bin/
          cd /tmp/bin
          sha256sum daemon.exe testclient.exe > SHA256SUMS
          echo "built from ${GITHUB_SHA} on $(date -u +%FT%TZ)" > BUILD_INFO
          git init -q -b bin-win-x64
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -q -m "windows x86_64 binaries @ ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" bin-win-x64
