# pnpm 11: strictDepBuilds 默认开启，native 模块（esbuild）的 build script
# 必须显式放行，否则 pnpm install 报 ERR_PNPM_IGNORED_BUILDS 且 .bin 链接缺失。
# 2026-08-02 实测：package.json 的 pnpm.onlyBuiltDependencies 已废弃不生效；
# 唯一生效位置是 pnpm-workspace.yaml 顶层的 allowBuilds map。
allowBuilds:
  esbuild: true

# SEC-09（#371）：pnpm 11 的 minimumReleaseAge（禁止发布不足 24 小时的包进
# lockfile）是**工具内置默认值**，本仓没有任何一行声明它——所以它既看不见也
# 审计不到。下面这一行是把它从"默认行为"变成"仓库明确要求"的唯一落点。
#
# strict=true 的作用是**堵掉自动豁免**。2026-09-22 实测（pnpm 11.27.1）：
# 不加这行时，普通一句 `pnpm install` 引入一个 12 小时前发布的包，pnpm 不报错、
# 不提示、退出码 0，而是**自己往 minimumReleaseAgeExclude 写一条**并继续装：
#
#   Added 1 entry to minimumReleaseAgeExclude in pnpm-workspace.yaml
#     @aws-sdk/client-s3@3.1137.0
#
# 而且它插在 allowBuilds 正下方，离下面那段警告注释十几行远，review 时
# 看起来就是"装依赖的正常附带改动"。#370 当时以为只有照着报错提示跑
# `pnpm clean --lockfile` 才会触发——不是，默认路径就会。
#
# CI 之所以能红，只是因为它跑 `pnpm install --frozen-lockfile`：frozen 模式
# 不许改 lockfile/workspace，于是同一件事变成 ERR_PNPM_MINIMUM_RELEASE_AGE_
# VIOLATION。也就是说门禁只在 CI 咬人，本地默认是自动绕过的。
minimumReleaseAgeStrict: true

# QA-16（#326）：把 jsdom 那棵子树里**发布不足 24 小时**的传递依赖钉住。
#
# 起因是实测的：#370 第一版 lockfile 用本机 pnpm 10.15 生成，它不跑
# minimumReleaseAge；CI 的 pnpm 11 跑，于是 desktop (ubuntu-latest) 红在
# ERR_PNPM_MINIMUM_RELEASE_AGE_VIOLATION，6 条全是当天/前一天刚发布的包。
#
# 修法是**降到更老的版本**，不是放宽策略：
#   - jsdom 在 package.json 里钉死 30.1.0（2026-09-17）。它的 deps 写的是
#     `html-encoding-sniffer: ^6.0.0` 与 `w3c-xmlserializer: ^5.0.0`，所以
#     那两条新发布的 7.0.0 / 6.0.0 跟着自动消失，不需要 override。
#   - 剩下三条是 caret 浮上去的，必须显式钉：
#       @exodus/bytes  jsdom 写 ^1.15.1 → 会浮到 1.15.2（2026-09-21）
#       tldts          tough-cookie 写 ^7.0.5 → 会浮到 7.4.14（2026-09-21）
#       tldts-core     tldts@7.4.13 写 ^7.4.13 → 同样会浮到 7.4.14
#
# ⚠️ cutoff 是**跑 CI 那一刻往前推 24 小时**，不是固定日期。所以这里挑的
# 都是留足余量的版本（最近的 tldts 7.4.13 也有 9 天），不挑刚好卡线的。
#
# ⚠️ 不许改成往 minimumReleaseAgeExclude 里加名字——那是绕过门禁，跟 #252
# SEC-06 收紧供应链口径的方向相反。`pnpm clean --lockfile && pnpm install`
# 会自作主张写那份 exclude 名单（实测 pnpm 11.27.1 会加 3 条），别用它。
overrides:
  "@exodus/bytes": 1.15.1
  tldts: 7.4.13
  tldts-core: 7.4.13
