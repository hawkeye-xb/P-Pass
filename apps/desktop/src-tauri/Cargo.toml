# Standalone workspace on purpose: the tray shell has ZERO business
# logic (ADR-012) — it speaks the daemon's local IPC protocol only,
# and the huge Tauri tree stays out of the main workspace's build/CI.
#
# DOC-05: the old "depends on no internal crate" line was retired when
# QA-09 moved platform forking into crates/platform — src-tauri DOES
# consume it below (the only path dependency in this file; verified
# with `grep -n 'path = '`). "ZERO business logic" still holds:
# platform is a system adapter, not business logic. A path dependency
# does not require same-workspace membership, so the standalone
# decision stands on the Tauri-tree argument alone.
#
# Dependency direction: src-tauri → crates/platform, one-way. CI-17
# (#373) leans on exactly this direction — apps/**-only changes may
# skip the main workspace's heavy lanes because editing src-tauri
# cannot affect crates/**; the reverse direction (editing crates/**)
# affects src-tauri but is judged "run everything" anyway by
# tools/ci-needs-full-lane.sh.
[workspace]

[package]
name = "p-pass-desktop"
version = "0.6.0-test.1"
edition = "2021"
license = "AGPL-3.0"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "devtools", "protocol-asset"] }
tauri-plugin-dialog = "2"
# UPD-01: desktop self-update via the official updater plugin (manifest
# served as release asset; pubkey in tauri.conf.json, minisign format)
tauri-plugin-updater = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
interprocess = "2"
# DESK-10: 诊断包由桌面壳本地组装（daemon 挂着也要能导出）——打包/
# 读回 daemon 那份 zip 都要 zip crate（与 daemon 侧同一大版本）。
zip = "5"
# System adapter (power hint, data dir) — not business logic.
platform = { path = "../../../crates/platform" }
tauri-plugin-single-instance = "2"

[lib]
name = "p_pass_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dev-dependencies]
tempfile = "3"
# #287：测试里要造「指向目录的链接」来验 MOB-47 契约，各系统机制不同。
# 这个能力在 platform crate 的 test-support feature 里（架构红线 B.2：
# 平台分叉只许待在那儿）。**只在这里开**——上面那条普通依赖不开，所以
# 产品构建里它不参与编译。
platform = { path = "../../../crates/platform", features = ["test-support"] }
