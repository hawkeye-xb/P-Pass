name: desktop checks
description: >-
  桌面壳门禁的全部检查步骤（src-tauri fmt/clippy/lib tests + Linux 侧 UI 构建）。
  ci-desktop.yml 的 desktop-linux / desktop-windows 两个 job 各引用一次。

# 为什么抽成共享片段（CI-11 修正，#255，2026-09-20）：
#
# 原来这些步骤长在一个带 matrix 的 job 里（`os: [ubuntu-latest, windows-latest]`），
# 靠 `name: desktop (${{ matrix.os }})` 现算出两个检查名。那个写法有个致命耦合：
# **job 被 `if:` 跳过时 GitHub 不展开 matrix**，于是只汇报一条名叫
# `desktop (${{ matrix.os }})` 的检查——模板原文。而分支保护是按名字的字面
# 文本去对的，它要的 `desktop (ubuntu-latest)` / `desktop (windows-latest)`
# 一条都没来 ⇒ 必需检查永久 Pending ⇒ 纯文档 PR 永远合不进去。
# 探针 PR #271 实测：全部改动落在无害清单里 → mergeStateStatus=BLOCKED。
#
# 这正是 CI-07 (#189) 当初躲 `paths` 要躲开的那个坑，在 #255 自己的实现里
# 又踩了一遍。根因只有一个特征：**名字是现算的**。同一次跳过里，名字写死的
# job（clippy / architecture enforcement / test (windows)）全都正常汇报
# `skipped`，一个没漏。
#
# 所以修法是把名字改回写死：拆成两个 job，各自 `name:` 是常量。没有东西可算，
# 跳过时照样汇报。分支保护一个字都不用改。
#
# 代价是两个 job 的步骤会重复 —— 本文件就是为了消掉这份重复：**步骤只此一份**，
# 两个 job 各自只有「checkout + 引用本文件」两步。
#
# ⚠️ 本文件里每个 `run` 步骤都**必须**写 `shell:`。composite action 的硬性
# 要求，漏了不是警告是直接报错（workflow 里可以省略，这里不行）。
# ⚠️ `runner.os` 在 composite 里照常可用，所以下面的 Linux-only 判断原样保留。
# ⚠️ actionlint 默认只扫 .github/workflows/**，**不扫本文件**。这里的语法错误
#    要到 CI 真跑起来才会暴露。

runs:
  using: composite
  steps:
    - name: Set Rust toolchain from rust-toolchain.toml
      shell: bash
      run: tools/setup-rust-toolchain.sh
    - name: Cache cargo (desktop workspace)
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cargo/registry/
          ~/.cargo/git/
          apps/desktop/src-tauri/target/
        key: ${{ runner.os }}-cargo-desktop-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}
    # windows-latest 预装 WebView2 运行时与 MSVC 工具链，无需额外系统依赖。
    - name: System deps (tauri v2 on Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
          libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
    # tauri-build wants the sidecar file to exist; the lib tests never
    # spawn it, so an empty stub is enough.
    # externalBin 写的是裸名 "binaries/ppf-daemon"，tauri 按**目标三元组**
    # 去找实际文件（release.yml:379 同名规则）——Windows 上必须是
    # ppf-daemon-x86_64-pc-windows-msvc.exe，裸名或 Linux 那个名字都找不到。
    - name: Stub sidecar
      shell: bash
      working-directory: apps/desktop/src-tauri
      run: |
        mkdir -p binaries
        if [ "$RUNNER_OS" = "Windows" ]; then
          stub=binaries/ppf-daemon-x86_64-pc-windows-msvc.exe
        else
          stub=binaries/ppf-daemon-x86_64-unknown-linux-gnu
        fi
        touch "$stub"
        chmod +x "$stub"
        ls -l "$stub"
    # CI-03: src-tauri 是独立 workspace（ADR-012），主 workspace 的
    # just ci（fmt + clippy）覆盖不到它——这里补上同档门禁，否则格式
    # 漂移无人发现（2026-08-25 实测 ipc.rs 两处既有代码被重排）。
    # 三条都显式 shell: bash——windows-latest 的默认 shell 是 pwsh，
    # 参数转义规则不同（`--` 的传递尤其容易出意外）。bash 在全部
    # GitHub-hosted runner 上都预装，用它消掉整类 shell 差异。
    - name: rustfmt check (src-tauri)
      shell: bash
      working-directory: apps/desktop/src-tauri
      run: cargo fmt -- --check
    - name: clippy (src-tauri, deny warnings)
      shell: bash
      working-directory: apps/desktop/src-tauri
      run: cargo clippy --all-targets -- -D warnings
    - name: src-tauri lib tests
      shell: bash
      working-directory: apps/desktop/src-tauri
      run: cargo test --lib
    # UI 构建（vite）——Svelte 编译错误（如模板语法）只有 build 才炸
    # （lint 不报）。assets/** 改动（tokens）也触发本域，确保 UI 侧
    # 消费新 token 时构建仍绿。desktop 用 pnpm（pnpm-lock.yaml，
    # 与 release.yml 的 pnpm tauri build 一致）。
    # CI-06：UI 四步**只在 Linux 跑**。理由不是"省钱"（公开仓不计费），
    # 是 Windows 侧的 UI 构建已由 release.yml 的 windows-latest job 覆盖
    # （release.yml:381-382 `pnpm install --frozen-lockfile` +
    # `pnpm tauri build --bundles nsis`）；而本 lane 在 main 的必需检查里，
    # 多引一条 Windows 上 pnpm 原生依赖/长路径的抖动源不划算。
    # 代价写明：Windows 上的 UI 构建破损要到打 tag 时才会暴露。
    - name: Setup Node
      if: runner.os == 'Linux'
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 22
    - name: Install pnpm
      if: runner.os == 'Linux'
      shell: bash
      run: npm install -g pnpm@11
    - name: vite build (UI)
      if: runner.os == 'Linux'
      shell: bash
      working-directory: apps/desktop
      run: |
        pnpm install --frozen-lockfile
        pnpm build
    # 照片墙窗口对账的回归锁（DESK-09）。这个函数已经回归两次——
    # DESK-06 修"墙不失效"、8/17 去卡顿又开了三个口子（只拉第一页 /
    # 已有条目不更新 / 删除不消失）。桌面端在此之前零测试。
    - name: 单测（照片墙对账 + 接线断言）
      if: runner.os == 'Linux'
      shell: bash
      working-directory: apps/desktop
      run: pnpm test
