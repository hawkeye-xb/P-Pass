# CI Docs 域（2026-09-18 迁移后改组）：md-check + token-check。
#
# 沿革：本 lane 原为队列门禁（check-queue-sync.sh + 归档出口反证）而开。
# 2026-09-18 工作流迁移至 GitHub Issues，QUEUE/cards 冻结只读、队列门禁
# 随校验对象一起退役。QA-06 指出的问题由本 lane 收编：md-check / token-check
# 进 CI。同样是秒级、无编译、无缓存。
# REL-08 (#510) 起兼收 dogfood-assets：release 资产里的 .sh 在只含资产的
# 干净目录里必须自足。artifacts.yml / release.yml 只在 push main / tag /
# dispatch 触发，挂在那边拦不住合并前的回归，所以放在 PR 必过的这条秒级 lane。
# UPD-18 (#706) 起兼收 mirror-resolve：R2 镜像的 tag 判定（test 不许覆盖 stable）
# 同理——mirror-latest.yml 只在发布后触发，拦不住合并前的回归。
# REL-13 (#716) 起兼收 release-version-source：补跑 / 修复清单路径的版本来源与
# release.yml 每个 checkout 都检出被补跑的 tag（tools/test-release-version-source.sh）。
# #741 起兼收 release-notes：更新 manifest 的说明改为手写文件 release/notes/**，
# lint（长度/条数/成对/禁止模式/双向控制符与零宽字符）与清单工具测试都放这里——
# release.yml 只在 tag 上跑，拦不住合并前的回归。（原 UPD-03 的 update-notes job
# 随 CHANGELOG 推导路线一起退役。）
# REL-12 (#711) 起兼收 release-dry-run：release.yml 的组装清单 / 签名 / 校验 / 镜像判定
# 抽进 tools/release/，用假产物 + stub gh + 临时密钥把正式 / test tag 两条路径各跑一遍——
# 同理，release.yml 只在 tag 上跑，正式版路径过去只能在真 tag 上发现问题。不进必需检查。
name: CI Docs

on:
  pull_request:
    branches: [main]
    paths:
      - "tools/test-release-plan.sh"
      - "**.sh"
      - ".github/workflows/**"
      - "justfile"
      - "tools/check-shell-vars.py"
      - "docs/**"
      - "cards/**"
      - "assets/design/tokens.json"
      - "tools/check-markdown-tables.py"
      - "tools/check-token-drift.py"
      - "tools/dogfood-smoke.sh"
      - "tools/ipc-lib.sh"
      - "tools/stage-dogfood-scripts.sh"
      - "tools/test-dogfood-assets.sh"
      - ".github/workflows/artifacts.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/ci-docs.yml"
      - ".github/workflows/mirror-latest.yml"
      - "tools/mirror-resolve-tag.sh"
      - "tools/test-mirror-resolve-tag.sh"
      - ".github/workflows/repair-manifests.yml"
      - "tools/release-version.sh"
      - "tools/check-version-bump.sh"
      - "tools/test-release-version-source.sh"
      # #894：上面的测试校验 gradle 原生库 inputs 与版本门禁安卓口径一致——gradle 改了也要跑。
      - "apps/android/app/build.gradle.kts"
      - "tools/make-update-manifest.mjs"
      - "tools/release-notes.mjs"
      - "tools/release-notes.test.mjs"
      - "release/**"
      - "tools/release/**"
      # #1062：release-plan 钉住真实依赖图（各端入口包传递依赖哪些 crate）——Cargo 清单变了也要跑。
      - "Cargo.toml"
      - "crates/*/Cargo.toml"
      - "tools/testclient/Cargo.toml"
      - "apps/desktop/src-tauri/Cargo.toml"
      - "tools/bundle-desktop-macos.sh"
      - "tools/daemon-helper-macos.sh"
      - "tools/test-release-timeouts.sh"
      # SEC-09 (#371)：pnpm 供应链豁免门禁——这些文件任何一个变了都要过 supply-chain。
      - "**/pnpm-workspace.yaml"
      - "**/package.json"
      - "**/.npmrc"
      - "tools/check-release-age-exclude.py"
      - "tools/release-age-exclude-allowlist.txt"
  push:
    branches: [main]
    paths:
      - "tools/test-release-plan.sh"
      - "**.sh"
      - ".github/workflows/**"
      - "justfile"
      - "tools/check-shell-vars.py"
      - "docs/**"
      - "cards/**"
      - "assets/design/tokens.json"
      - "tools/check-markdown-tables.py"
      - "tools/check-token-drift.py"
      - "tools/dogfood-smoke.sh"
      - "tools/ipc-lib.sh"
      - "tools/stage-dogfood-scripts.sh"
      - "tools/test-dogfood-assets.sh"
      - ".github/workflows/artifacts.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/ci-docs.yml"
      - ".github/workflows/mirror-latest.yml"
      - "tools/mirror-resolve-tag.sh"
      - "tools/test-mirror-resolve-tag.sh"
      - ".github/workflows/repair-manifests.yml"
      - "tools/release-version.sh"
      - "tools/check-version-bump.sh"
      - "tools/test-release-version-source.sh"
      # #894：上面的测试校验 gradle 原生库 inputs 与版本门禁安卓口径一致——gradle 改了也要跑。
      - "apps/android/app/build.gradle.kts"
      - "tools/make-update-manifest.mjs"
      - "tools/release-notes.mjs"
      - "tools/release-notes.test.mjs"
      - "release/**"
      - "tools/release/**"
      # #1062：release-plan 钉住真实依赖图（各端入口包传递依赖哪些 crate）——Cargo 清单变了也要跑。
      - "Cargo.toml"
      - "crates/*/Cargo.toml"
      - "tools/testclient/Cargo.toml"
      - "apps/desktop/src-tauri/Cargo.toml"
      - "tools/bundle-desktop-macos.sh"
      - "tools/daemon-helper-macos.sh"
      - "tools/test-release-timeouts.sh"
      # SEC-09 (#371)：pnpm 供应链豁免门禁——这些文件任何一个变了都要过 supply-chain。
      - "**/pnpm-workspace.yaml"
      - "**/package.json"
      - "**/.npmrc"
      - "tools/check-release-age-exclude.py"
      - "tools/release-age-exclude-allowlist.txt"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: md-check + token-check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: md-check（docs/ 与 cards/ 的 Markdown 表格不许被空行截断）
        run: python3 tools/check-markdown-tables.py
      - name: token-check（DESK-15：tokens.css 不许与 tokens.json 漂移）
        run: python3 tools/check-token-drift.py
      - name: shell-vars-check（变量紧挨非 ASCII 字符必须写 ${name}：macOS bash 3.2 会读错变量名）
        run: |
          python3 tools/check-shell-vars.py --self-test
          python3 tools/check-shell-vars.py

  dogfood-assets:
    name: dogfood-assets（REL-08：资产里的 .sh 在干净目录自足）
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # 门禁自己的反证：变异（清单漏 helper / 按仓库布局 source / workflow
      # 绕过暂存脚本 …）必须全红。反证挂了就别信门禁的绿。
      - name: 反证（变异必须全部被抓到）
        run: bash tools/test-dogfood-assets.sh --self-test
      - name: 门禁
        run: bash tools/test-dogfood-assets.sh

  supply-chain:
    name: supply-chain（SEC-09/#371：minimumReleaseAgeExclude 不许新增）
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # 门禁自己的反证：变异（块/行内 exclude、.npmrc、strict 缺失 …）必须全红。
      - name: 反证（变异必须全部按期望）
        run: bash tools/test-release-age-exclude.sh
      - name: 门禁
        run: python3 tools/check-release-age-exclude.py

  mirror-resolve:
    name: mirror-resolve（UPD-18：test tag 不许镜像到 R2）
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 判定测试（stub gh，三种事件 × test/stable）
        run: bash tools/test-mirror-resolve-tag.sh

  release-version-source:
    name: release-version-source（REL-11/13：补跑路径的代码与版本号取自被补跑的 tag）
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 依赖（PyYAML：测试按 step 名从 workflow 里抽 run 块）
        run: python3 -c 'import yaml' 2>/dev/null || python3 -m pip install --quiet pyyaml
      - name: 补跑口径测试
        run: bash tools/test-release-version-source.sh

  release-notes:
    name: release-notes（#741：手写更新说明 lint + 清单工具）
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # 先跑测试：每条禁止规则各有一个反例，lint 规则被削弱时这里先红。
      - name: 工具与 lint 测试（含 release.yml 口径）
        run: node --test tools/release-notes.test.mjs
      - name: lint release/notes/**
        run: node tools/release-notes.mjs lint

  release-plan:
    name: release-plan（#838：各端构建还是复用 + 复用时的字节 / 版本号校验）
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 判定与校验测试（stub gh）
        run: bash tools/test-release-plan.sh
      # #852：桌面构建的 tauri --config（macOS / Windows 共用）——test 版本指向 test-channel 的
      # 分端清单，正式版本只有 version（与此前的内联写法逐字节相同）。
      - name: tauri --config 生成脚本（#852）
        run: node --test tools/release/tauri-config.test.mjs
      # #1121：test / 正式两把更新签名密钥的选用与自验（缺密钥、配错通道、缺 test 公钥都必须红）。
      - name: 更新签名密钥划分（#1121）
        run: bash tools/release/test-update-key-lib.sh
      # #1151：复用 / 修复沿用已发布字节的原签名，不重签（字节被改动 / 签名对不上 ⇒ 红）。
      - name: 沿用原签名（#1151）
        run: bash tools/release/test-carry-signature.sh
      # #1151：release.yml 的凭据隔离（只有 attest 拿证明权限、签名凭据只在白名单步骤、依赖代码在凭据之前）。
      - name: 凭据隔离门禁（#1151）
        run: |
          python3 -c 'import yaml' 2>/dev/null || python3 -m pip install --quiet pyyaml
          python3 tools/release/test-secret-isolation.py --self-test

  release-dry-run:
    name: release-dry-run（REL-12：发布链正式 / test tag 两条路径预演）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 依赖（PyYAML：执行器按 step 从 workflow 里抽 run 块）
        run: python3 -c 'import yaml' 2>/dev/null || python3 -m pip install --quiet pyyaml
      # 假产物 + stub gh（不访问 GitHub）+ 运行时现生成的两对临时签名密钥（#1121：与
      # release.yml 同一个签名器 tools/release/signer.sh，按 lockfile 安装）；不碰任何 secret。
      - name: dry-run（release.yml / mirror-latest.yml 原样逐步执行）
        run: tools/release/dry-run.sh

  release-timeouts:
    name: release-timeouts（#772：发布链外部命令限时 + 每个 job 有 timeout-minutes）
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 依赖（PyYAML：门禁读 release.yml 的 job 表）
        run: python3 -c 'import yaml' 2>/dev/null || python3 -m pip install --quiet pyyaml
      - name: with-timeout.sh 行为 + 门禁
        run: bash tools/test-release-timeouts.sh
