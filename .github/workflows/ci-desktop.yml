# CI-01: 流水线分块——桌面域（src-tauri lib tests + UI 构建）。
#
# 触发路径（依赖表，2026-08-12）：
#   apps/desktop/**  —— 桌面工程本体（Svelte UI + src-tauri Rust）
#   assets/**        —— tokens/design（UI token 化消费；含 i18n）
# 反向依赖检查：desktop 工作区是独立 Cargo workspace（T-041 决定），
# crates/** 改动不触发本 workflow（Rust 核心域由 ci-rust.yml 覆盖）——
# src-tauri 只依赖已发布的 iroh 栈，与 crates/ 无编译级耦合。
# 2026-08-23（CI 重构⑤）：删 pull_request 触发——直推 main 阶段 PR 事件
# 用不上，同一 commit 双触发白烧额度；只留 push。
# 2026-08-23 修正（K3 评审抓到的自相矛盾）：删 PR 触发 + dependabot =
# 升级 PR 零检查。加回 pull_request，paths 只含流水线文件 + pnpm/npm 依赖
# 清单——dependabot 改什么就触发什么，业务代码 PR 依旧不跑。
name: CI Desktop

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "apps/desktop/package.json"
      - "apps/desktop/pnpm-lock.yaml"
      - "apps/desktop/src-tauri/Cargo.toml"
      - "apps/desktop/src-tauri/Cargo.lock"
  push:
    branches: [main]
    paths:
      - "apps/desktop/**"
      - "assets/**"
      - ".github/workflows/ci-desktop.yml"

permissions:
  contents: read

concurrency:
  group: ci-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: desktop (src-tauri tests + vite build)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # 全 pin commit SHA（CI 重构③，2026-08-23）：供应链攻击面归零，
      # dependabot 统一升级。
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - name: Cache cargo (desktop workspace)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            apps/desktop/src-tauri/target/
          key: ${{ runner.os }}-cargo-desktop-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}
      - name: System deps (tauri v2 on Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
      # tauri-build wants the sidecar file to exist; the lib tests never
      # spawn it, so an empty stub is enough.
      - name: Stub sidecar
        working-directory: apps/desktop/src-tauri
        run: |
          mkdir -p binaries
          touch binaries/ppf-daemon-x86_64-unknown-linux-gnu
          chmod +x binaries/ppf-daemon-x86_64-unknown-linux-gnu
      - name: src-tauri lib tests
        working-directory: apps/desktop/src-tauri
        run: cargo test --lib
      # UI 构建（vite）——Svelte 编译错误（如模板语法）只有 build 才炸
      # （lint 不报）。assets/** 改动（tokens）也触发本域，确保 UI 侧
      # 消费新 token 时构建仍绿。desktop 用 pnpm（pnpm-lock.yaml，
      # 与 release.yml 的 pnpm tauri build 一致）。
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install pnpm
        run: npm install -g pnpm@11
      - name: vite build (UI)
        working-directory: apps/desktop
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      # 照片墙窗口对账的回归锁（DESK-09）。这个函数已经回归两次——
      # DESK-06 修"墙不失效"、8/17 去卡顿又开了三个口子（只拉第一页 /
      # 已有条目不更新 / 删除不消失）。桌面端在此之前零测试。
      - name: 单测（照片墙对账 + 接线断言）
        working-directory: apps/desktop
        run: pnpm test
