# cargo-deny configuration for P-Pass
# Run: cargo deny check

[graph]
all-features = false

[advisories]
yanked = "deny"
ignore = [
  # `instant` is unmaintained (informational, no vulnerability). Pulled in
  # via notify → notify-types (WATCH-01); no safe upgrade exists upstream
  # (notify 7 is the current stable line; notify 8 reworks the dep tree).
  # Re-check when bumping notify.
  "RUSTSEC-2024-0384",
  # `paste` is unmaintained (informational, no vulnerability). Pulled in via
  # iroh → netwatch → netlink-packet-core (T-020); no safe upgrade exists
  # upstream. Re-check when bumping iroh.
  "RUSTSEC-2024-0436",
  # Unmaintained (informational, no vulnerability), both via iroh-blobs
  # (T-021): atomic-polyfill ← postcard, proc-macro-error ← genawaiter ←
  # bao-tree. No safe upgrade exists upstream. Re-check when bumping
  # iroh-blobs.
  "RUSTSEC-2023-0089",
  "RUSTSEC-2024-0370",
  # CVE-2026-119375（#1630）：SQLite < 3.54 在一块页大小不同的 `-wal` 兄弟文件
  # 存在时，普通查询可能返回进程内存的残留字节。本地利用（AV:L），要攻击者先能
  # 往我们 ACL 保护的私有数据目录写一对构造好的文件、再让用户打开；能写到那里的
  # 人权限已远超本漏洞，故不在 v2026.11.2 阻塞发版（产品负责人 2026-11-10 拍板）。
  # 修复只在 `libsqlite3-sys >= 0.39.0`，而 sqlx 0.8.x 钉死 0.30.x、没有补丁版，
  # 只能升 sqlx 0.9（破坏性升级，落在存储核心）。#1629 升完删掉这一行。
  "RUSTSEC-2026-0459",
]

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "MPL-2.0",
  "ISC",
  "Unicode-3.0",
  # Added with iroh (T-020) — all permissive, AGPL-3.0-compatible:
  "Unlicense",           # async_io_stream, pharos (public domain equivalent)
  "Zlib",                # foldhash
  "CDLA-Permissive-2.0", # webpki-roots (Mozilla CA certificate data)
  # Added with libheif (T-013) — permissive Apache variant on a build-time
  # dep (system-deps → cfg-expr → target-lexicon):
  "Apache-2.0 WITH LLVM-exception",
  # Added with notify (WATCH-01) — CC0 is public-domain-equivalent, used by
  # notify itself (notify-7.0.0 declares CC0-1.0).
  "CC0-1.0",
  # Added with interprocess (T-034) — zero-clause BSD, maximally
  # permissive (doctest-file, recvmsg):
  "0BSD",
]
confidence-threshold = 0.8
private = { ignore = true }

[bans]
multiple-versions = "warn"
# #1118：配对验证码用的 spake2 没有经过独立审计（接受理由见 #1118），版本钉在 0.4.0；
# 换版本必须先评审，再同时改这里、crates/pair-pake/Cargo.toml 的 `=0.4.0` 和 Cargo.lock。
deny = [
  { name = "spake2", version = "<0.4.0", reason = "#1118: spake2 is pinned to 0.4.0 pending review" },
  { name = "spake2", version = ">0.4.0", reason = "#1118: spake2 is pinned to 0.4.0 pending review" },
]
