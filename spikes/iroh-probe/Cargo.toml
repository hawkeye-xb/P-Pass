[package]
name = "iroh-probe"
version = "0.1.0"
edition = "2021"

[dependencies]
iroh = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
rand = "0.8"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
postcard = "1"
hex = "0.4"
url = "2"
