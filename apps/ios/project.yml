# P-Pass iOS 工程定义（#887）。`PPass.xcodeproj` 由本文件生成、不入库：
#   just ios-gen     # 或 cd apps/ios && xcodegen generate
#
# 常量（bundle id、最低系统、Swift 版本、版本号默认值）只在 Config/Base.xcconfig，
# 本文件里**不要**再写 deploymentTarget / PRODUCT_BUNDLE_IDENTIFIER 的字面值——
# target 级设置会盖掉 xcconfig，写两处就会漂移。
name: PPass
options:
  createIntermediateGroups: true
  developmentLanguage: en
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
# 本地 SwiftPM 包：PPassCore（Flow 引擎 / 账本 / 后台任务薄层）、PPassMedia（PhotoKit）、
# PPassTransport（传输 XCFramework 的 Swift 绑定，包定义在 TransportFFITests/，产物由
# tools/build-ios-transport-xcframework.sh 在构建前生成到 TransportFFITests/Generated/，不入库）。
# 系统框架 Network / SystemConfiguration / Security 由 PPassTransport 包的 linkerSettings 带上。
packages:
  PPassCore:
    path: Packages/PPassCore
  PPassMedia:
    path: Packages/PPassMedia
  PPassTransport:
    path: TransportFFITests
targets:
  PPass:
    type: application
    platform: iOS
    sources:
      - path: PPass
        excludes:
          - Resources/i18n
      # #316：i18n 字典以**目录引用**进 bundle（落在 <App>/i18n/en.json），对位 Android 的 assets/i18n/。
      # 内容是 assets/i18n/ 的逐字节副本，由 just ios-sync-i18n 同步，I18nDriftTests 守漂移。
      - path: PPass/Resources/i18n
        type: folder
        buildPhase: resources
    dependencies:
      - package: PPassCore
        product: PPassCore
      - package: PPassCore
        product: PPassBackgroundTasks
      - package: PPassMedia
      - package: PPassTransport
      # 兜底：显式链接，不依赖包的传递 linkerSettings（缺 Network 会报 Undefined symbols _nw_*）。
      - sdk: Network.framework
      - sdk: SystemConfiguration.framework
      - sdk: Security.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PPASS_BUNDLE_ID)
        INFOPLIST_FILE: PPass/Info.plist
        # 传输 XCFramework 的模拟器切片只有 arm64（Apple Silicon 模拟器）；不编 x86_64 模拟器。
        EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
    # #346：把版本号写进构建产物的 Info.plist（规则与来源见 tools/ios/stamp-version.sh）。
    # 每次都跑（不做依赖分析）：PPF_BUILD_VERSION 变了而源码没变时也必须重新盖章。
    postBuildScripts:
      - name: Stamp version
        script: |
          "${SRCROOT}/../../tools/ios/stamp-version.sh" "${TARGET_BUILD_DIR}/${INFOPLIST_PATH}"
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
        basedOnDependencyAnalysis: false
  PPassTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PPassTests
    dependencies:
      - target: PPass
      # 只为 import PPassCore 的值类型；代码已链进宿主 App，测试 bundle 不再链一份。
      - package: PPassCore
        link: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PPASS_BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  PPass:
    build:
      targets:
        PPass: all
    test:
      targets:
        - PPassTests
