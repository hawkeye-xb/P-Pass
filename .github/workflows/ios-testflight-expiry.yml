# #940：TestFlight 构建 90 天过期守护。
#
# TestFlight 每个构建自上传起 90 天过期，过期后外部测试用户打不开 App。本 workflow 每天查一次
# App Store Connect（只读）里最新 VALID build 的上传时间，超过 75 天没有新 build 就开一个 issue 提醒；
# 同标题 issue 还开着就不重复开。只提醒，不自动重新上传（重新上传走 ci-ios.yml 的 testflight_version 手动入口，
# 步骤写在 issue 正文与 docs/runbook/ios-testflight-external.md）。
#
# 没有 ASC_* secrets（fork、未配置）时干净跳过并在 summary 标注，不会变红。
# 有 secrets 但查询失败（鉴权、网络、没有该 App）是真问题，让 job 红。
# 查询与判定逻辑在 tools/ios/asc-builds.py（--latest-valid），单测 tools/ios/test_asc_builds.py。
name: iOS TestFlight expiry guard

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: ios-testflight-expiry
  cancel-in-progress: false

jobs:
  guard:
    # ⚠️ 名字写死（CI-06）。
    name: ios testflight expiry guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check secrets
        id: sec
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          if [ -n "$ASC_KEY_ID" ] && [ -n "$ASC_ISSUER_ID" ] && [ -n "$ASC_KEY_P8" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "### iOS TestFlight expiry guard" >> "$GITHUB_STEP_SUMMARY"
            echo "- 跳过：缺 ASC_KEY_ID / ASC_ISSUER_ID / ASC_KEY_P8 之一，未检查过期" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Unit tests (decision rules)
        if: steps.sec.outputs.present == 'true'
        run: python3 tools/ios/test_asc_builds.py

      - name: Install cryptography
        if: steps.sec.outputs.present == 'true'
        run: python3 -m pip install --quiet cryptography

      - name: List open issues
        if: steps.sec.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 500 --json number,title > "$RUNNER_TEMP/open-issues.json"

      - name: Query latest VALID build (read-only)
        id: q
        if: steps.sec.outputs.present == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -euo pipefail
          python3 tools/ios/asc-builds.py --latest-valid \
            --open-issues-json "$RUNNER_TEMP/open-issues.json" \
            --body-out "$RUNNER_TEMP/issue-body.md" | tee -a "$GITHUB_OUTPUT"

      - name: Open reminder issue
        if: steps.sec.outputs.present == 'true' && steps.q.outputs.need_issue == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ steps.q.outputs.title }}
        run: gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body-file "$RUNNER_TEMP/issue-body.md"

      - name: Summary
        if: always() && steps.sec.outputs.present == 'true'
        env:
          STALE: ${{ steps.q.outputs.stale }}
          REMAINING: ${{ steps.q.outputs.remaining_days }}
          UPLOADED: ${{ steps.q.outputs.latest_uploaded }}
          NEED: ${{ steps.q.outputs.need_issue }}
        run: |
          {
            echo "### iOS TestFlight expiry guard"
            echo "- 最新 VALID build 上传时间：${UPLOADED:-（查询未完成或没有）}"
            echo "- 剩余天数：${REMAINING:-?}（超过 75 天没新 build 即提醒）"
            echo "- 需要提醒：${STALE:-?}；本次新开 issue：${NEED:-?}（同标题已开则不重复）"
          } >> "$GITHUB_STEP_SUMMARY"
