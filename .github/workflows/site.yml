name: site

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'site/package.json'
      - 'site/package-lock.json'
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/site.yml'
  workflow_dispatch:

# Site line only: builds the Astro static site under site/ and deploys to
# GitHub Pages. Fully isolated from the main CI (pr.yml / e2e.yml / release.yml)
# — app code changes never trigger this workflow.
#
# 2026-08-23（CI 重构③修正）：加 pull_request——dependabot 升级 actions/
# npm 依赖时 PR 必须能跑检查（K3 评审抓到的「删 PR 触发 + dependabot =
# 升级零检查」），paths 只含流水线文件 + site 依赖清单，业务代码不触发。

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # 2026-08-23 修正：group 带 ref——裸 `pages` 会让 5 个 dependabot PR
  # 并行触发时互相 cancel（build 报 "operation was canceled"）。
  # 带 ref 后：同分支连续 push 取消旧的（部署最新），不同 PR 互不干扰。
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      # 全 pin commit SHA（CI 重构③，2026-08-23）：供应链攻击面归零，
      # dependabot 统一升级。
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Token/icon derivation must stay in sync with design source of truth.
      # tokens.css / public/icons/ ARE committed; these asserts catch edits to
      # tokens.json / icon SVGs that forgot to regenerate the derived files.
      - name: Assert tokens.css matches tokens.json
        run: npm run tokens:check

      - name: Assert icons match design source
        run: npm run icons:check

      - name: Build (regenerates tokens + icons, then astro build)
        run: npm run build

      - name: Zero third-party requests
        run: |
          set -euo pipefail
          # Allowlist: our own domain (self) + github.com (deliberate outbound
          # download links). Any other external origin in built assets means
          # a tracker / CDN / font leak — fail.
          ALLOW='^(https://p-pass\.hawkeye-xb\.com|https://github\.com)'
          BAD=$(grep -rEoh 'https?://[^"'"'"' )]+' dist --include='*.html' --include='*.css' --include='*.js' | grep -vE "$ALLOW" || true)
          if [ -n "$BAD" ]; then
            echo "third-party origin found in dist:"; echo "$BAD"; exit 1
          fi
          echo "no third-party requests ✓"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    # 2026-08-23：PR 只验证 build（dependabot 升级不破坏 Pages 构建），
    # deploy 只在 push 到 main 时真发布——PR 上 deploy-pages 会因环境
    # 权限失败（0s fail）。
    if: github.event_name != 'pull_request'
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
