# CI-01: 流水线分块——桌面域（src-tauri lib tests + UI 构建）。
#
# 触发路径（依赖表，2026-08-12）：
#   apps/desktop/**  —— 桌面工程本体（Svelte UI + src-tauri Rust）
#   assets/**        —— tokens/design（UI token 化消费；含 i18n）
# 反向依赖检查：desktop 工作区是独立 Cargo workspace（T-041 决定），
# crates/** 改动不触发本 workflow（Rust 核心域由 ci-rust.yml 覆盖）——
# src-tauri 只依赖已发布的 iroh 栈，与 crates/ 无编译级耦合。
# 2026-08-23（CI 重构⑤）：删 pull_request 触发——直推 main 阶段 PR 事件
# 用不上，同一 commit 双触发白烧额度；只留 push。
# 2026-08-23 修正（K3 评审抓到的自相矛盾）：删 PR 触发 + dependabot =
# 升级 PR 零检查。加回 pull_request，paths 只含流水线文件 + pnpm/npm 依赖
# 清单——dependabot 改什么就触发什么，业务代码 PR 依旧不跑。
# 2026-09-20（CI-07 #189）：上面那句「业务代码 PR 依旧不跑」**已作废**，
# 理由同 ci-rust.yml（直推 main 的前提没了；本仓 PUBLIC 不计费）。
# 对桌面域尤其要命：src-tauri 是独立 workspace，主 workspace 的 just ci
# 覆盖不到它，本 lane 是它**唯一**的自动化门禁——而改 apps/desktop/** 的
# PR 恰恰不触发本 lane。
name: CI Desktop

on:
  # CI-07（2026-09-20）：**刻意不设 paths，每个 PR 都跑**，理由同
  # ci-rust.yml（要设为必需检查的 lane 不能被 paths 跳过，否则 PR 永久
  # Pending）。本 lane 实测 1m11s，是四条业务 lane 里最便宜的一条。
  # ⚠️ 谁要给本 lane 加回 paths，请先把 main 的必需检查里 desktop 那条
  # 摘掉，否则不碰 apps/desktop/** 的 PR 会全部卡死。
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "apps/desktop/**"
      - "assets/**"
      - "rust-toolchain.toml"
      - "tools/setup-rust-toolchain.sh"
      - ".github/workflows/ci-desktop.yml"

permissions:
  contents: read

concurrency:
  group: ci-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # CI-11 (#255)：决定本次改动要不要跑重型门禁。
  #
  # 背景：本 workflow 的 `pull_request` **刻意不设 paths**（CI-07 #189）——
  # 它的检查在 main 的必需列表里，而被 paths 跳过的 workflow **根本不汇报
  # 状态**，必需检查会永久 Pending 把 PR 挡死。代价是纯文档 PR 也整条跑。
  #
  # 出路：把「要不要干活」从触发层下放到 **job 层**。被 `if:` 跳过的 job
  # **会汇报 `skipped`，而 `skipped` 对必需检查算通过** —— PR #260 实测过：
  # 给必需检查 `architecture enforcement` 加 `if: false`，PR 仍然 CLEAN。
  #
  # 判据本身在 tools/ci-needs-full-lane.sh，口径是 **allowlist 不是
  # blocklist**：只有每个改动文件都落在无害清单里才判可跳过，任何不确定
  # 都判要跑。它有变异测试（tools/test-ci-needs-full-lane.sh）。
  #
  # ⚠️ 两个 workflow 各有一份这个 job（workflow 之间不能共享 output）。
  # 改判据只改 tools/ 里那个脚本，这里两处只是调用。
  changes:
    name: changes (要不要跑桌面壳门禁)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_heavy: ${{ steps.decide.outputs.run_heavy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 要和 base 做 diff，浅 clone 算不出来。算不出时脚本会判「要跑」，
          # 但那等于本 job 白干，所以这里直接取全量历史。
          fetch-depth: 0
      # 判据脚本自己先过一遍它的变异测试再去用它 —— #230 就是「安全测试
      # 不在任何门禁里」才让 #192 那个真删除缺陷活下来的。本 job 每个 PR
      # 都跑（它自己不被跳过），所以这个测试也就每个 PR 都跑。约 1 秒。
      # 这一步红 ⇒ changes job 红 ⇒ 下游按 `!= 'false'` 照常全跑（fail-closed）。
      - name: 判据自检（含变异反证）
        shell: bash
        run: tools/test-ci-needs-full-lane.sh
      - id: decide
        shell: bash
        run: |
          set -uo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "非 PR 事件（push 到 main）→ 恒定全跑，不做任何跳过"
            echo "run_heavy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          need="$(tools/ci-needs-full-lane.sh "${{ github.event.pull_request.base.sha }}")"
          echo "判定结果: run_heavy=$need"
          echo "run_heavy=$need" >> "$GITHUB_OUTPUT"

  # CI-11 修正（#255，2026-09-20，探针 PR #271 抓到）：
  # **拆成两个 job，名字写死，不再用 matrix 现算。**
  #
  # 原来这里是一个带 matrix 的 job，靠 `name: desktop (${{ matrix.os }})`
  # 从 `os: [ubuntu-latest, windows-latest]` 现算出两个检查名。#261 给它加上
  # 「可以跳过」之后立刻出事：**job 被 `if:` 跳过时 GitHub 不展开 matrix**，
  # 于是只汇报一条名叫 `desktop (${{ matrix.os }})` 的检查——模板原文。
  # 而分支保护是按名字的**字面文本**去对的，它要的
  # `desktop (ubuntu-latest)` / `desktop (windows-latest)` 一条都没来
  # ⇒ 必需检查永久 Pending ⇒ 纯文档 PR 永远合不进去。
  # 探针 PR #271 实测：纯文档改动 → mergeStateStatus=BLOCKED。
  #
  # 关键在于**这跟「跳过」本身无关**。同一次跳过里，名字写死的 job
  # （clippy (deny warnings) / architecture enforcement / test (windows)）
  # 全都正常汇报了 `skipped`，一个没漏。**根因只有「名字是现算的」这一个
  # 特征**，所以修法就是把名字改回常量：没有东西可算，跳过时照样汇报。
  # 这也正是 #240 之前的写法（当时是单个 job，`name:` 是写死的字符串）。
  #
  # 为什么不用 matrix 反而更诚实：这条 lane 的 12 个步骤里有 5 个标着
  # 「只在 Linux 跑」——它本来就不是「同样的活跑两遍」。
  # 两个 job 天然互不牵连，原来那个 `fail-fast: false` 也就不需要了
  # （CI-01④「四层洋葱」事故的教训：一边红不能掩掉另一边的结论）。
  #
  # ⚠️ 这两个 `name:` 的字面值 = main 的必需检查名，**一个字都不能改**。
  #    改名 = 分支保护等一个永不汇报的名字 = 全部 PR 永久 Pending。
  # ⚠️ 步骤**只有一份**，在 .github/actions/desktop-checks/action.yml。
  #    要加步骤改那里，别在这两个 job 里各写一遍——重复就会漂移。
  #
  # 下面两处 `if:` 的口径（CI-11 #255）：**只有明确收到 'false' 才跳过**。
  # 不能写成 `== 'true'` —— 那样 changes job 一旦失败，输出为空、条件算 false、
  # 本 job 被跳过、而 skipped 对必需检查**算通过** ⇒ 判据自己挂了反而放行，
  # 正是本仓这一轮在修的 fail-open。写成 `!= 'false'` 则失败时照跑。
  # `!cancelled()` 是状态函数，它让本 job 在 changes 失败时**仍然执行**
  # （否则 needs 的隐式 success() 会把它跳掉，又回到 fail-open）。
  desktop-linux:
    name: desktop (ubuntu-latest)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.run_heavy != 'false' }}
    runs-on: ubuntu-latest
    # 实测 1m11s。#240 为了迁就 Windows 把两边一起提到 45，现在拆开了，
    # Linux 这边回到 CI-01 原本的 30。
    timeout-minutes: 30
    steps:
      # 全 pin commit SHA（CI 重构③，2026-08-23）：供应链攻击面归零，
      # dependabot 统一升级。
      # checkout 必须留在 job 里：下一步引用的是仓库内的本地 action
      # （./.github/actions/...），没 checkout 就没有那个文件。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/desktop-checks

  # CI-06（#164，2026-09-20）：Windows 这条是这次里程碑新加的。
  # 在此之前**整个 CI 里没有一台 Windows 机器**——ci-rust.yml 里那个叫
  # "test (nextest + windows cross-check)" 的 job 名字带 windows，实际只是
  # `cargo check -p platform --target x86_64-pc-windows-msvc`：交叉 check
  # 一个 crate，不链接、不跑任何测试。名字比能力大，是个陷阱。
  # 后果是实测过的：「Windows 平台收口」里程碑为桌面壳补的 7 组回归测试
  # （#214 #216 #217 #220 #223 #226 #229，本机 37 passed）在 CI 上一次都
  # 没执行过。桌面壳又是独立 Cargo workspace（ADR-012），主 workspace 的
  # just ci 覆盖不到它——本 lane 是它唯一的自动化门禁。
  #
  # 为什么这条 lane 能便宜地上 Windows：桌面壳只依赖 crates/platform
  # （纯 Rust），**不依赖 media-codec**，所以不需要 vcpkg 静态 libheif
  # 那套构建。那部分是 daemon 的事，在 ci-rust.yml 的 test (windows) 里。
  desktop-windows:
    name: desktop (windows-latest)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.run_heavy != 'false' }}
    runs-on: windows-latest
    # Windows 冷构建（tauri 依赖树 + MSVC 链接）比 Linux 慢得多，30min 不够；
    # 显式给到 45。cargo test 没有单测级超时，真挂死（DAE-06 #176 那种 300s
    # 级别的）只能靠 job 超时兜底。
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/desktop-checks
