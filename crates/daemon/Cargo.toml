[package]
name = "daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
proto = { path = "../proto" }
blake3 = "1"
transport = { path = "../transport" }
storage = { path = "../storage" }
core-index = { path = "../core-index" }
platform = { path = "../platform" }
media-codec = { path = "../media-codec" }
diag = { path = "../diag" }
# base64 for in-frame thumbnail bytes (already in tree via storage).
base64 = "0.22"
thiserror.workspace = true
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
futures-core = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util"] }
# SYNC-03: per-NodeId cancellation handle for the QUIC subscribe registry —
# same primitive tokio itself ships for "cancel this task from outside",
# not a hand-rolled channel.
tokio-util = "0.7"
# WATCH-01: cross-platform filesystem watching (FSEvents/inotify/ReadDirChangesW).
notify = "7"
# OS randomness for one-time pairing tokens (T-031). Already in the tree
# via iroh; declared directly because tokens are a security surface.
getrandom = "0.3"
# Update manifest (T-062): semver compare + Ed25519 verify. Both already in
# the tree via iroh; declared directly because they are a security surface.
semver = "1"
ed25519-dalek = "3"
# Update artifact verify (T-062b): sha256 + hex. Already in the tree via iroh;
# declared directly because artifact integrity is a security surface.
sha2 = "0.10"
hex = "0.4"
interprocess = { version = "2", features = ["tokio"] }
zip = { version = "5", default-features = false, features = ["deflate"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# T-090 disk watermarks in `status`: statvfs on the photo-library volume —
# std::fs has no stable capacity API. Already in the tree (tokio/iroh pull
# it in); declared directly because we now call it ourselves. Unix-only:
# rule B.2 keeps cfg(windows) out of this crate, non-unix reports null.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
blake3 = "1"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
