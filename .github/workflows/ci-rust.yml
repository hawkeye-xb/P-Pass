# CI-01: 流水线分块——Rust 域（lint + test + arch-check + license）。
#
# 触发路径（依赖表，2026-08-12 验收核心）：
#   crates/**       —— 核心 crate 代码（proto/daemon/storage/transport…）
#   Cargo.toml      —— workspace 依赖变更（影响全部 crate）
#   Cargo.lock      —— 锁文件变更（依赖解析结果）
#   config/**       —— 运行配置（arch-check 读它做架构门禁）
#   assets/i18n/**  —— i18n 字典（diag keys.rs ALL 断言消费）
#   tools/arch-check.sh —— 架构门禁脚本本身
# 反向依赖检查：crates/proto 的金样本 snapshots.rs 被 Android GoldenDriftTest
# 消费——改 crates/** 触发本 workflow（Rust 侧自检），Android 侧由
# ci-android.yml（apps/android/**）触发时 GoldenDriftTest 比对，两域都覆盖。
# 纯 docs/ .claude/ 提交不匹配任何 paths → 零 CI（验收 1）。
#
# 结构（2026-08-23 重构，CI-01④）：
#   5 个 gate 从单 job 串行改为**独立并行 job**——fail-fast 的串行洋葱
#   会让一层红掩盖下一层（8/22 四层洋葱事故：fmt→clippy→test→arch→deny
#   每层都要"修一次才知道下一个"，deny 层从未被跑到）。并行后一次 push
#   所有层同时跑，红就全红、全显示，一次全修完。
#   cache key 各 job 带 job 名前缀，避免并行写 cache 竞争互相覆盖。
# 2026-08-23（CI 重构⑤）：删 pull_request 触发——直推 main 阶段 PR 事件
# 用不上，同一 commit 双触发白烧额度；只留 push。
# 2026-08-23 修正（K3 评审抓到的自相矛盾）：删 PR 触发 + dependabot =
# 升级 PR 零检查（dependabot.yml 里写的「PR → CI 绿 → 合」永远等不来绿）。
# 加回 pull_request，但 paths 只含流水线文件 + 依赖清单——dependabot
# 改什么就触发什么，业务代码 PR 依旧不跑，额度不多花。
# 2026-09-20（CI-07 #189）：上面那句「业务代码 PR 依旧不跑」**已作废**。
# 它依赖的两条前提今天都不成立了：① 工作流已从直推 main 改为
# issue -> 分支 -> PR -> squash，PR 事件不再是多余的；② 本仓是 PUBLIC，
# 标准 GitHub-hosted runner 不计费（Windows 的 2x 分钟乘数同样不适用于
# 公开仓），「白烧额度」无从谈起。后果实测过：PR #217 修的是
# crates/daemon 里一处 P0 级对账缺陷，合入时 clippy / test / arch-check
# 一条都没跑，PR 上的检查列表只有 identity 一条。
name: CI Rust

on:
  # CI-07（2026-09-20）：**刻意不设 paths，每个 PR 都跑**。
  # 本 lane 的 clippy / test / architecture 三条要进 main 的必需检查，而
  # GitHub 官方文档明写：被 paths 跳过的 workflow，其检查会停在 Pending
  # 并挡住合并（"Associated checks stay in a 'Pending' state and block
  # merging"），给出的建议是 "Avoid requiring workflows that can be
  # skipped."。所以**带 paths + 设必需 = 自锁**：一个只改 apps/** 的 PR
  # 永远等不到 clippy 报告，而 enforce_admins=true 连管理员也绕不过。
  # 代价：每个 PR 固定多跑本 lane（实测 job-分钟合计 6m29s，五个 job 并行
  # 墙钟约 4min）。公开仓不计费，这个代价是 0。
  # ⚠️ 谁要给本 lane 加回 paths，请先把 main 的必需检查里对应的三条摘掉，
  # 否则会把所有不碰 crates/** 的 PR 全部卡死。
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "config/**"
      - "assets/i18n/**"
      - "tools/arch-check.sh"
      - "rust-toolchain.toml"
      - "tools/setup-rust-toolchain.sh"
      - "tools/check-rust-toolchain-ci.sh"
      - ".github/workflows/ci-rust.yml"

permissions:
  contents: read

concurrency:
  group: ci-rust-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: fmt + actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify Cargo workflows use rust-toolchain.toml
        run: tools/check-rust-toolchain-ci.sh

      # 直接下载官方 release + sha256 钉死（CI 实测：pin 的 install-action
      # SHA 不认识 actionlint，回退 cargo-binstall 又找不到同名 crate——
      # actionlint 是 Go 工具不是 crate，exit 76）。版本升级时同步换校验和。
      - name: Actionlint (workflow lint)
        run: |
          set -euo pipefail
          curl -sfL -o /tmp/actionlint.tgz \
            "https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz"
          echo "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757  /tmp/actionlint.tgz" | sha256sum -c -
          tar -xzf /tmp/actionlint.tgz -C /tmp actionlint
          /tmp/actionlint -color

      - name: Set Rust toolchain from rust-toolchain.toml
        shell: bash
        run: tools/setup-rust-toolchain.sh

      - name: Format check
        run: cargo fmt --all -- --check

  clippy:
    name: clippy (deny warnings)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set Rust toolchain from rust-toolchain.toml
        shell: bash
        run: tools/setup-rust-toolchain.sh

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: clippy-${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      # --all-targets 会编译测试二进制（链接 libheif），dev headers 必需。
      - name: System codecs (libheif + HEVC plugin for HEIC, ffmpeg for video thumbs)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libheif-dev libheif-plugin-libde265 ffmpeg libnuma-dev

      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: test (nextest + windows cross-check)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set Rust toolchain from rust-toolchain.toml
        shell: bash
        run: tools/setup-rust-toolchain.sh

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: test-${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: System codecs (libheif + HEVC plugin for HEIC, ffmpeg for video thumbs)
        # libheif-plugin-libde265 is the HEVC decode plugin — without it
        # libheif opens HEIC containers but cannot decode the pixels
        # ("Unsupported codec"), verified in a clean noble container.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libheif-dev libheif-plugin-libde265 ffmpeg libnuma-dev

      - name: Install cargo-nextest
        uses: taiki-e/install-action@26e9283f268b880168bdbd2c545dfcd60ec2c6ab # v2.87.13
        with:
          tool: cargo-nextest

      - name: Test (nextest)
        run: cargo nextest run --all-features

      - name: Windows cross-check (platform crate compiles for msvc)
        run: rustup target add x86_64-pc-windows-msvc && cargo check -p platform --target x86_64-pc-windows-msvc

  # CI-06 后半（#164，2026-09-20）：daemon 侧的测试第一次在**真 Windows** 上跑。
  #
  # 为什么要单开一个 job 而不是把上面的 test 改成矩阵：
  #   上面那个 job 的名字 `test (nextest + windows cross-check)` **已经在 main 的
  #   必需检查列表里**。矩阵会给名字加 `(ubuntu-latest)` 后缀 ⇒ 必需检查对不上
  #   ⇒ 全部 PR 永久 Pending，管理员也绕不过（enforce_admins=true）。
  #   ⇒ 本轮一个字都不动上面那个 job。它那句 "windows cross-check" 名不副实
  #     （只是 cargo check 一个 crate），正名留给**独立的一次操作**：
  #     删冗余步骤 + 改名 + 同步改分支保护，三件必须在同一次里成对完成。
  #
  # ⚠️ 本 job **刻意不进必需检查**（至少本轮不进）。它是每个 PR 都跑的，
  # 一旦设为必需，所有人的等待时间就被本 job 顶到底。先量稳定耗时再由用户决定。
  test-windows:
    name: test (windows)
    runs-on: windows-latest
    # 冷缓存那次要建 vcpkg 静态 libheif（约 20min）+ 全量冷构建，给足余量；
    # 热缓存下应远低于此。cargo test 没有单测级超时，DAE-06 (#176) 那种 300s
    # 级挂死只能靠 job 超时兜底 —— 所以这是上限，不是预算。
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set Rust toolchain from rust-toolchain.toml
        shell: bash
        run: tools/setup-rust-toolchain.sh

      # ⭐ 本 job 能不能每个 PR 跑，全看这一步。
      # artifacts.yml 只缓存了 cargo，**vcpkg 安装树没缓存** —— 那就是它注释里
      # 「vcpkg static libheif is ~20min, not worth every push」、只能手工触发
      # 的原因。这里把安装树也缓存掉。
      # key 里带 ImageVersion：runner 镜像一换，它自带的 vcpkg 提交（连带端口
      # 版本与编译工具链）就可能变，缓存必须跟着失效，否则会拿旧 ABI 的
      # heif.lib 去链新工具链，炸得莫名其妙。
      # ⚠️ 改动下面那行 install 的端口或特性时，**把 -v1 改成 -v2**，否则会命中
      # 旧特性的安装树 —— #235 实测过 vcpkg 换特性时 install 会拒绝执行（要
      # --recurse），而 libheif-sys 的 build script 缓存仍注入 x265-static，
      # 直接 LNK1181。缓存不失效会把那个一次性的坑变成常驻故障。
      # key 在步骤里算，不用 `${{ env.ImageVersion }}` —— `env` 上下文**只含
      # workflow/job/step 里声明的变量**，runner 镜像自己的环境变量不在其中。
      # 那样写会静默解析成空串，key 退化成常量，而注释还在说「镜像换了会失效」
      # —— 属于自己骗自己。在 bash 步骤里 $ImageVersion 才真的读得到。
      - name: Compute vcpkg cache key
        id: vkey
        shell: bash
        run: |
          key="vcpkg-libheif-core-x64-windows-static-md-${ImageVersion:-unknown}-v1"
          echo "key=$key" >> "$GITHUB_OUTPUT"
          echo "vcpkg cache key = $key"
      - name: Cache vcpkg (static libheif)
        id: vcpkg-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: C:\vcpkg\installed
          key: ${{ steps.vkey.outputs.key }}

      # 与 artifacts.yml 逐字一致（BUILD-08 #235）：[core] = 不带默认特性，
      # 摘掉 GPL 的 x265 编码器。HEIC **解码**靠 libde265，它是基础依赖不是特性。
      # --clean-after-build 会删掉 packages/ 与 buildtrees/，所以上面只缓存
      # installed/ —— 缓存别的目录是白占空间。
      # 自报耗时与缓存命中，用来验「缓存命中后从 ~20min 掉到 1 分钟量级」
      # 这条成功判据 —— 不许用「首次慢、以后快」含糊过去，要贴冷/热两次数字。
      - name: Install libheif (vcpkg, static, no HEVC encoder)
        shell: bash
        run: |
          echo "cache-hit = ${{ steps.vcpkg-cache.outputs.cache-hit }}"
          start=$(date +%s)
          /c/vcpkg/vcpkg.exe install "libheif[core]:x64-windows-static-md" --clean-after-build
          echo "VCPKG_INSTALL_SECONDS=$(( $(date +%s) - start ))"

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: test-windows-cargo-${{ hashFiles('**/Cargo.lock') }}

      # ffmpeg：Linux 那个 job 用 apt 装，Windows 上没有对应物，用仓库自己的
      # tools/fetch-ffmpeg.sh（它有 MINGW*/MSYS* 分支，在 runner 的 Git Bash
      # 下 `uname -s` 正好命中）。
      # 这不是「给 CI 开后门让测试变绿」——失败的那条测试自己的断言就写着
      # 「ffmpeg required on dev/CI machines」，是**开发机契约**；而**产品**
      # 侧「用户机器上没有 ffmpeg 也要活」由 media-codec::ql_fallback 的
      # video_thumbs_survive_a_machine_without_ffmpeg 守着，那条在 Windows 上
      # 本来就通过。所以装 ffmpeg 不丢任何覆盖。
      # ⚠️ 该脚本从 gyan.dev 拉 zip，**不带版本钉死与校验和**（脚本头部注释
      # 自己写着这留给 T-071 发布流水线做）。这条 lane 引入了一个未校验的
      # 第三方下载，与本仓「action 全 pin SHA」的口径不一致 —— 已开为 #252，
      # 不在本 PR 顺手修。
      - name: Fetch ffmpeg (video thumbnail tests)
        shell: bash
        run: |
          tools/fetch-ffmpeg.sh
          echo "PPF_FFMPEG=$PWD/tools/ffmpeg/ffmpeg.exe" >> "$GITHUB_ENV"

      - name: Install cargo-nextest
        uses: taiki-e/install-action@26e9283f268b880168bdbd2c545dfcd60ec2c6ab # v2.87.13
        with:
          tool: cargo-nextest

      # ⚠️⚠️ **刻意不带 `--all-features`** —— 上面那个 Linux job 带，这里不带，
      # 这个差异是有理由的，不是抄漏了：
      #   本仓的 android-jni feature 用到 `std::os::fd`，Windows 上**不存在**，
      #   `--all-features` 把这个「只给 Android 桥用」的 feature 强开到 Windows
      #   ⇒ transport crate 当场 E0432/E0599 编不过。那正是 BUILD-06 (#174)
      #   的根因，也是 justfile:74-82 刻意不用这个 flag 的原因。
      # 覆盖账：android-jni 那条路径仍由 Linux job 的 --all-features 覆盖，没丢。
      # 👉 谁要在这里"顺手补上" --all-features，先去读 #174。
      # `--no-fail-fast`：nextest 默认一红就掐断。首次跑本 lane 时一条
      # ffmpeg 失败**掩掉了后面 130 个测试**（307/437 就停了）—— 跟本仓
      # CI-01④「四层洋葱」事故一模一样的病：上一层红让下一层永远跑不到。
      # 这条 lane 的职责是**一次把 Windows 上所有问题摊开**，不是尽早失败。
      - name: Test (nextest, 无 --all-features — 见上方注释)
        shell: bash
        env:
          VCPKG_ROOT: "C:\\vcpkg"
        run: cargo nextest run --no-fail-fast

  arch:
    name: architecture enforcement
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Architecture enforcement
        run: bash tools/arch-check.sh

  deny:
    name: license + dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set Rust toolchain from rust-toolchain.toml
        shell: bash
        run: tools/setup-rust-toolchain.sh

      - name: Cache cargo (registry only)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
          key: deny-${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install cargo-deny
        uses: taiki-e/install-action@26e9283f268b880168bdbd2c545dfcd60ec2c6ab # v2.87.13
        with:
          tool: cargo-deny

      - name: License and dependency audit
        run: cargo deny check advisories licenses bans
