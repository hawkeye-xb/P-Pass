name: Linux Artifacts

# Push-to-main builds the Linux x86_64 / macOS arm64 daemon + testclient and
# publishes them as assets of a FIXED GitHub Release `dogfood` (prerelease).
# Consumer machines fetch via `gh release download` / curl — no git objects
# polluted, no orphan branches, no force-push history loss (previously
# bin-linux-x64 / bin-macos-arm64 orphan branches, retired 2026-08-23).
#
# Release/tag semantics:
#   - Tag `dogfood` is created ONCE (first successful run) and NEVER moved /
#     deleted — only its assets are clobbered on each push. This keeps the
#     "tags are only for real releases" rule intact (v* is release.yml's).
#   - Windows x64 → same `dogfood` release, workflow_dispatch only
#     (vcpkg static libheif is ~20min, not worth every push; H-09 Windows
#     smoke machine fetches it the same release-download way).
#
# ⚠️ Repo-bloat lessons (2026-08-10, dev machine .git hit 3.3GB): the old
# force-pushed bin-* generations piled up as unreachable objects in every
# clone that fetched them. Release assets do NOT enter git — no exclusion
# config needed anymore. Existing dev-machine fetch exclusions are harmless
# leftovers; old bin-* branches are left in place (not deleted) for anyone
# mid-migration.
#
# paths-filter below: docs/card-only pushes must not rebuild + re-upload
# ~100MB of identical binaries. Keep the filter in sync with what actually
# feeds the build.

on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "config/**"
      - "assets/i18n/**"
      - "tools/bundle-macos.sh"
      - "tools/dogfood-smoke.sh"
      - "tools/win-smoke.ps1"
      - ".github/workflows/artifacts.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: artifacts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-arm64-bin:
    runs-on: macos-14 # Apple Silicon
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: macos-arm64-artifacts-${{ hashFiles('**/Cargo.lock') }}

      - name: System codecs (libheif via brew)
        run: brew install libheif

      - name: Build release binaries
        run: cargo build --release -p daemon -p testclient

      - name: Bundle self-contained (dylibs + rpath rewrite)
        run: tools/bundle-macos.sh /tmp/bin target/release/daemon target/release/testclient

      - name: Package + upload to dogfood release (macos-arm64)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cp tools/dogfood-smoke.sh /tmp/bin/ || true
          cd /tmp/bin
          shasum -a 256 daemon testclient lib/*.dylib > SHA256SUMS-macos-arm64
          echo "built from ${GITHUB_SHA} on $(date -u +%FT%TZ)" > BUILD_INFO-macos-arm64
          cd /tmp && tar -czf ppass-macos-arm64.tar.gz bin
          # Fixed tag `dogfood`, created once, assets clobbered per push.
          # Race-safe: macos/linux jobs run in parallel; the loser of the
          # first-run create race just sees "already exists" and proceeds
          # to upload (|| true absorbs the race, upload fails loudly later).
          # NOTE: gh must be told the repo explicitly — the shell cwd here
          # is /tmp/bin, not a git checkout, so gh can't infer it.
          gh release view dogfood --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create dogfood --repo "$GITHUB_REPOSITORY" --prerelease --title "dogfood binaries" \
              --notes "continuous builds of main (macos-arm64 / linux-x64 / win-x64). Tag is fixed, assets are clobbered on each push." || true
          gh release upload dogfood --repo "$GITHUB_REPOSITORY" \
            /tmp/ppass-macos-arm64.tar.gz \
            /tmp/bin/SHA256SUMS-macos-arm64 \
            /tmp/bin/BUILD_INFO-macos-arm64 \
            --clobber

  linux-bin:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: linux-artifacts-${{ hashFiles('**/Cargo.lock') }}

      - name: System codecs (libheif + HEVC plugin, ffmpeg)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libheif-dev libheif-plugin-libde265 ffmpeg

      - name: Build release binaries
        run: cargo build --release -p daemon -p testclient

      - name: Upload to dogfood release (linux-x64)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/rel
          cp target/release/daemon target/release/testclient /tmp/rel/
          cp tools/dogfood-smoke.sh /tmp/rel/ || true
          cd /tmp/rel
          sha256sum daemon testclient > SHA256SUMS-linux-x64
          echo "built from ${GITHUB_SHA} on $(date -u +%FT%TZ)" > BUILD_INFO-linux-x64
          # Fixed tag `dogfood`, created once, assets clobbered per push.
          # Race-safe: see macos job comment. Same --repo necessity (cwd
          # is /tmp/rel, not a git checkout).
          gh release view dogfood --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create dogfood --repo "$GITHUB_REPOSITORY" --prerelease --title "dogfood binaries" \
              --notes "continuous builds of main (macos-arm64 / linux-x64 / win-x64). Tag is fixed, assets are clobbered on each push." || true
          gh release upload dogfood --repo "$GITHUB_REPOSITORY" \
            /tmp/rel/daemon \
            /tmp/rel/testclient \
            /tmp/rel/dogfood-smoke.sh \
            /tmp/rel/SHA256SUMS-linux-x64 \
            /tmp/rel/BUILD_INFO-linux-x64 \
            --clobber

  # H-09: Windows 真机冒烟分发通道。仅 workflow_dispatch 触发（vcpkg 静态
  # libheif 构建 ~20 分钟，不值得每次 push 都跑）；产物上传到同一 dogfood
  # release，Win 测试机器 `gh release download` 即得（公开仓免认证）。
  windows-x64-bin:
    runs-on: windows-latest
    timeout-minutes: 45
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: win-x64-artifacts-${{ hashFiles('**/Cargo.lock') }}

      - name: Install libheif (vcpkg, static)
        shell: bash
        run: |
          /c/vcpkg/vcpkg.exe install "libheif:x64-windows-static-md" --clean-after-build

      - name: Build release binaries
        shell: bash
        env:
          VCPKG_ROOT: "C:\\vcpkg"
        run: cargo build --release -p daemon -p testclient

      - name: Upload to dogfood release (win-x64)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/rel
          cp target/release/daemon.exe target/release/testclient.exe /tmp/rel/
          # 冒烟脚本是 Win 真机验证的必需件——复制失败必须响（H-09b：不许 || true 吞掉）
          cp tools/win-smoke.ps1 /tmp/rel/
          cd /tmp/rel
          sha256sum daemon.exe testclient.exe > SHA256SUMS-win-x64
          echo "built from ${GITHUB_SHA} on $(date -u +%FT%TZ)" > BUILD_INFO-win-x64
          # Fixed tag `dogfood`, created once, assets clobbered per push.
          # Race-safe: see macos job comment. Same --repo necessity (cwd
          # is /tmp/rel, not a git checkout).
          gh release view dogfood --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create dogfood --repo "$GITHUB_REPOSITORY" --prerelease --title "dogfood binaries" \
              --notes "continuous builds of main (macos-arm64 / linux-x64 / win-x64). Tag is fixed, assets are clobbered on each push." || true
          gh release upload dogfood --repo "$GITHUB_REPOSITORY" \
            /tmp/rel/daemon.exe \
            /tmp/rel/testclient.exe \
            /tmp/rel/win-smoke.ps1 \
            /tmp/rel/SHA256SUMS-win-x64 \
            /tmp/rel/BUILD_INFO-win-x64 \
            --clobber
