# P-Pass daemon 配置示例。复制为 config.toml 使用；所有字段可省略，
# 省略即用编译内置默认值（官方端点见 endpoints.default.toml）。
# 每个字段也可用环境变量覆盖（优先级最高）：前缀 PPF_，见各字段注释。

# 照片库根目录。未设置时由平台适配层给出系统惯例目录（T-040）。
# env: PPF_DATA_DIR
#data_dir = "/path/to/library"

# 中继端点覆盖（自建者指向自己的 relay）。
# env: PPF_RELAY_URLS（逗号分隔）
#relay_urls = ["https://relay.example.com"]

# 注：旧版示例里的 rendezvous_url / log_level 已退役（无任何读者）。旧 config.toml 里
# 留着它们不会报错，但也不会生效；日志级别请用环境变量 RUST_LOG。
