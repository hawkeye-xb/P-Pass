# E2E-01: android live scenarios (android-hello/pair/backup) in CI.
# 防协议回归：Kotlin 侧走真实 iroh-ffi 栈（linux-x86-64 natives 在 Maven
# jar 内，无需模拟器），连一个临时 release daemon，断言
# HELLO OK / PAIR OK / BACKUP OK 三行（12/12 指标见剧本脚本输出）。
#
# CI-01（2026-08-12）并轨：T-070 failure scenarios（huge file / crash
# recovery / disk full）从每推（旧 pr.yml）挪到本 workflow——nightly +
# tag 前门禁（它抓真 bug 但不该每推都烧 release 构建）。e2e job 触发
# 条件不动（nightly/tag/labeled/dispatch），scenarios job 同门禁。
#
# CI-02（2026-09-09）：daemon/testclient release 二进制在同一个 run 里被
# e2e 和 scenarios 两个并行 job 各自从零编译一遍（并行 job 之间 cache 互相
# 看不见），nightly 每天白烧一份编译时间。改法：加一个 build job 编译一次，
# upload-artifact 供两个测试 job download-artifact 复用。失败隔离不变——
# e2e 与 scenarios 仍是两个独立 job，各自 needs: build，一个红不影响另一个
# 出结论（不许合并成一个 job，见下方卡片链接）。
# actions/upload-artifact 的 zip 打包会丢可执行位（已知问题），因此二进制
# 打包为 tar.gz 上传，下游 job `tar -xzf` 解包后天然恢复 +x（tar 格式本身
# 记录 mode bit，无需额外 chmod）。
# 详见 cards/CI-02-e2e-compiles-release-binaries-twice.md（已归档 done/）。
#
# 运行时机：
#   - nightly 定时（schedule）
#   - 发版：#1187 起由 release.yml 以 workflow_call 调用，与构建并行跑，**红了挡发布**
#     （create-draft 等它通过）。这推翻了 2026-08-04「自动化测试不前置」的裁决：那条
#     裁决的本意是不拖每个 commit，发版这一跳不在其列——不挡发布时，红的 E2E 只是一条
#     供人工核对的提示，实际没人核对就发出去了。原来的 tag 触发随之删除，免得一个 tag 跑两遍。
#   - 选择性：PR 打 e2e label，或手动 dispatch
#   - 每 commit 不跑（PR 常规 push 不触发本 workflow）

name: E2E live scenarios

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_call:
  pull_request:
    branches: [main]
    types: [labeled, unlabeled]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # CI-02: 两个测试 job 共用的 release 二进制，只编一次。
  build:
    name: Build release binaries (daemon + testclient)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'e2e')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set Rust toolchain from rust-toolchain.toml
        shell: bash
        run: tools/setup-rust-toolchain.sh

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          # CI-18 (#382)：只编主 workspace（cargo build -p daemon -p testclient）。
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}

      # daemon/testclient release 构建需要 libheif-dev（vendored 编译）+
      # HEVC 解码插件；ffmpeg 供视频首帧测试（下游 job 运行时也要，各自装）。
      - name: System codecs (libheif + HEVC plugin, ffmpeg)
        uses: ./.github/actions/system-codecs

      - name: Build release binaries (daemon + testclient)
        run: cargo build --release -p daemon -p testclient -p decode-worker

      # actions/upload-artifact 的 zip 打包会丢失可执行位（已知问题）；
      # tar 格式自带 mode bit，下游 tar -xzf 后天然恢复 +x。
      - name: Package release binaries (tar preserves exec bit)
        run: tar -czf release-bins.tar.gz -C target/release daemon testclient

      - name: Upload release binaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-bins
          path: release-bins.tar.gz
          retention-days: 1

  e2e:
    name: android live (hello/pair/backup)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 50
    # PR 只有打了 e2e label 才跑（labeled 事件但 label 不在 = 移除，跳过）
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'e2e')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set Rust toolchain from rust-toolchain.toml
        shell: bash
        run: tools/setup-rust-toolchain.sh

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          # CI-18 (#382)：同上，只碰主 workspace。
          key: e2e-${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}

      # 抄 scenarios job：daemon 运行时需要 libheif 运行时库 + HEVC 解码
      # 插件；ffmpeg 供视频首帧测试。ubuntu-latest runner 自带 Android
      # SDK，JVM 测试无需额外安装。
      - name: System codecs (libheif + HEVC plugin, ffmpeg)
        uses: ./.github/actions/system-codecs

      # BUILD-01（2026-09-18）：全仓 JDK 统一 21——iroh 1.1.0 的 uniffi 绑定
      # class 按 JDK 21 编译（major 65），17 加载报 UnsupportedClassVersionError；
      # 以前只有本 job 用 21、其余钉 17 靠"不触 ffi 类"绕行，现三处都读
      # 仓根 .java-version（唯一真相，与本地 scripts/java-home.sh 同源）。
      - name: Setup Java (.java-version)
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version-file: .java-version

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # REBUILD-01: Android JVM scenarios load the native iroh-blobs provider.
      # Mirror ci-android/release: Gradle builds this bridge on demand, so the
      # Rust target and NDK must exist before any scenario invokes Gradle.
      - name: Build Android-native iroh-blobs provider
        run: |
          rustup target add aarch64-linux-android
          echo "ANDROID_NDK_HOME=${ANDROID_NDK_LATEST_HOME}" >> "$GITHUB_ENV"

      - name: Download release binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-bins

      - name: Unpack release binaries (tar restores exec bit)
        run: |
          mkdir -p target/release
          tar -xzf release-bins.tar.gz -C target/release
          test -x target/release/daemon

      # 两剧本 = T-051/T-052 live 验收脚本：起临时 daemon（127.0.0.1
      # 随机端口，无 relay），JVM 测试经真实 iroh-ffi 栈连它。T-054 旧上传
      # 管线剧本随 ppf/upload/1 一起删除（#988）。
      - name: Run android live scenarios
        run: |
          bash tools/android-hello.sh
          bash tools/android-pair.sh

  # CI-01: T-070 failure scenarios 从每推挪到 nightly + tag 前门禁——
  # 它抓真 bug 但不该每推都烧 release 构建（旧 pr.yml 每 push 全跑
  # 四 job 是验收人点名的病灶①）。触发门禁与 e2e job 相同：
  # nightly/tag/labeled/dispatch，纯 docs/卡片提交零触发。
  # #1115：剧本已改写为进程内集成测试（crates/daemon/tests/scenarios/
  # process_failures.rs），自己 cargo test --release 编译，不再用 build job 的二进制。
  scenarios:
    name: T-070 failure scenarios (in-process)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'e2e')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set Rust toolchain from rust-toolchain.toml
        shell: bash
        run: tools/setup-rust-toolchain.sh

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: scenarios-${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: System codecs
        uses: ./.github/actions/system-codecs

      # 磁盘满剧本：存储端整个目录放进 6MB tmpfs（需要 root mount，runner 有
      # passwordless sudo），500 x 16KB ≈ 8MB 必然放不下。
      - name: Mount 6MB tmpfs for the disk-full scenario
        run: |
          sudo mkdir -p /tmp/ppf-small-fs
          sudo mount -t tmpfs -o size=6m tmpfs /tmp/ppf-small-fs
          sudo chmod 777 /tmp/ppf-small-fs
          df -h /tmp/ppf-small-fs

      - name: Run scenarios (huge file / crash recovery / disk full)
        env:
          PPF_SCENARIO_SMALL_FS: /tmp/ppf-small-fs
        run: cargo test --release -p daemon --test scenarios -- --ignored --test-threads=1
