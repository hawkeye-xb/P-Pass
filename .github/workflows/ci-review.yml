# 独立评审（#1410 落地，#1435 起即合入门禁，#1470 改为只评正式 PR、只评增量、三级结论）：CI 上的评审 job 就是
# AGENTS.md「独立评审」。
#
# 什么时候评（#1470）：草稿 PR 不评；正式 PR（opened 非草稿、ready_for_review、synchronize、reopened）评，与 CI 并行。
# 推新提交只评增量（上次评到的提交是头提交的祖先时）；edited（只改正文）与只合进 main 的推送复用上次结论、不调模型；
# 只有阻断级（误放行 / 安全 / 越界）意见让 review/agent 为 failure。判定都在 tools/flow/review.sh。
# owner 复核放行：仓库 owner 在 PR 上评论「/review-override <理由>」，override job 核对作者后把该头提交的
# review/agent 改为 success（tools/flow/ci-review.sh override）。
#
# 门禁怎么成立：结论写成提交状态 review/agent（success / failure / error / pending），它是 main 的必需检查，
# 来源锁定 GitHub Actions（app_id 15368），本机 gh 写的同名状态不算。状态按提交记：推了新提交，新提交上
# 没有 review/agent，旧结论自然作废；error（评审没跑成）、pending 都不算通过。job 本身永远成功，结论只看状态。
# 自动合入不在这里开：用 GITHUB_TOKEN 开的自动合入，合入由 github-actions 完成，不触发 main 上的 push 流水线；
# 改由开 PR 的会话用自己的身份开（just done），靠必需检查把关。
#
# ⚠️ 为什么是 pull_request_target：评审结论是门禁，评审工具（本文件、tools/flow/*.sh、review-prompt.md、
# 界面路径清单、核心名单）必须取 main 上的版本，否则 PR 改一下评审脚本就能让自己恒判通过。PR 头提交只当
# 被读的数据：review.sh 从 refs/pull/N/head 建临时只读检出，评审 agent 只有 Read / Grep / Glob，且不读检出里的
# .claude/ 配置、hooks、MCP（ci-review.sh 的 agent 那步加 --setting-sources user --strict-mcp-config；那步也不给任何 GitHub token）。
# 别往这里加执行 PR 代码的步骤（构建、测试、npm install PR 里的依赖）。
# 代价：改评审工具本身的 PR 按 main 上的旧工具评审。
#
# 配置（名字别改）：Secret PPASS_REVIEW_API_KEY；Variables PPASS_REVIEW_BASE_URL、PPASS_REVIEW_MODEL。
# Dependabot 的 PR 只拿得到 Dependabot secrets：同名 Secret 要另存一份（gh secret set PPASS_REVIEW_API_KEY
# --app dependabot）；Variables 对 Dependabot 是否可读文档没写明，这里给与现值相同的默认值兜底。
# Dependabot 触发时 GITHUB_TOKEN 默认只读，下面显式写的 permissions 会把它提到所需权限。
# fork 的 PR 跳过（拿不到 Secret，也不该拿）：review/agent 不出现，合不进，由 owner 处理。
name: CI Review

on:
  pull_request_target:
    branches: [main]
    # 草稿不评（下面 if 挡）；三级都直接开正式 PR，开了草稿的转正式时（ready_for_review）评（#1470）。
    types: [opened, synchronize, reopened, ready_for_review, edited]
  # owner 复核放行（/review-override <理由>）；issue_comment 的 workflow 取 main 上的版本。
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  statuses: write
  issues: read

jobs:
  review:
    name: review (独立评审)
    # edited 只认人改正文（如补方案引用）：CodeRabbit 等 bot 会改 PR 正文写摘要，不能每次都让同一提交重评一遍
    # （LLM 结论有波动，同一提交的 success 可能被重评成 failure），也不能把正在跑的评审取消掉。
    # 草稿不评（#1470）；edited 头提交已评过时 review.sh 复用结论、不调模型。
    if: >-
      ${{ github.event_name == 'pull_request_target'
      && github.event.pull_request.head.repo.full_name == github.repository
      && !github.event.pull_request.draft
      && (github.event.action != 'edited' || (github.event.sender.type != 'Bot' && github.event.changes.body != null)) }}
    # 并发写在 job 上而不是 workflow 上：被上面 if 跳过的运行不进并发组，不会取消正在跑的评审。
    concurrency:
      group: ci-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # token 按步骤给：GH_TOKEN 只给「先写 pending」「准备」「发布」三步，评审 key 只给「评审」那步；跑 agent 的那步没有任何 GitHub token。
    env:
      PPASS_HOOK_REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      # 第一步就写 pending（#1441）：edited（如改了方案引用）后、新结论出来前，这个头提交上不能还挂着旧的 success，
      # 否则自动合入会在检出、装 claude 那几分钟里抢先合入。只用事件里的头提交，不检出任何代码。
      # continue-on-error：这一步失败（GitHub API 一时不通）不能让后面的检出、评审、发布都被跳过——那样同一头提交上
      # 旧的 success 会留着；准备那步会再写一次 pending，发布那步照常写出最终结论。
      - name: 先写 pending（检出之前）
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" -f state=pending -f context="review/agent" \
            -f description="独立评审进行中" >/dev/null
      # 检出 main（pull_request_target 的默认 ref），不检出 PR 头提交；PR 内容由 review.sh 只读取用。
      # persist-credentials: false：不把 GITHUB_TOKEN 写进磁盘上的 git 配置，评审 agent 用 Read 读不到。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: 安装评审用的 claude 命令行（版本写死）
        run: npm install -g @anthropic-ai/claude-code@2.1.318
      - name: 准备（写 pending、取 PR、建只读检出）
        env:
          GH_TOKEN: ${{ github.token }}
          PPASS_REVIEW_MODEL: ${{ vars.PPASS_REVIEW_MODEL || 'deepseek-flash' }}
        run: bash tools/flow/ci-review.sh prepare "$PR"
      - name: 评审（不带任何 GitHub token）
        env:
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.PPASS_REVIEW_API_KEY }}
          ANTHROPIC_BASE_URL: ${{ vars.PPASS_REVIEW_BASE_URL || 'https://api.deepseek.com/anthropic' }}
        run: bash tools/flow/ci-review.sh agent
      - name: 发布结论（必需检查 review/agent 与评论；job 永远成功）
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/flow/ci-review.sh publish "$PR"

  # owner 复核放行（#1470）：不装 claude、不拿评审 key、不调模型。作者与权限由 ci-review.sh 用 gh api 现查（只认对本仓
  # 有 admin 权限的真人账号），这里的 if 只是尽早过滤，免得每条评论都起一次 run。
  override:
    name: review override (owner 复核放行)
    if: >-
      ${{ github.event_name == 'issue_comment' && github.event.issue.pull_request
      && startsWith(github.event.comment.body, '/review-override') }}
    # 与评审同一并发组但不取消：正在跑的评审先跑完，放行后写，不会被评审结论盖掉。
    concurrency:
      group: ci-review-${{ github.event.issue.number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PPASS_HOOK_REPO: ${{ github.repository }}
      PR: ${{ github.event.issue.number }}
      COMMENT_ID: ${{ github.event.comment.id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 核对 owner、放行（不调模型）
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/flow/ci-review.sh override "$PR" "$COMMENT_ID"
