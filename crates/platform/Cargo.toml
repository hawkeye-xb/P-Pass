[package]
name = "platform"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
# QA-09 迁移（#211 / #287）：只给测试用的平台能力（造「指向目录的链接」）。
# 默认关闭 —— 关着时 src/test_support.rs 整个不参与编译，产品二进制里不会
# 多出任何东西。消费方在 [dev-dependencies] 里开它。
test-support = []

[dependencies]
thiserror.workspace = true
# #1047：停止信号（SIGTERM / Windows 控制台事件）。只开 signal + 运行时，
# 不拉 net/io。
tokio = { version = "1", features = ["signal", "rt"] }

# QA-09 迁移（#211）：statvfs（卷容量水位 / DAE-05）。原先这个调用长在
# crates/daemon 里，libc 也声明在那边；迁进来之后 daemon 不再需要它。
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# HKCU Run key (user-level autostart, §4).
winreg = "0.55"
# SetThreadExecutionState.
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Power",
  # SEC-07 (#289): OpenProcessToken/GetTokenInformation 取当前用户 SID，
  # SetEntriesInAclW + SetNamedSecurityInfoW 重写身份密钥的 DACL。
  "Win32_Security",
  "Win32_Security_Authorization",
  # DAE-05: GetDiskFreeSpaceExW（卷容量水位）。
  "Win32_Storage_FileSystem",
  # DAE-11 (#804) 电源来源订阅的回调常量（DEVICE_NOTIFY_CALLBACK 等）。
  "Win32_UI_WindowsAndMessaging",
  # OpenProcessToken / GetCurrentProcess 等。
  "Win32_System_Threading",
  # DESK-52 (#787): 结束 daemon 改走系统 API，不再拉起 taskkill.exe——
  # CreateToolhelp32Snapshot 列进程，ProcessIdToSessionId 只认本会话的。
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_RemoteDesktop",
  # DESK-58 (#875): GetStdHandle/SetStdHandle/GetConsoleMode——没人接的
  # stderr 改接到 logs\daemon.err。
  "Win32_System_Console",
] }

# DESK-16 (#165)：Windows 的系统缩略图走 COM（IShellItemImageFactory），
# 而 windows-sys 是裸 FFI —— 没有 IUnknown/Interface 那套，做 COM 要手搓
# vtable，写对的成本远高于收益。所以这里用高层 `windows` crate。
# ⚠️ 它**不是新引入的 crate**：`cargo tree -i windows@0.62.2 --target
#    x86_64-pc-windows-msvc` 显示它早已在主 workspace 的 Windows 依赖树里
#    （netwatch ← iroh ← iroh-blobs ← transport ← daemon），这里只是提为
#    直接依赖并多开几个 feature。
windows = { version = "0.62", features = [
  "Win32_Foundation",
  # CoInitializeEx / CoUninitialize —— COM 必须先初始化线程套间。
  "Win32_System_Com",
  # SHCreateItemFromParsingName + IShellItemImageFactory。
  "Win32_UI_Shell",
  # GetDIBits / BITMAP / DeleteObject —— 把 HBITMAP 变成像素要走 GDI。
  "Win32_Graphics_Gdi",
  # DESK-17 (#166)：WinRT toast —— ToastNotificationManager / XmlDocument，
  # 以及工作线程上的 RoInitialize。
  "UI_Notifications",
  "Data_Xml_Dom",
  "Win32_System_WinRT",
  # DESK-65 (#957)：常驻服务交给任务计划程序——ITaskService / IRegisteredTask，
  # 参数里的 VARIANT / BSTR 在后两个 feature 下。
  "Win32_System_TaskScheduler",
  "Win32_System_Ole",
  "Win32_System_Variant",
] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
# fsevents_shapes 集成测试（macOS 目录监听平台行为实测）：直接驱动 notify。
notify = "7"
tempfile = "3"
