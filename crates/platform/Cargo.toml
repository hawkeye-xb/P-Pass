[package]
name = "platform"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
thiserror.workspace = true

# QA-09 迁移（#211）：statvfs（卷容量水位 / DAE-05）。原先这个调用长在
# crates/daemon 里，libc 也声明在那边；迁进来之后 daemon 不再需要它。
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# HKCU Run key (user-level autostart, §4).
winreg = "0.55"
# SetThreadExecutionState + DPAPI.
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Power",
  "Win32_Security_Cryptography",
  # DAE-05: GetDiskFreeSpaceExW（卷容量水位）。
  "Win32_Storage_FileSystem",
] }

[dev-dependencies]
# fsevents_shapes 集成测试（macOS 目录监听平台行为实测）：直接驱动 notify。
notify = "7"
tempfile = "3"
