# 独立评审搬到 CI（#1410）：试跑期只提示，不挡合入。
#
# 结论写成 PR 评论 + 非必需的提交状态 review/agent；job 永远成功。攒够误拦、漏放的数据后，
# 由产品负责人决定是否设为必需检查。与 CodeRabbit 分工：它管通用代码问题，这里只核对关联卡
# 的「范围」「验收场景」和同类问题有没有漏改（tools/flow/review-prompt.md）。
#
# 配置（仓库里已配好，名字别改）：Secret PPASS_REVIEW_API_KEY；Variables PPASS_REVIEW_BASE_URL、
# PPASS_REVIEW_MODEL。key 只给本仓库分支的 PR：fork 的 PR 跳过（拿不到 Secret，也不该拿）。
# 用 pull_request（跑 PR 分支里的脚本）而不是 pull_request_target：本仓库分支的 PR 本来就有写权限。
name: CI Review

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read
  pull-requests: write
  statuses: write
  issues: read

concurrency:
  group: ci-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: review (独立评审，试跑期不挡合入)
    if: ${{ !github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      PPASS_HOOK_REPO: ${{ github.repository }}
      ANTHROPIC_AUTH_TOKEN: ${{ secrets.PPASS_REVIEW_API_KEY }}
      ANTHROPIC_BASE_URL: ${{ vars.PPASS_REVIEW_BASE_URL }}
      PPASS_REVIEW_MODEL: ${{ vars.PPASS_REVIEW_MODEL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: 安装评审用的 claude 命令行（版本写死）
        run: npm install -g @anthropic-ai/claude-code@2.1.318
      - name: 评审（永远成功；失败写成状态与评论）
        env:
          PR: ${{ github.event.pull_request.number }}
        run: bash tools/flow/ci-review.sh "$PR"
