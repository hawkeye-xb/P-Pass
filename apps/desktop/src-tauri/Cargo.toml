# Standalone workspace on purpose: the tray shell has ZERO business
# logic (ADR-012) — it speaks the daemon's local IPC protocol only, so
# it depends on no internal crate, and the huge Tauri tree stays out of
# the main workspace's build/CI.
[workspace]

[package]
name = "p-pass-desktop"
version = "0.4.0-test.8"
edition = "2021"
license = "AGPL-3.0"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "devtools"] }
tauri-plugin-dialog = "2"
# UPD-01: desktop self-update via the official updater plugin (manifest
# served as release asset; pubkey in tauri.conf.json, minisign format)
tauri-plugin-updater = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
interprocess = "2"
# DESK-10: 诊断包由桌面壳本地组装（daemon 挂着也要能导出）——打包/
# 读回 daemon 那份 zip 都要 zip crate（与 daemon 侧同一大版本）。
zip = "5"
# System adapter (power hint, data dir) — not business logic.
platform = { path = "../../../crates/platform" }

[lib]
name = "p_pass_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dev-dependencies]
tempfile = "3"
