[package]
name = "platform"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
thiserror.workspace = true

[target.'cfg(windows)'.dependencies]
# HKCU Run key (user-level autostart, §4).
winreg = "0.55"
# SetThreadExecutionState + DPAPI.
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Power",
  "Win32_Security_Cryptography",
] }

[dev-dependencies]
# fsevents_shapes 集成测试（macOS 目录监听平台行为实测）：直接驱动 notify。
notify = "7"
tempfile = "3"
