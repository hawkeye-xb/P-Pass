# Release pipeline (T-071) — tag v* → 双平台构建 → SHA256 → 签名门控 →
# SLSA attestation → Release 草稿。
#
# 凭据策略（无凭据路径 = 卡面验收）：
#   - macOS 签名/公证：APPLE_CERT_P12 / APPLE_CERT_PASSWORD /
#     APPLE_NOTARY_KEY(_ID/_ISSUER) 任一缺失 → 跳过该步，notes 标注"未签名"。
#     secret 槽位由 gh secret set 预建，值来自 H-02（Apple 开发者证书 $99/年）。
#   - Windows：当前不签名（Authenticode 证书 H-02 范畴），notes 标注。
#   - 环境批准门：macos job 挂 environment: release-signing —— 在
#     Settings → Environments 把 owner 加为 required reviewer 后生效；
#     未配置保护规则时自动通过，不阻塞无凭据路径。
#
# 测试验收：打一个测试 tag（如 v0.2.0-test.1）→ workflow 走通到"签名前"全链
# → 生成带 SHA256SUMS 的 Release 草稿（无凭据时签名步跳过）。

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "手工触发的 tag 名（草稿发布用）"
        required: false

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  macos-arm64:
    name: "macOS arm64 (签名门控)"
    runs-on: macos-14
    environment: release-signing
    env:
      APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
      APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
      APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
      APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
      APPLE_NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER }}
      # 公证凭据二选一：API key（--key/--key-id/--issuer）或
      # Apple ID + App-Specific Password + Team ID（Xisper 先例，.env.build 变量同名）
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    outputs:
      signed: ${{ steps.signtag.outputs.signed }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: macos-arm64-release-${{ hashFiles('**/Cargo.lock') }}

      - name: System codecs (libheif via brew)
        run: brew install libheif

      - name: Build release binaries
        run: cargo build --release -p daemon -p testclient

      - name: Bundle self-contained (dylibs + rpath rewrite)
        run: |
          set -euo pipefail
          rm -rf /tmp/rel && mkdir -p /tmp/rel
          tools/bundle-macos.sh /tmp/rel target/release/daemon target/release/testclient
          cp tools/dogfood-smoke.sh /tmp/rel/ || true
          echo "built from ${GITHUB_SHA} on $(date -u +%FT%TZ)" > /tmp/rel/BUILD_INFO

      # ── 签名门控：无凭据 → 跳过（卡面验收路径） ─────────────────
      - name: Codesign (gated)
        id: codesign
        if: env.APPLE_CERT_P12 != ''
        env:
          CERT_P12: ${{ runner.temp }}/cert.p12
        run: |
          set -euo pipefail
          echo "$APPLE_CERT_P12" | base64 --decode > "$CERT_P12"
          KEYCHAIN=$RUNNER_TEMP/ppsign.keychain-db
          security create-keychain -p pp "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p pp "$KEYCHAIN"
          security import "$CERT_P12" -P "$APPLE_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -s -k pp "$KEYCHAIN" >/dev/null
          /usr/bin/codesign --force --options runtime --timestamp \
            --sign "$(security find-identity -v -p codesigning "$KEYCHAIN" | awk 'NR==2{print $2}')" \
            /tmp/rel/daemon /tmp/rel/testclient
          echo "signed=yes" >> "$GITHUB_OUTPUT"

      - name: Notarize + staple (gated)
        if: env.APPLE_CERT_P12 != '' && (env.APPLE_NOTARY_KEY != '' || env.APPLE_ID != '')
        run: |
          set -euo pipefail
          # 双路径：API key（CI 标准）或 Apple ID + App-Specific Password（Xisper 先例）
          NOTARY_ARGS=""
          if [ -n "${APPLE_NOTARY_KEY:-}" ]; then
            NOTARY_ARGS="--key $APPLE_NOTARY_KEY --key-id $APPLE_NOTARY_KEY_ID --issuer $APPLE_NOTARY_ISSUER"
          else
            NOTARY_ARGS="--apple-id $APPLE_ID --password $APPLE_APP_SPECIFIC_PASSWORD --team-id $APPLE_TEAM_ID"
          fi
          for bin in /tmp/rel/daemon /tmp/rel/testclient; do
            ditto -c -k --keepParent "$bin" "$bin.zip"
            xcrun notarytool submit "$bin.zip" $NOTARY_ARGS --wait --timeout 15m
            xcrun stapler staple "$bin"
            rm -f "$bin.zip"
          done

      - name: Signing status tag
        id: signtag
        run: |
          SIG="no"
          if [ "${{ steps.codesign.outputs.signed }}" = "yes" ]; then SIG="yes"; fi
          echo "signed=$SIG" >> "$GITHUB_OUTPUT"

      - name: SHA256 + notes
        run: |
          cd /tmp/rel
          shasum -a 256 daemon testclient > SHA256SUMS
          cat SHA256SUMS

      - name: SLSA attestation
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: /tmp/rel/daemon, /tmp/rel/testclient

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: /tmp/rel

  windows-x64:
    name: "Windows x64 (未签名)"
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: win-x64-release-${{ hashFiles('**/Cargo.lock') }}

      # libheif via vcpkg（Windows 规范路径；windows-latest 预装 C:\vcpkg）。
      # triplet x64-windows-static-md 与 vcpkg crate 默认一致（实测 x64-windows
      # 动态版不匹配：报 "not installed for triplet x64-windows-static-md"）。
      # 静态链接 → 自包含 exe，发布无需带 DLL。首次从源码编 libheif+依赖
      # （libde265 等），10-20 分钟，故 timeout 45。
      - name: Install libheif (vcpkg)
        shell: bash
        run: |
          /c/vcpkg/vcpkg.exe install "libheif:x64-windows-static-md" --clean-after-build

      - name: Build release binaries
        shell: bash
        env:
          VCPKG_ROOT: "C:\\vcpkg"
        run: cargo build --release -p daemon -p testclient

      - name: SHA256 + notes
        shell: bash
        run: |
          cd target/release
          sha256sum daemon.exe testclient.exe > SHA256SUMS
          cat SHA256SUMS
          echo "built from ${GITHUB_SHA} on $(date -u +%FT%TZ)" > BUILD_INFO

      - name: SLSA attestation
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: target/release/daemon.exe, target/release/testclient.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            target/release/daemon.exe
            target/release/testclient.exe
            target/release/SHA256SUMS
            target/release/BUILD_INFO

  release:
    name: "Release 草稿"
    needs: [macos-arm64, windows-x64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Compose notes
        run: |
          TAG="${GITHUB_REF_NAME}"
          [ -n "$TAG" ] || TAG="${{ inputs.tag }}"
          : > NOTES.md
          echo "## P-Pass ${TAG#v}" >> NOTES.md
          echo "" >> NOTES.md
          echo "构建自 \`${GITHUB_SHA::7}\` · $(date -u +%FT%TZ)Z" >> NOTES.md
          echo "" >> NOTES.md
          echo "**签名状态**：macOS=${{ needs.macos-arm64.outputs.signed }}（无凭据路径跳过）/ Windows=no（Authenticode 证书 H-02 范畴）" >> NOTES.md
          echo "" >> NOTES.md
          echo "### SHA-256" >> NOTES.md
          for plat in macos-arm64 windows-x64; do
            if [ -f "artifacts/$plat/SHA256SUMS" ]; then
              echo "" >> NOTES.md
              echo "**$plat**" >> NOTES.md
              echo '```' >> NOTES.md
              cat "artifacts/$plat/SHA256SUMS" >> NOTES.md
              echo '```' >> NOTES.md
            fi
          done
          echo "" >> NOTES.md
          echo "### 验证（被拦截/不信任时先做这三步）" >> NOTES.md
          echo "- 对照上方 SHA-256（certutil/shasum）" >> NOTES.md
          echo "- Release 页的 Provenance 面板（SLSA attestation）" >> NOTES.md
          echo "- 源码可查：构建流程 .github/workflows/release.yml" >> NOTES.md
          echo "" >> NOTES.md
          echo "被杀软拦截了？见 docs/troubleshooting/blocked-by-av.md" >> NOTES.md

      - name: VirusTotal 提交（gated，卡面 VT 步——支持 blocked-by-av 信誉建设）
        if: env.VT_API_KEY != ''
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        run: |
          EXE="artifacts/windows-x64/daemon.exe"
          [ -f "$EXE" ] || exit 0
          ID=$(curl -sf -X POST -H "x-apikey: $VT_API_KEY" \
            -F "file=@$EXE" https://www.virustotal.com/api/v3/files \
            | jq -r .data.id)
          echo "VirusTotal 分析 ID: $ID（草稿发布后见扫描结果链接）" >> ../NOTES.md

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          [ -n "$TAG" ] || TAG="${{ inputs.tag }}"
          cd artifacts
          find . -type f ! -name SHA256SUMS ! -name BUILD_INFO -print0 | xargs -0 \
            gh release create "$TAG" --draft --title "P-Pass ${TAG#v}" --notes-file ../NOTES.md
          echo "草稿: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
