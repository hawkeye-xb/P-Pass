[package]
name = "daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
proto = { path = "../proto" }
transport = { path = "../transport" }
storage = { path = "../storage" }
core-index = { path = "../core-index" }
media-codec = { path = "../media-codec" }
diag = { path = "../diag" }
# base64 for in-frame thumbnail bytes (already in tree via storage).
base64 = "0.22"
thiserror.workspace = true
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
futures-core = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util"] }
# OS randomness for one-time pairing tokens (T-031). Already in the tree
# via iroh; declared directly because tokens are a security surface.
getrandom = "0.3"
interprocess = { version = "2", features = ["tokio"] }
zip = { version = "5", default-features = false, features = ["deflate"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

[dev-dependencies]
tempfile = "3"
blake3 = "1"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
