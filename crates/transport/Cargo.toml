[package]
name = "transport"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[features]
# Enabled only by the Android bridge build. This keeps JNI descriptor APIs out
# of non-Android release targets without platform cfg outside crates/platform/.
# IOS-05 (#312): jni/libc are only reachable through this feature, so the
# platform-neutral provider kernel (src/provider.rs) cannot name `jni::` —
# the default build has no such crate to import.
android-jni = ["dep:jni", "dep:libc"]
# IOS-06 (#313) / #1124: UniFFI binding shared by both phones — the iOS
# XCFramework (Swift) and Android's libtransport.so (Kotlin) export the same
# objects. Same rule as android-jni: a feature, never a target_os cfg
# (arch-check B.2); enabled only by tools/build-ios-transport-xcframework.sh
# and tools/build-android-iroh-blobs-bridge.sh.
mobile-ffi = ["dep:uniffi", "dep:blake3"]
# Swift / Kotlin binding generator (host-only tool, run by the same scripts).
mobile-bindgen = ["mobile-ffi", "uniffi/cli"]

[dependencies]
# ADR-001 / §B.1: iroh is allowed in this crate ONLY. Declared here (not in
# workspace.dependencies) to keep the isolation visible at a glance.
iroh = "1"
tokio = { workspace = true, features = ["rt-multi-thread", "fs", "time", "sync"] }
tokio-util = { version = "0.7", features = ["io"] }
# #1122：对端地址簿有上限、按最近使用淘汰（已在依赖树里）。
lru = "0.18"
jni = { version = "0.21", optional = true }
libc = { version = "0.2", optional = true }
futures-core.workspace = true
thiserror.workspace = true
tracing.workspace = true
# PeerAddr <-> QR-safe string (both already in the tree).
serde_json.workspace = true
base64 = "0.22" 
iroh-blobs = { version = "0.103", default-features = false, features = ["fs-store"] }
uniffi = { version = "0.32", optional = true }
# #1122：关闭码等跨端注册表的唯一定义处（纯 serde，无平台依赖）。
proto = { path = "../proto" }
blake3 = { version = "1", optional = true }

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["mobile-bindgen"]

[dev-dependencies]
proto = { path = "../proto" }
serde_json.workspace = true
tokio = { version = "1", features = ["sync", "rt-multi-thread", "macros", "time"] }
blake3 = "1"
tempfile = "3"
# Deterministic partial-blob seeding in the T-021 resume test (same
# version as iroh-blobs' own bao-tree — the encodings must agree).
bao-tree = "0.16"
iroh-blobs = { version = "0.103", default-features = false, features = ["fs-store"] }
futures-core.workspace = true
