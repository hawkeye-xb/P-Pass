# #182: secret 扫描 lane。与本地 pre-commit 用同一份 .gitleaks.toml。
#
# 不加 paths 过滤：凭据可以出现在任何文件里；全量触发，秒级成本。
# 用 gitleaks CLI（MIT）而不是 gitleaks/gitleaks-action（v2 起商业许可）。
# 二进制下载后校验 sha256，与 actionlint 同一口径。
name: CI Secrets

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 要算 base..head / before..sha，浅克隆会让区间失败（失败方向是「查不到=放行」）。
          fetch-depth: 0
          persist-credentials: false

      - name: 安装 gitleaks（固定版本 + sha256 校验）
        run: |
          set -euo pipefail
          curl -sfL -o /tmp/gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks

      - name: 扫描本次引入的提交
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ZERO=0000000000000000000000000000000000000000
          if [ "$EVENT" = "pull_request" ]; then
            git fetch -q origin "$GITHUB_BASE_REF"
            RANGE="origin/$GITHUB_BASE_REF..$SHA"
          elif [ -n "${BEFORE:-}" ] && [ "$BEFORE" != "$ZERO" ] \
               && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            RANGE="$BEFORE..$SHA"
          else
            # 新分支 / 强推后 before 不可用：退化为扫全史，宁可多查也不静默放行。
            RANGE="$(git rev-list --max-parents=0 "$SHA" | tail -1)..$SHA"
          fi
          echo "扫描区间: $RANGE"
          # --ignore-gitleaks-allow：行内 `gitleaks:allow` 不生效，白名单只能写在 .gitleaks.toml。
          /tmp/gitleaks git --config .gitleaks.toml --ignore-gitleaks-allow \
            --redact --verbose --log-opts="$RANGE" .
