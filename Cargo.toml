[workspace]
members = [
  "crates/proto",
  "crates/core-index",
  "crates/core-media",
  "crates/transport",
  "crates/storage",
  "crates/media-codec",
  "crates/platform",
  "crates/daemon",
  "crates/diag",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0"
repository = "https://github.com/hawkeye-xb/P-Pass"
rust-version = "1.80"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
