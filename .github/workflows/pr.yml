name: PR Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  pr:
    name: lint + test + arch-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: System codecs (libheif + HEVC plugin for HEIC, ffmpeg for video thumbs)
        # libheif-plugin-libde265 is the HEVC decode plugin — without it
        # libheif opens HEIC containers but cannot decode the pixels
        # ("Unsupported codec"), verified in a clean noble container.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libheif-dev libheif-plugin-libde265 ffmpeg

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test (nextest)
        run: cargo nextest run --all-features

      - name: Architecture enforcement
        run: bash tools/arch-check.sh

      - name: License and dependency audit
        run: cargo deny check advisories licenses bans
