name: site

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/site.yml'
  workflow_dispatch:

# Site line only: builds the Astro static site under site/ and deploys to
# GitHub Pages. Fully isolated from the main CI (pr.yml / e2e.yml / release.yml)
# — app code changes never trigger this workflow.

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Token/icon derivation must stay in sync with design source of truth.
      # tokens.css / public/icons/ ARE committed; these asserts catch edits to
      # tokens.json / icon SVGs that forgot to regenerate the derived files.
      - name: Assert tokens.css matches tokens.json
        run: npm run tokens:check

      - name: Assert icons match design source
        run: npm run icons:check

      - name: Build (regenerates tokens + icons, then astro build)
        run: npm run build

      - name: Zero third-party requests
        run: |
          set -euo pipefail
          # Allowlist: our own domain (self) + github.com (deliberate outbound
          # download links). Any other external origin in built assets means
          # a tracker / CDN / font leak — fail.
          ALLOW='^(https://p-pass\.hawkeye-xb\.com|https://github\.com)'
          BAD=$(grep -rEoh 'https?://[^"'"'"' )]+' dist --include='*.html' --include='*.css' --include='*.js' | grep -vE "$ALLOW" || true)
          if [ -n "$BAD" ]; then
            echo "third-party origin found in dist:"; echo "$BAD"; exit 1
          fi
          echo "no third-party requests ✓"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
