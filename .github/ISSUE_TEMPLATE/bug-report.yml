name: 问题报告 / Bug report
description: 备份、配对或浏览出了问题 / Something went wrong with backup, pairing or browsing
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        维护者只有一个人，按下面填得越全，修得越快。
        There is one maintainer, so the more complete this is, the faster it gets fixed.

        **请不要在这里上传诊断包。** 诊断包里有 IP 地址，这里所有人都能看到。需要时维护者会告诉你怎么私下发送。
        **Please don't upload a diagnostic bundle here.** It contains IP addresses and this page is public. The maintainer will tell you how to send it privately if needed.
  - type: input
    id: phone
    attributes:
      label: 手机型号和安卓版本 / Phone model and Android version
      placeholder: "Pixel 8, Android 15 / 小米 14, HyperOS 1.0"
    validations:
      required: true
  - type: input
    id: computer
    attributes:
      label: 电脑型号和系统版本 / Computer model and OS version
      placeholder: "MacBook Air M2, macOS 15.3"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: P-Pass 版本 / P-Pass version
      description: 手机和电脑上的版本号 / The version on the phone and on the computer
      placeholder: "phone 0.9.11, computer 0.9.5"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 你做了什么 / What you did
      description: 一步一步写，从哪一步开始不对 / Step by step, and where it went wrong
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: 发生了什么 / What happened
      description: 可以贴截图，注意别带出私人照片 / Screenshots welcome, but keep personal photos out of them
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 你期望发生什么 / What you expected
