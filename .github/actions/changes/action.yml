name: changes
description: >-
  按改动影响图判定本条 lane 要不要跑（#1187 / #2089）。ci-android / ci-ios / ci-docs 的 changes job 各引用一次。
  调用方必须先 checkout 且 fetch-depth: 0。

# 为什么从触发层挪到 job 层：被 workflow 级 `paths` 过滤掉的 workflow 根本不汇报状态，
# 设成必过项就永久 Pending（CI-07 #189）。job 级 `if:` 跳过会汇报 skipped，对必过项算通过，
# 所以既按需又挡得住。真正挡人的是每条 lane 末尾 `if: always()` 的汇总 job（tools/ci-gate.sh）。
#
# 口径：
#   - 优先使用 `lane`（委托统一依赖图引擎 `tools/ci/impact.py`，自测 `tools/test-ci-impact.py`）；
#   - 未传 `lane` 且传了 `paths` 时保留向后兼容（`tools/ci-paths.sh hit`）。
#   - pull_request → 与 PR base 比；push → 与 push 前的提交比（新分支全零 base 判要跑）；
#     其余事件（workflow_call、dispatch、schedule）→ 恒定要跑；任何异常 fail-closed 判 true。
#
# ⚠️ composite action 的每个 run 步骤都必须写 shell:；actionlint 不扫本文件。

inputs:
  lane:
    description: 依赖图引擎 tools/ci/impact.py 支持的 lane（android / ios / ios-ffi / docs / docs-flow / default / rust-workspace）
    required: false
    default: ""
  paths:
    description: 向后兼容：未传 lane 时与 GitHub paths 语法一致的 glob，一行一条；`#` 起头的行是注释
    required: false
    default: ""
outputs:
  run:
    description: "'true' 要跑 / 'false' 可跳过"
    value: ${{ steps.decide.outputs.run }}

runs:
  using: composite
  steps:
    # 判据脚本先过一遍自己的自测与反证再用。这一步红 ⇒ job 红 ⇒ 输出为空 ⇒
    # 下游按 `!= 'false'` 照跑，汇总 job 因本 job failure 判红。
    - name: 判据自检（含变异反证）
      shell: bash
      run: |
        set -euo pipefail
        bash tools/test-ci-paths.sh
        python3 -B -I tools/test-ci-impact.py
    - id: decide
      shell: bash
      env:
        EVENT: ${{ github.event_name }}
        PR_BASE: ${{ github.event.pull_request.base.sha }}
        PUSH_BEFORE: ${{ github.event.before }}
        LANE: ${{ inputs.lane }}
        GLOBS: ${{ inputs.paths }}
      run: |
        set -uo pipefail
        case "$EVENT" in
          pull_request) base="$PR_BASE" ;;
          push) base="$PUSH_BEFORE" ;;
          *)
            echo "事件 ${EVENT} → 恒定要跑"
            echo "run=true" >>"$GITHUB_OUTPUT"
            exit 0
            ;;
        esac
        if [ -n "${LANE:-}" ]; then
          rc=0
          run="$(python3 -B -I tools/ci/impact.py ci --base "$base" --lane "$LANE")" || rc=$?
          if [ "$rc" -ne 0 ] || { [ "$run" != "true" ] && [ "$run" != "false" ]; }; then
            echo "impact.py 异常（rc=${rc}，out=${run}）→ fail-closed: true" >&2
            run=true
          fi
        elif [ -n "${GLOBS:-}" ]; then
          globs=()
          while IFS= read -r g; do
            g="${g#"${g%%[![:space:]]*}"}"
            case "$g" in '' | '#'*) continue ;; esac
            globs+=("$g")
          done <<<"$GLOBS"
          run="$(tools/ci-paths.sh hit "$base" "${globs[@]}")"
        else
          echo "changes action 既未传 lane 也未传 paths → fail-closed: true" >&2
          run=true
        fi
        echo "判定结果: run=${run}"
        echo "run=${run}" >>"$GITHUB_OUTPUT"
