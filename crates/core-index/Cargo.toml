[package]
name = "core-index"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
storage = { path = "../storage" }
# EXIF metadata (T-013: ingest 换用 core-media, as planned at T-011).
core-media = { path = "../core-media" }
# BLAKE3 content hash — same domain as iroh-blobs (架构 §4.2).
blake3 = "1"
# Calendar math: taken_at → <yyyy>/<mm> dirs.
time = "0.3"
thiserror.workspace = true

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
proptest = "1"
tempfile = "3"
