[workspace]
members = [
  "crates/proto",
  "crates/core-index",
  "crates/core-media",
  "crates/transport",
  "crates/storage",
  "crates/media-codec",
  "crates/platform",
  "crates/daemon",
  "crates/diag",
  "tools/testclient",
]
exclude = ["spikes/iroh-probe", "spikes/thumb-bench"]
resolver = "2"

[workspace.package]
version = "0.4.0-test.3"
edition = "2021"
license = "AGPL-3.0"
repository = "https://github.com/hawkeye-xb/P-Pass"
rust-version = "1.80"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tokio = { version = "1", features = ["sync", "rt"] }
futures-core = "0.3"
